        const qSet1 = [{"id": 1, "chapter": "第1章 认识数据", "question": "在数据科学中，“数据（Data）”、“资讯（Information）”与“知识（Knowledge）”的层级关系，下列陈述何者正确？", "options": {"A": "雷达原始脉冲数值是数据，标注时间地点后为资讯", "B": "数据必须有人类主观情绪，机器统计报表仅是数据", "C": "资讯是未经处理的符号，数据是关联分析后的指南", "D": "只要存储容量足够，杂乱数据可自动升华为知识"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第1章 认识数据 · 数据与资讯的本质区别", "analysis": "数据（Data）是未经加工的原始事实与符号；赋予时间、地点等背景后转化为资讯（Information）；提炼规律后上升为知识。A选项准确表述了数据到资讯的转化。"}, {"id": 2, "chapter": "第1章 认识数据", "question": "计算机底层采用二进制运算。将无符号八位二进制数 (00110101)₂ 转换为十进制与十六进制数，分别为：", "options": {"A": "十进制 51，十六进制 33H", "B": "十进制 53，十六进制 35H", "C": "十进制 55，十六进制 37H", "D": "十进制 49，十六进制 31H"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第1章 认识数据 · 进位制转换与二进制法则", "analysis": "(00110101)₂ = 32 + 16 + 4 + 1 = 53（十进制）。按四位一组拆分：0011₂ = 3，0101₂ = 5，对应十六进制 35H。故选 B。"}, {"id": 3, "chapter": "第1章 认识数据", "question": "关于 ASCII 码与 Unicode / UTF-8 编码标准，下列叙述何者正确？", "options": {"A": "ASCII 码占 2 字节，原生收录中文与 Emoji", "B": "Unicode 采用固定 8 位编码，汉字存储比 ASCII 小", "C": "标准 ASCII 用 7 位表示 128 字符；UTF-8 兼容 ASCII 且支持多语言", "D": "UTF-8 是定长编码，所有英文字符和汉字均固定占 4 字节"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第1章 认识数据 · 字符编码体系", "analysis": "标准 ASCII 采用 7 位编码，表示 128 个字符；Unicode 支持全球语言符号，UTF-8 是其变长实现，完全兼容标准 ASCII。故选 C。"}, {"id": 4, "chapter": "第1章 认识数据", "question": "在多媒体技术中，点阵图（Bitmap）与向量图（Vector Graphic）的特性对比，何者正确？", "options": {"A": "点阵图由数学公式描述，缩放时不失真", "B": "向量图记录各像素 RGB，适合细腻的自然风景照", "C": "SVG 属于点阵图，相机拍摄的 JPEG 属于向量图", "D": "点阵图由像素网格构成，放大易出现锯齿模糊"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第1章 认识数据 · 图像数字化与图像格式", "analysis": "点阵图由像素阵列组成，放大后像素被拉伸导致锯齿模糊；向量图由几何数学公式描述，缩放不失真。故选 D。"}, {"id": 5, "chapter": "第1章 认识数据", "question": "一张未压缩真彩色照片分辨率为 1920 × 1080 像素，色彩深度为 24 位（24-bit True Color）。其原始数据容量约为：", "options": {"A": "2.07 MB", "B": "5.93 MB", "C": "16.59 MB", "D": "47.46 MB"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第1章 认识数据 · 数字图像存储容量计算", "analysis": "容量 = 1920 × 1080 × (24 / 8) Bytes = 6,220,800 Bytes ≈ 5.93 MB。故选 B。"}, {"id": 6, "chapter": "第1章 认识数据", "question": "声音信号转换为数字音频（ADC）必须经历的三大基本步骤依次为：", "options": {"A": "采样（Sampling） ➔ 编码（Encoding） ➔ 量化（Quantization）", "B": "量化（Quantization） ➔ 采样（Sampling） ➔ 压缩（Compression）", "C": "采样（Sampling） ➔ 量化（Quantization） ➔ 编码（Encoding）", "D": "滤波（Filtering） ➔ 放大（Amplification） ➔ 解码（Decoding）"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第1章 认识数据 · 声音数字化三部曲", "analysis": "模拟声音转数字声音的标准流程为：1. 采样（时间离散化）➔ 2. 量化（振幅离散化）➔ 3. 编码（二进制化）。顺序不可颠倒，选 C。"}, {"id": 7, "chapter": "第1章 认识数据", "question": "录制一段 10 秒的标准 CD 音质音频：采样率 44.1 kHz、16 位量化、双声道立体声。未经压缩的数据量约为：", "options": {"A": "1.68 MB", "B": "3.36 MB", "C": "705.6 KB", "D": "14.11 MB"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第1章 认识数据 · 音频数据容量计算公式", "analysis": "容量 = 44,100 × (16 / 8) × 2 × 10 Bytes = 1,764,000 Bytes ≈ 1.68 MB。故选 A。"}, {"id": 8, "chapter": "第1章 认识数据", "question": "视频画面的连续性依赖于人眼的视觉暂留。人眼视觉暂留时间约为多少？连续平滑画面的标准帧率至少为多少？", "options": {"A": "约 1.0 秒；帧率达到 10 fps", "B": "约 0.01 秒；帧率达到 120 fps", "C": "约 0.5 秒；帧率达到 60 fps", "D": "约 0.1 秒；帧率达到 24 fps"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第1章 认识数据 · 视频原理与帧率标准", "analysis": "人眼视觉暂留时间约为 0.1 秒；当画面刷新率达到 24 fps（每秒 24 帧）以上时，人眼感知为连贯平滑视频。故选 D。"}, {"id": 9, "chapter": "第2章 演算法与程式设计", "question": "演算法是解决特定问题的指令集合。下列叙述中，何者违背了演算法的基本定义？", "options": {"A": "每一步骤必须含义明确无歧义（确定性）", "B": "可以有零个或多个输入，但必须产生输出", "C": "算法在极端条件下允许无限循环永不停止", "D": "所有操作原则上能在有限时间内执行（可行性）"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · 演算法五大基本特征", "analysis": "演算法必须具有“有穷性”，即在执行有限步骤后必须终止。死循环违背了有穷性，故 C 违背定义。"}, {"id": 10, "chapter": "第2章 演算法与程式设计", "question": "在国际标准流程图（Flowchart）中，各几何图元与其功能的配对何者完全正确？", "options": {"A": "椭圆：起止符号；菱形：条件判断；矩形：处理运算；平行四边形：输入输出", "B": "菱形：起止符号；矩形：条件判断；椭圆：输入输出；平行四边形：处理运算", "C": "矩形：起止符号；圆角矩形：处理运算；平行四边形：条件判断；菱形：输入输出", "D": "平行四边形：条件判断；菱形：处理运算；矩形：起止符号；椭圆：输入输出"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · 流程图标准规范", "analysis": "流程图规范：圆角矩形/椭圆表示起止；菱形表示条件判断；矩形表示处理运算；平行四边形表示输入/输出。A选项配对正确。"}, {"id": 11, "chapter": "第2章 演算法与程式设计", "question": "结构化程序设计的三大基本控制结构是：", "options": {"A": "函数调用结构、递归结构、指针引用结构", "B": "顺序结构、选择分支结构、循环结构", "C": "输入输出结构、并发处理结构、异常捕获结构", "D": "模块封装结构、继承多态结构、动态路由结构"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · 程序三大控制结构", "analysis": "结构化程序设计三大基石为：顺序结构、选择分支结构和循环结构。选 B。"}, {"id": 12, "chapter": "第2章 演算法与程式设计", "question": "在 Python 编程语言中，下列哪一个是完全合法的变量名？", "options": {"A": "2026_total_score", "B": "my-total-points", "C": "class", "D": "student_score_2026"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · Python变量命名规范", "analysis": "变量名不能以数字开头（排除A），不能含连字符减号（排除B），不能为关键字（排除C）。D完全合法。"}, {"id": 13, "chapter": "第2章 演算法与程式设计", "question": "在 Python 中执行表达式 23 // 5 + 17 % 4 + 3 ** 2，其最终计算结果为：", "options": {"A": "14", "B": "15", "C": "16", "D": "12"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · Python算术运算符优先级", "analysis": "运算步骤：3 ** 2 = 9；23 // 5 = 4；17 % 4 = 1；4 + 1 + 9 = 14。选 A。"}, {"id": 14, "chapter": "第2章 演算法与程式设计", "question": "阅读下列 Python 条件分支代码：\nscore = 78\nif score >= 90: grade = 'A'\nelif score >= 75: grade = 'B'\nelse: grade = 'C'\nprint(grade)\n程序打印出的结果是：", "options": {"A": "A", "B": "B", "C": "C", "D": "F"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · 条件分支判断", "analysis": "score = 78，不满足 >= 90；进入 elif 满足 >= 75，因此 grade = 'B' 并跳出判断。输出 B。"}, {"id": 15, "chapter": "第2章 演算法与程式设计", "question": "阅读代码：\ntotal = 0\nfor i in range(1, 10, 2):\n    total += i\nprint(total)\n执行后变量 total 的值为：", "options": {"A": "45", "B": "20", "C": "25", "D": "16"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · for循环与range函数", "analysis": "range(1, 10, 2) 产生 1, 3, 5, 7, 9。累加和：1 + 3 + 5 + 7 + 9 = 25。选 C。"}, {"id": 16, "chapter": "第2章 演算法与程式设计", "question": "阅读代码：\nn = 1; s = 0\nwhile n <= 5:\n    s += n * 2\n    n += 1\nprint(s)\n代码执行结束时输出的 s 值为：", "options": {"A": "15", "B": "20", "C": "10", "D": "30"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · while循环变量跟踪", "analysis": "循环累加：2 + 4 + 6 + 8 + 10 = 30。当 n=6 时退出循环。输出 30，选 D。"}, {"id": 17, "chapter": "第2章 演算法与程式设计", "question": "已知列表 nums = [10, 20, 30, 40, 50]，执行 nums.append(60) 后计算 nums[1] + nums[-1]，结果是：", "options": {"A": "70", "B": "80", "C": "90", "D": "60"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · 列表索引与操作", "analysis": "追加后列表末尾为 60。nums[1] 值为 20，nums[-1] 为末项 60。20 + 60 = 80。选 B。"}, {"id": 18, "chapter": "第2章 演算法与程式设计", "question": "二分查找（折半查找）相较于顺序查找效率极高，但使用二分查找的前提条件是：", "options": {"A": "列表元素数量必须为 2 的整数次幂", "B": "列表中的元素必须全为正整数", "C": "目标查找值必须恰好位于列表正中间", "D": "列表中的元素必须预先排好序"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · 二分查找前提条件", "analysis": "二分查找核心依赖于每次与中点比较后排除一半区间，这要求序列必须预先有序（升序或降序）。选 D。"}, {"id": 19, "chapter": "第3章 人工智能与应用", "question": "1950 年艾伦·图灵提出检验机器是否具备人类智能的判定实验被称为：", "options": {"A": "图灵测试（Turing Test）", "B": "达特茅斯评测（Dartmouth Test）", "C": "明斯基网络测试（Minsky Test）", "D": "深蓝博弈基准（Deep Blue Test）"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第3章 人工智能与应用 · 图灵测试", "analysis": "图灵测试通过盲测对话判断机器是否具备类人智能。选 A。"}, {"id": 20, "chapter": "第3章 人工智能与应用", "question": "机器学习划分为三大基本范式。下列任务中属于“监督学习（Supervised Learning）”的是：", "options": {"A": "对无标签的电商用户进行自动聚类分群", "B": "自动驾驶小车通过试错与奖惩反馈优化转向", "C": "使用标注有“猫/狗”标签的照片训练分类模型", "D": "AlphaGo 无人类棋谱指导下自我对弈提升"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第3章 人工智能与应用 · 监督学习定义", "analysis": "监督学习的训练数据具有已标注的正确标签（如猫狗标签）。A为无监督聚类，B、D为强化学习。选 C。"}, {"id": 21, "chapter": "第3章 人工智能与应用", "question": "典型人工神经网络（ANN）基本架构自输入端到输出端依次由哪三类网络层构成？", "options": {"A": "感知层 ➔ 传输层 ➔ 应用层", "B": "编译层 ➔ 逻辑层 ➔ 物理层", "C": "数据层 ➔ 交换层 ➔ 控制层", "D": "输入层 ➔ 隐藏层 ➔ 输出层"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第3章 人工智能与应用 · 神经网络层次结构", "analysis": "人工神经网络的标准三层结构为：输入层、隐藏层和输出层。选 D。"}, {"id": 22, "chapter": "第3章 人工智能与应用", "question": "计算机视觉（CV）致力于让计算机看懂图像。下列任务中不属于计算机视觉范畴的是：", "options": {"A": "智能手机摄像头面部解锁", "B": "智能语音助手识别语音指令并转为文字", "C": "自动驾驶车辆识别车道线与红绿灯", "D": "AI 分析肺部 CT 影像筛查病灶"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第3章 人工智能与应用 · 计算机视觉与语音识别辨析", "analysis": "语音识别处理的是声波音频信号，属于语音/NLP范畴，而非处理像素图像的计算机视觉（CV）。选 B。"}, {"id": 23, "chapter": "第3章 人工智能与应用", "question": "自然语言处理（NLP）旨在让计算机理解人类语言。下列任务全部属于 NLP 范畴的是：", "options": {"A": "机器翻译、文本情感分析、大语言模型生成", "B": "指纹考勤打卡、红绿灯抓拍车辆测速", "C": "硬盘坏道扫描修复、数据流校验和计算", "D": "数码相机自动白平衡、无损音频降噪"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第3章 人工智能与应用 · 自然语言处理典型应用", "analysis": "机器翻译、文本分析与大语言模型属于典型的 NLP 文本处理。选 A。"}, {"id": 24, "chapter": "第3章 人工智能与应用", "question": "某招聘 AI 系统倾向于无故淘汰女性应聘者，产生“算法偏见”。其根本成因通常是：", "options": {"A": "服务器 CPU 运算过快产生浮点舍入误差", "B": "操作系统编译器无法识别女性名字编码", "C": "训练该模型所用的历史数据本身存在性别失衡", "D": "深度学习模型未联网无法同步劳动保护法规"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第3章 人工智能与应用 · 算法偏见成因", "analysis": "机器学习模型的判断准则源于训练数据，历史训练数据本身的偏见导致了模型拟合出的算法歧视。选 C。"}, {"id": 25, "chapter": "第3章 人工智能与应用", "question": "利用深度学习极其逼真地替换人脸表情与克隆声音的音视频伪造技术被称为：", "options": {"A": "暗网嗅探（Darknet Sniffing）", "B": "深度伪造（Deepfake）", "C": "数字隐写（Steganography）", "D": "多态病毒（Polymorphic Virus）"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第3章 人工智能与应用 · 深度伪造技术", "analysis": "深度伪造（Deepfake）利用生成对抗网络等技术伪造高逼真音视频。选 B。"}, {"id": 26, "chapter": "第3章 人工智能与应用", "question": "学生在撰写研究报告时使用生成式 AI（如 ChatGPT），下列做法符合学术伦理的是：", "options": {"A": "用 AI 辅助启发思路或润色语言，并在报告中注明工具与提示词", "B": "将 AI 生成的整篇文章直接复制作为原创论文提交", "C": "让 AI 代替自己编写考试代码并隐瞒使用工具", "D": "输入同学的真实个人隐私让 AI 进行人肉搜索"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第3章 人工智能与应用 · 生成式AI学术伦理", "analysis": "合理将 AI 作为灵感与润色辅助工具并在成果中透明披露，符合学术诚信。直接剽窃不可取。选 A。"}, {"id": 27, "chapter": "第4章 资讯科技与社会", "question": "因地理、经济与教育差异导致不同群体在 ICT 设备拥有与使用能力上的不平等现象被称为：", "options": {"A": "信息茧房（Information Cocoon）", "B": "技术奇点（Technological Singularity）", "C": "网络中立（Net Neutrality）", "D": "数字鸿沟（Digital Divide）"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第4章 资讯科技与社会 · 数字鸿沟概念", "analysis": "数字鸿沟（Digital Divide）指在接入硬件与使用信息能力上的社会不平等差距。选 D。"}, {"id": 28, "chapter": "第4章 资讯科技与社会", "question": "“绿色运算（Green Computing）”倡导降低计算机对环境的负面影响。下列措施最符合其宗旨的是：", "options": {"A": "将旧电脑主机直接混入普通生活垃圾填埋", "B": "超频服务器 CPU 并把机房空调调到最低温", "C": "采购节能认证设备并规范回收电子废弃物（E-waste）", "D": "开发后台挖矿程序耗尽电脑空闲时的电力"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第4章 资讯科技与社会 · 绿色运算宗旨", "analysis": "采购高能效设备与规范回收电子废料是绿色运算的核心实践。选 C。"}, {"id": 29, "chapter": "第4章 资讯科技与社会", "question": "版权法（著作权法）核心保护原则是“思想与表达二分法”。这意味着版权法：", "options": {"A": "保护创作者对思想的具体表达形式，不保护抽象思想本身", "B": "只要头脑中有商业构想，即使未写出作品也受版权保护", "C": "源代码一旦公开发布在 GitHub 上即永久丧失一切版权", "D": "只有向版权局缴费登记的作品才受法律保护"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第4章 资讯科技与社会 · 著作权保护客体", "analysis": "版权法只保护思想的具体表达（作品、代码、文字），不保护抽象思想创意本身。选 A。"}, {"id": 30, "chapter": "第4章 资讯科技与社会", "question": "在版权法体系中，下列行为属于合法“合理使用（Fair Use）”的是：", "options": {"A": "将商业正版教科书整本扫描发布到论坛免费下载", "B": "教师在课堂教学中适量引用学术论文图表并注明出处", "C": "将收费软件的注册机打包发布在公众号用于引流", "D": "未经许可将院线大片在校内礼堂对外售票放映"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第4章 资讯科技与社会 · 版权合理使用原则", "analysis": "课堂教学出于非营利目的适量引用并注明出处，属于法定合理使用范畴。选 B。"}, {"id": 31, "chapter": "第4章 资讯科技与社会", "question": "某开源教材标有“CC BY-NC-SA”许可协议标识，这意味着使用者必须遵守：", "options": {"A": "不需署名、可以商业买卖、禁止修改", "B": "仅限非商业使用、禁止在网络上传播、需书面授权", "C": "必须支付专利费、允许买卖、由政府机构管控", "D": "必须署名（BY）、非商业用途（NC）、相同方式共享（SA）"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第4章 资讯科技与社会 · CC知识共享许可协议", "analysis": "BY 为署名，NC 为非商业，SA 为相同方式共享。选 D。"}, {"id": 32, "chapter": "第4章 资讯科技与社会", "question": "关于开源软件（Open Source Software），下列陈述完全正确的是：", "options": {"A": "开源软件等同于公有领域，作者自动放弃所有法律身份", "B": "开源软件由于源码公开，安全性一定低于闭源商业软件", "C": "开源软件允许查看修改源码，但需遵守指定开源许可证", "D": "任何开源软件均禁止用于商业公司的日常业务运营"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第4章 资讯科技与社会 · 开源软件特征与许可证", "analysis": "开源软件拥有版权，使用者需遵从其许可证（如 MIT、GPL、Apache）。选 C。"}, {"id": 33, "chapter": "第4章 资讯科技与社会", "question": "在网络社群交流中，下列行为违背“网络礼仪（Netiquette）”的是：", "options": {"A": "因观点不同而人肉搜索对方住址并在社交账号群起谩骂", "B": "发言前核实事实来源，避免假新闻误导他人", "C": "尊重他人隐私，未经同意不公开聚会私密照片", "D": "邮件交流保持礼貌，不随意用全大写字母咆哮"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第4章 资讯科技与社会 · 网络礼仪与防范网络欺凌", "analysis": "人肉搜索与网络谩骂属于网络欺凌，违背网络道德与法律。选 A。"}, {"id": 34, "chapter": "第4章 资讯科技与社会", "question": "ACM/IEEE 职业道德准则规定：当雇主商业利益与公众安全健康利益冲突时，资讯科技专业人员应当：", "options": {"A": "无条件服从雇主指令，即使系统有缺陷也保持沉默", "B": "私下将客户机密数据变卖给第三方以追求高薪", "C": "始终将公众健康、安全与根本福祉置于最高优先级", "D": "保持中立，由非专业管理人员自行承担一切责任"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第4章 资讯科技与社会 · 职业道德与公众利益第一原则", "analysis": "软件工程师职业道德第一准则是优先保护公众利益与人身安全。选 C。"}, {"id": 35, "chapter": "第5章 资讯系统与网络概述", "question": "一个现代组织级资讯系统（IS）的五大核心基本组成要素是：", "options": {"A": "电源、网线、机柜、路由器、防雷针", "B": "硬件、软件、数据、人员、过程/规程", "C": "网页前端、数据库后端、编译器、显卡、声卡", "D": "显示器、键盘、鼠标、打印机、扫描仪"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第5章 资讯系统与网络概述 · 资讯系统五大要素", "analysis": "五大要素为：硬件、软件、数据、人员和规程/过程。选 B。"}, {"id": 36, "chapter": "第5章 资讯系统与网络概述", "question": "在企业资讯系统层次模型中，负责记录日常海量交易（如超市 POS 收银、银行 ATM 取款）的系统是：", "options": {"A": "管理资讯系统（MIS）", "B": "决策支持系统（DSS）", "C": "主管资讯系统（EIS）", "D": "交易处理系统（TPS）"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第5章 资讯系统与网络概述 · 交易处理系统TPS", "analysis": "TPS（Transaction Processing System）处理底层操作层的日常交易业务。选 D。"}, {"id": 37, "chapter": "第5章 资讯系统与网络概述", "question": "系统开发生命周期（SDLC）标准开发阶段的先后顺序何者正确？", "options": {"A": "系统规划 ➔ 系统分析 ➔ 系统设计 ➔ 系统实现测试 ➔ 运行维护", "B": "系统设计 ➔ 系统规划 ➔ 系统编码 ➔ 运行维护", "C": "系统实现 ➔ 系统维护 ➔ 系统分析 ➔ 系统设计", "D": "系统测试 ➔ 系统规划 ➔ 系统设计 ➔ 需求调研"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第5章 资讯系统与网络概述 · SDLC开发生命周期阶段", "analysis": "标准顺序为：规划 ➔ 分析 ➔ 设计 ➔ 实现测试 ➔ 运行维护。选 A。"}, {"id": 38, "chapter": "第5章 资讯系统与网络概述", "question": "关于计算机网络星型拓扑（Star Topology）的特性，下列陈述正确的是：", "options": {"A": "任何一台计算机断线都会导致整个网络永久瘫痪", "B": "所有节点通过单根主干线缆串接，布线成本极低", "C": "结构极其复杂，必须有多条冗余备份链路才能通信", "D": "各节点独立连接至中央交换机，单台终端故障不影响其他电脑通信"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第5章 资讯系统与网络概述 · 星型拓扑结构", "analysis": "星型拓扑由中央节点集中管理，单个分支终端故障具有独立隔离性，不影响其余节点。选 D。"}, {"id": 39, "chapter": "第5章 资讯系统与网络概述", "question": "依据网络地理覆盖范围由小到大排列，顺序正确的是：", "options": {"A": "WAN（广域网） ➔ MAN（城域网） ➔ LAN（局域网） ➔ PAN（个人局域网）", "B": "PAN（个人局域网） ➔ LAN（局域网） ➔ MAN（城域网） ➔ WAN（广域网）", "C": "LAN（局域网） ➔ PAN（个人局域网） ➔ WAN（广域网） ➔ MAN（城域网）", "D": "MAN（城域网） ➔ LAN（局域网） ➔ WAN（广域网） ➔ PAN（个人局域网）"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第5章 资讯系统与网络概述 · 网络覆盖范围分类", "analysis": "由小到大为：个人局域网（PAN）➔ 局域网（LAN）➔ 城域网（MAN）➔ 广域网（WAN）。选 B。"}, {"id": 40, "chapter": "第5章 资讯系统与网络概述", "question": "工作在网络层、负责在不同网络之间寻找最佳传输路径并转发数据包的网络互联设备是：", "options": {"A": "中继器（Repeater）", "B": "集线器（Hub）", "C": "路由器（Router）", "D": "二层物理交换机（Switch）"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第5章 资讯系统与网络概述 · 路由器功能", "analysis": "路由器工作在第三层（网络层），核心任务是路由寻径与分组转发。选 C。"}, {"id": 41, "chapter": "第5章 资讯系统与网络概述", "question": "在 OSI 七层参考模型中，负责将比特流组装成帧、通过 MAC 地址进行物理寻址的网络层是：", "options": {"A": "物理层（Physical Layer）", "B": "传输层（Transport Layer）", "C": "网络层（Network Layer）", "D": "数据链路层（Data Link Layer）"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第5章 资讯系统与网络概述 · OSI数据链路层职责", "analysis": "数据链路层负责成帧、差错控制与 MAC 物理寻址。选 D。"}, {"id": 42, "chapter": "第5章 资讯系统与网络概述", "question": "当在浏览器输入网址 www.uec.edu.my 时，域名系统（DNS）的核心功能是：", "options": {"A": "将网页中的文字自动翻译为标准英文", "B": "将便于记忆的域名解析转换为对应的 IP 地址", "C": "为用户电脑自动分配局域网私有网关与掩码", "D": "检测电脑是否感染病毒并自动查杀"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第5章 资讯系统与网络概述 · DNS域名解析机制", "analysis": "DNS 核心作用是将人类可读的文字域名映射解析为计算机底层的 IP 地址。选 B。"}, {"id": 43, "chapter": "第6章 资讯安全与社会责任", "question": "黑客未窃取学生档案，但恶意将上千名学生的期末成绩全部篡改调高。这主要破坏了 CIA 三元组中的：", "options": {"A": "完整性（Integrity）", "B": "可用性（Availability）", "C": "机密性（Confidentiality）", "D": "抗抵赖性（Non-repudiation）"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第6章 资讯安全与社会责任 · CIA三元组完整性", "analysis": "数据被恶意篡改直接破坏了数据的真实性与完整性（Integrity）。选 A。"}, {"id": 44, "chapter": "第6章 资讯安全与社会责任", "question": "自身表面上伪装成无害正常程序（如破解补丁），运行后在后台悄悄开放安全后门盗取密码的恶意软件是：", "options": {"A": "网络蠕虫（Worm）", "B": "特洛伊木马（Trojan Horse）", "C": "宏病毒（Macro Virus）", "D": "引导区病毒（Boot Sector Virus）"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第6章 资讯安全与社会责任 · 特洛伊木马特征", "analysis": "特洛伊木马的最大特征是伪装欺骗，诱骗用户运行后开启后门。选 B。"}, {"id": 45, "chapter": "第6章 资讯安全与社会责任", "question": "伪造教务处紧急通知邮件、诱骗教师点击高仿虚假网站以套取邮箱账号密码的攻击手段属于：", "options": {"A": "分布式拒绝服务攻击（DDoS）", "B": "网络钓鱼（Phishing）与社会工程学攻击", "C": "SQL 注入攻击（SQL Injection）", "D": "跨站脚本攻击（XSS）"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第6章 资讯安全与社会责任 · 网络钓鱼防范", "analysis": "仿冒权威机构发邮件诱骗点击虚假网站盗取凭证，属于网络钓鱼（Phishing）。选 B。"}, {"id": 46, "chapter": "第6章 资讯安全与社会责任", "question": "在非对称加密中，若 Alice 想要给 Bob 发送一封机密信件，Alice 应当使用哪把密钥加密明文？", "options": {"A": "Bob 的公钥（Bob's Public Key）", "B": "Alice 自己的私钥", "C": "Bob 的私钥", "D": "Alice 自己的公钥"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第6章 资讯安全与社会责任 · 非对称加密公钥解密机制", "analysis": "非对称保密传输必须使用“接收方的公钥”加密，唯有接收方 Bob 的私钥才能解密。选 A。"}, {"id": 47, "chapter": "第6章 资讯安全与社会责任", "question": "数字签名能够确保消息真实性与完整性。发送方生成数字签名的标准做法是：", "options": {"A": "接收方用自己的公钥对整篇消息内容进行解密", "B": "电信运营商对信件加盖经过公证的实体印章", "C": "发送方用自己的私钥对消息散列摘要（Hash）进行加密", "D": "将手写签名扫描为高分辨率图片直接附在邮件下方"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第6章 资讯安全与社会责任 · 数字签名生成原理", "analysis": "发送方用自己的私钥对消息 Hash 摘要加密生成数字签名，接收方用发送方公钥验签。选 C。"}, {"id": 48, "chapter": "第6章 资讯安全与社会责任", "question": "多因素身份认证（MFA / 2FA）要求跨越不同认证维度。下列组合真正构成双因素认证的是：", "options": {"A": "静态登录密码（所知） ＋ 密保问题回答（所知）", "B": "实体硬件 Ukey（所有） ＋ 门禁芯片卡（所有）", "C": "食指指纹（所是） ＋ 眼睛虹膜（所是）", "D": "记忆的账户密码（所知） ＋ 手机动态验证码（所有）"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第6章 资讯安全与社会责任 · 多因素身份认证MFA", "analysis": "密码属于“所知”，手机验证码属于“所有”，两者属于不同要素维度，构成有效 2FA。选 D。"}, {"id": 49, "chapter": "第6章 资讯安全与社会责任", "question": "关于计算机网络防火墙（Firewall）的核心功能，下列叙述正确的是：", "options": {"A": "依据预设安全策略检查出入数据包，阻止未授权访问", "B": "安装后可完全替代杀毒软件并关闭系统漏洞补丁", "C": "能 100% 自动消除物理插入 U 盘中的宏病毒", "D": "运作原理是通过切断外网物理光缆来实现绝对安全"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第6章 资讯安全与社会责任 · 防火墙边界过滤", "analysis": "防火墙主要依据源/目的 IP、端口等规则在网络边界过滤出入数据包。选 A。"}, {"id": 50, "chapter": "第6章 资讯安全与社会责任", "question": "数据灾备中的黄金准则“3-2-1 备份原则”的具体含义是：", "options": {"A": "3 周内备份完毕；2 位管理员联合签名；密码至少 1 位", "B": "保留 3 份数据副本；存放在 2 种不同介质；至少 1 份异地或离线保存", "C": "最多允许 3 次病毒入侵；每年更换 2 次主板；硬盘容量为 1 TB", "D": "存放在 3 台同机房服务器；每隔 2 分钟备份；占用 1% 磁盘空间"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第6章 资讯安全与社会责任 · 3-2-1备份原则", "analysis": "3-2-1 原则：3 份副本、2 种介质、至少 1 份异地或离线。选 B。"}];
        const qSet2 = [{"id": 1, "chapter": "第1章 认识数据", "question": "传感器测得温度 34，系统发布“亚罗士打当前气温 34°C”并建议“防暑调整课表”。三者分别对应 DIKW 模型的：", "options": {"A": "资讯 ➔ 数据 ➔ 代码", "B": "数据 ➔ 资讯 ➔ 知识/智慧", "C": "信号 ➔ 知识 ➔ 协议", "D": "常量 ➔ 变量 ➔ 算法"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第1章 认识数据 · DIKW认知模型", "analysis": "34 是原始数值（数据）；结合语境后为资讯；指导行动为知识/智慧。选 B。"}, {"id": 2, "chapter": "第1章 认识数据", "question": "无符号二进制整数末尾添一个“0”（如 (101)₂ 变为 (1010)₂），其十进制数值变为原数的：", "options": {"A": "原数值变为原来的 2 倍", "B": "原数值变为原来的 10 倍", "C": "原数值增加 2", "D": "原数值保持不变"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第1章 认识数据 · 二进制移位特性", "analysis": "二进制基数为 2，末尾添 0 相当于左移一位，即数值乘以 2。(101)₂=5，(1010)₂=10。选 A。"}, {"id": 3, "chapter": "第1章 认识数据", "question": "关于计算机存储容量单位的换算标准，下列叙述何者正确？", "options": {"A": "1 Byte 等于 16 bit，英文字母固定消耗 32 字节", "B": "1 TB 等于 1000 KB，换算进率在任何系统均固定为 100", "C": "无论闪存还是机械硬盘，制造商均严格按 1024 进率标称出厂", "D": "系统按二进制换算（1 GiB = 1024 MiB），商业硬盘按十进制标称（1 GB = 1000 MB）"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第1章 认识数据 · 存储容量单位换算", "analysis": "操作系统按二进制 1024 进率计算，硬盘厂商按十进制 1000 标称。选 D。"}, {"id": 4, "chapter": "第1章 认识数据", "question": "在网页 RGB 色彩定义中，十六进制颜色代码 #00FF00 渲染出的视觉颜色是：", "options": {"A": "纯红色（Red）", "B": "纯蓝色（Blue）", "C": "纯绿色（Green）", "D": "纯黄色（Yellow）"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第1章 认识数据 · RGB色彩十六进制模型", "analysis": "#00FF00 中 R=00, G=FF（满值绿色）, B=00，因此呈现纯绿色。选 C。"}, {"id": 5, "chapter": "第1章 认识数据", "question": "设计要在巨幅户外喷绘布印制的高清校徽，为了放大时不失真，应优先采用：", "options": {"A": "向量图（Vector Graphic，如 SVG 或 AI 格式）", "B": "低分辨率的 JPEG 点阵图", "C": "未经压缩的 8 位 BMP 位图", "D": "带透明背景的低尺寸 GIF 动图"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第1章 认识数据 · 向量图应用场景", "analysis": "向量图由数学公式描述，无限放大保持平滑边缘不失真。选 A。"}, {"id": 6, "chapter": "第1章 认识数据", "question": "奈奎斯特采样定理指出采样频率至少为最高频率的 2 倍。人耳听力极限为 20 kHz，CD 采用 44.1 kHz 采样率的依据是：", "options": {"A": "44.1 kHz 只能还原人耳极限频率的四分之一", "B": "采样频率必须达到模拟频率的十倍以上才可捕获", "C": "44.1 kHz > 2 × 20 kHz，能够完整无失真覆盖人耳听觉极限", "D": "所有声卡在硬件逻辑上只能以 4 的倍数进行分频"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第1章 认识数据 · 奈奎斯特采样定理", "analysis": "44.1 kHz 满足大于 2 倍最高人耳听力频率 20 kHz（40 kHz），留有滤波裕量。选 C。"}, {"id": 7, "chapter": "第1章 认识数据", "question": "录制分辨率为 1280 × 720、色彩深度 24 位真彩色、帧率 30 fps 的视频。未压缩录制 1 秒产生的数据量约为：", "options": {"A": "2.64 MB", "B": "79.1 MB", "C": "528 MB", "D": "8.25 MB"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第1章 认识数据 · 未压缩视频数据量计算", "analysis": "1 秒数据量 = 1280 × 720 × 3 Bytes × 30 ≈ 79.10 MB。选 B。"}, {"id": 8, "chapter": "第1章 认识数据", "question": "关于“有损压缩（Lossy）”与“无损压缩（Lossless）”的比较，何者正确？", "options": {"A": "有损压缩常用于可执行程序，允许丢失部分代码字节", "B": "无损压缩比远高于有损压缩，能压缩到千分之一", "C": "MP3 音频反复解压缩，波形与无损母带完全无损一致", "D": "无损压缩可 100% 还原原始数据（如 PNG），有损压缩舍弃冗余换取高压缩比（如 JPEG）"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第1章 认识数据 · 有损与无损压缩特性对比", "analysis": "无损压缩（PNG/FLAC）完全无损还原；有损压缩（JPEG/MP3）舍弃不敏感细节换取极高压缩比。选 D。"}, {"id": 9, "chapter": "第2章 演算法与程式设计", "question": "伪代码（Pseudocode）在算法设计中的主要优势是：", "options": {"A": "摆脱具体语言语法束缚，聚焦核心逻辑结构且易于交流", "B": "无需解释器或编译器，能直接被 CPU 硬件执行", "C": "能自动检测算法逻辑漏洞并自动生成标准代码", "D": "是国际标准组织统一规定的唯一官方二进制指令集"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · 伪代码特点", "analysis": "伪代码摆脱特定语言语法羁绊，便于开发者专注算法逻辑思考与沟通。选 A。"}, {"id": 10, "chapter": "第2章 演算法与程式设计", "question": "输入 x，若 x > 0 则 y = 1，否则 y = -1，最后输出 y。该算法体现的核心控制结构是：", "options": {"A": "单向顺序执行结构", "B": "双分支选择结构", "C": "计数型循环结构", "D": "死循环嵌套结构"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · 选择结构识别", "analysis": "根据条件判断走两条不同路径，属于典型的双分支选择结构（if-else）。选 B。"}, {"id": 11, "chapter": "第2章 演算法与程式设计", "question": "执行代码 a = 3.14; b = \"3.14\"，变量 a 与 b 的数据类型分别为：", "options": {"A": "a 为整型（int），b 为布尔型（bool）", "B": "a 为字符串（str），b 为浮点型（float）", "C": "两者在 Python 中均被自动识别为整型（int）", "D": "a 为浮点型（float），b 为字符串型（str）"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · Python数据类型", "analysis": "带小数的纯数值为 float，带引号的文本为 str。选 D。"}, {"id": 12, "chapter": "第2章 演算法与程式设计", "question": "若已知 p = True, q = False，则表达式 not q and (p or q) 的求值结果为：", "options": {"A": "False", "B": "None", "C": "True", "D": "0"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · 布尔逻辑运算", "analysis": "not q 为 True；p or q 为 True；True and True 结果为 True。选 C。"}, {"id": 13, "chapter": "第2章 演算法与程式设计", "question": "阅读代码：x = 15; res = 'A' if x % 3 == 0 and x % 5 == 0 else 'B'; print(res)，输出结果是：", "options": {"A": "B", "B": "A", "C": "C", "D": "语法错误"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · 复合条件分支", "analysis": "15 能被 3 和 5 整除，条件成立，执行 res = 'A'。输出 A，选 B。"}, {"id": 14, "chapter": "第2章 演算法与程式设计", "question": "阅读代码：\ncount = 0\nfor i in range(1, 6):\n    if i == 3: continue\n    count += 1\nprint(count)\n输出结果是：", "options": {"A": "4", "B": "2", "C": "5", "D": "3"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · continue跳转控制", "analysis": "range(1, 6) 产生 1, 2, 3, 4, 5。i=3 时跳过累加，共累加 4 次。选 A。"}, {"id": 15, "chapter": "第2章 演算法与程式设计", "question": "假设首个元素为最大值，通过循环遍历列表中每个元素并更新最大值，该算法属于：", "options": {"A": "二分查找法求中位数", "B": "递归回溯求解全排列", "C": "遍历比较法求解最大值", "D": "哈希映射求解词频"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · 极值算法原理", "analysis": "遍历列表各元素两两比较更新极值，属于遍历比较法。选 C。"}, {"id": 16, "chapter": "第2章 演算法与程式设计", "question": "若有字符串 text = \"Python2026\"，执行切片操作 text[0:6] 得到的子字符串是：", "options": {"A": "\"Python2\"", "B": "\"Pytho\"", "C": "\"2026\"", "D": "\"Python\""}, "answer": "D", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · 字符串切片索引", "analysis": "[0:6] 包含索引 0 到 5，共 6 个字符，即 \"Python\"。选 D。"}, {"id": 17, "chapter": "第2章 演算法与程式设计", "question": "对待排序序列 [5, 2, 8, 1, 4] 进行升序冒泡排序，第一轮完整比较交换结束后，序列变为：", "options": {"A": "[1, 2, 4, 5, 8]", "B": "[5, 2, 1, 4, 8]", "C": "[2, 5, 1, 4, 8]", "D": "[2, 1, 4, 5, 8]"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · 冒泡排序过程", "analysis": "第一趟冒泡将最大数 8 沉底至末尾，前段顺次调整为 [2, 5, 1, 4, 8]。选 C。"}, {"id": 18, "chapter": "第2章 演算法与程式设计", "question": "算法的“时间复杂度（Time Complexity）”通常用来衡量：", "options": {"A": "某品牌电脑秒表计时运行该程序消耗的绝对毫秒数", "B": "程序员书写伪代码总共消耗的时钟分钟数", "C": "该程序在 GitHub 上上传与下载所消耗的带宽时间", "D": "随着数据规模 n 增大，算法基本运算执行次数的增长趋势"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第2章 演算法与程式设计 · 算法时间复杂度概念", "analysis": "时间复杂度用大 O 记号衡量计算步数随输入规模 n 的渐进增长趋势。选 D。"}, {"id": 19, "chapter": "第3章 人工智能与应用", "question": "关于弱人工智能（ANI）与强人工智能（AGI），下列阐述正确的是：", "options": {"A": "智能手机语音助手已具备全面自主意识的强人工智能（AGI）", "B": "目前人类研发的 AI（如 AlphaGo、人脸识别）均属于弱人工智能（ANI）", "C": "强人工智能指的是算力极大、机柜体积超过普通机房的物理服务器", "D": "弱人工智能在任何专业棋类比赛中绝不可能战胜人类顶尖选手"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第3章 人工智能与应用 · 强弱人工智能界定", "analysis": "现存全部 AI 均专注于特定任务，属于弱人工智能（ANI）。选 B。"}, {"id": 20, "chapter": "第3章 人工智能与应用", "question": "在强化学习（Reinforcement Learning）中，智能体（Agent）根据何种信号调整策略以实现长期收益最大化？", "options": {"A": "奖励（Reward）与惩罚（Penalty）反馈机制", "B": "程序员随时随刻的手动按键实时纠正", "C": "预设好的静态数据库唯一索引键", "D": "操作系统虚拟内存交换页命中率"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第3章 人工智能与应用 · 强化学习机制", "analysis": "强化学习依赖环境反馈的奖励与惩罚信号，通过试错调整策略。选 A。"}, {"id": 21, "chapter": "第3章 人工智能与应用", "question": "卷积神经网络（CNN）在图像识别中表现优异，关键在于其拥有能自动提取图像局部特征的：", "options": {"A": "关系型数据库主外键约束表", "B": "串行通信握手协议驱动程序", "C": "二进制算术逻辑运算器（ALU）", "D": "卷积层（Convolutional）与池化层（Pooling）"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第3章 人工智能与应用 · 卷积神经网络特征", "analysis": "CNN 通过卷积层抽取图像局部特征、池化层降维，实现高效特征学习。选 D。"}, {"id": 22, "chapter": "第3章 人工智能与应用", "question": "为了让大语言模型输出高质量且准确的回答，提示词工程的有效原则是：", "options": {"A": "提示词应尽量模糊简短，仅输入一两个单词让 AI 自由发挥", "B": "提示词中不能出现标点符号，否则词嵌入编码器会崩溃", "C": "赋予明确角色设定，提供清晰背景、具体任务与期望格式", "D": "只能使用纯英文，输入中文会破坏神经网络权重参数"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第3章 人工智能与应用 · 提示词工程", "analysis": "Prompt 需具备清晰的角色、背景、任务指令与输出格式约束。选 C。"}, {"id": 23, "chapter": "第3章 人工智能与应用", "question": "自动驾驶车辆在道路上自主穿行时，依靠激光雷达（LiDAR）、毫米波雷达与摄像头来完成：", "options": {"A": "实时环境感知、障碍物三维检测与自身定位", "B": "直接向乘客银行卡发起自动扣款协议结算", "C": "无线超频车内发动机火花塞的点火时间", "D": "在无驾驶员操控下自动破解交警指挥中心加密后台"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第3章 人工智能与应用 · 自动驾驶多传感器感知", "analysis": "车载传感器多模态融合负责 360 度环境建模、障碍物检测与定位。选 A。"}, {"id": 24, "chapter": "第3章 人工智能与应用", "question": "在医疗影像等高风险领域应用 AI 辅助诊断时，必须坚持的原则是：", "options": {"A": "彻底解雇人类医生，由 AI 闭环自主接管手术与开药", "B": "AI 仅作为辅助筛查工具，最终医疗决策与责任由持证医生承担", "C": "只要 AI 给出阳性诊断，无需复核直接进行大型切除手术", "D": "禁止在软件中设立人机界面，避免医生主观思考干扰 AI"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第3章 人工智能与应用 · 医疗AI人机协同伦理", "analysis": "高风险领域必须落实人机协同（Human-in-the-loop），由专业医师负责最终决策。选 B。"}, {"id": 25, "chapter": "第3章 人工智能与应用", "question": "关于人工智能对未来就业结构的影响，下列客观科学的预期是：", "options": {"A": "所有人类职业将在未来一年内 100% 彻底消亡", "B": "AI 只能做简单计算，在绘画、编程与翻译领域对人类毫无影响", "C": "各国应立法炸毁数据中心以完全禁止任何 AI 研究", "D": "AI 将替代标准化重复性劳动，同时催生数据标注与提示词等新兴职业"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第3章 人工智能与应用 · AI与未来就业趋势", "analysis": "AI 替代常规重复性工作，但同时催生新兴数字职业，重构劳动形态。选 D。"}, {"id": 26, "chapter": "第3章 人工智能与应用", "question": "为了防止大语言模型生成教唆犯罪或有害内容，研发团队在训练流程中引入的关键安全对齐技术是：", "options": {"A": "提高 CPU 供电电压进行极限超频", "B": "基于人类反馈的强化学习（RLHF）", "C": "将模型源码编译为机器汇编指令后永久封存", "D": "将文字响应速度强制限制为每秒 1 个字符"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第3章 人工智能与应用 · RLHF安全对齐技术", "analysis": "RLHF 使大语言模型的生成内容与人类道德、法律及安全价值观对齐。选 B。"}, {"id": 27, "chapter": "第4章 资讯科技与社会", "question": "弥合城乡学校之间的数字鸿沟，最务实有效的举措是：", "options": {"A": "推进乡村学校网络覆盖与设备配备，并开展教师数字技能培训", "B": "取缔城市重点学校电脑，使城乡学生在无设备环境下绝对平均", "C": "仅向乡村邮寄纸质计算机手册，但禁止其接入互联网", "D": "要求乡村学生必须自费购买高配游戏笔记本电脑"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第4章 资讯科技与社会 · 弥合数字鸿沟综合施策", "analysis": "结合硬件普及与教师技能培训是缩小数字鸿沟的系统方法。选 A。"}, {"id": 28, "chapter": "第4章 资讯科技与社会", "question": "科技巨头将云计算数据中心建在北极圈寒冷地区或深海中，主要考量是：", "options": {"A": "北极圈没有网络信号，能彻底防范所有黑客攻击", "B": "利用自然低温大幅降低服务器制冷能耗，提升电力使用效率（PUE）", "C": "低温使 CPU 电子完全停止流动从而不需要消耗电能", "D": "避开各国法律监管，方便暗中跨国贩卖用户数据"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第4章 资讯科技与社会 · 绿色数据中心自然冷却", "analysis": "利用极地或海水自然对流降温，大幅降低空调用电，提升能效 PUE。选 B。"}, {"id": 29, "chapter": "第4章 资讯科技与社会", "question": "工程师离职后私自将前雇主斥资研发的核心商业软件源码上传网盘并低价售卖，这构成了：", "options": {"A": "正当的开源代码普及奉献，受 CC 协议保护", "B": "侵犯商业秘密与软件著作权，触犯法律并违背职业道德", "C": "符合合理使用原则的自由学术交流", "D": "个人正常的知识变现，前雇主无权追究责任"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第4章 资讯科技与社会 · 商业秘密与软件著作权侵权", "analysis": "职务代码属于雇主商业秘密，私自泄密变卖属于民事与刑事违法。选 B。"}, {"id": 30, "chapter": "第4章 资讯科技与社会", "question": "某 App 引用了一首“CC BY-ND（署名-禁止演绎）”授权的配乐，下列做法合规的是：", "options": {"A": "重新降调混音拼接搞笑说唱，并声称自己是原创者", "B": "隐去原作者名字，并在音乐后半段插入商业广告", "C": "将该音乐的数字版权直接卖给第三方游戏公司", "D": "注明原作者姓名与曲名，且未对音乐做任何改编或二次剪辑"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第4章 资讯科技与社会 · CC禁止演绎条款解读", "analysis": "ND 条款要求完整保留作品原貌，禁止改编演绎，并须署名（BY）。选 D。"}, {"id": 31, "chapter": "第4章 资讯科技与社会", "question": "GPL 开源许可证具有著名的“传染性（Copyleft）”，这意味着：", "options": {"A": "衍生项目若修改并使用了 GPL 代码，发布时该项目也必须完全开源", "B": "一旦安装该软件，操作系统会自动感染恶性病毒", "C": "衍生软件完全禁止在任何商业系统上运行", "D": "使用者必须每年向基金会缴纳软件特许使用专利税"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第4章 资讯科技与社会 · GPL传染性特性", "analysis": "Copyleft 要求修改或基于 GPL 代码构建的发布衍生作品必须同样遵循 GPL 开源。选 A。"}, {"id": 32, "chapter": "第4章 资讯科技与社会", "question": "算法推荐持续为用户推送同质化观点，使用户处于认知偏狭封闭的环境中，该现象被称为：", "options": {"A": "信息茧房（Information Cocoon）与回音室效应", "B": "摩尔定律衰减（Moore's Law Decay）", "C": "千年虫危机（Y2K Problem）", "D": "拜占庭将军困境（Byzantine Generals Problem）"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第4章 资讯科技与社会 · 推荐算法与信息茧房", "analysis": "信息茧房指个体只接受契合自身偏好的信息，认知逐渐封闭。选 A。"}, {"id": 33, "chapter": "第4章 资讯科技与社会", "question": "在数字化时代，下列行为属于良好个人隐私保护习惯的是：", "options": {"A": "在网吧电脑上登录网银时勾选“在此设备上记住密码”", "B": "晒登机牌前将姓名、身份证号、票号及条形码/二维码仔细打码遮挡", "C": "将所有账号密码统统统一设为自己的生日", "D": "街头遇到免费送礼品的摊位时任意扫码并授权详细住址"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第4章 资讯科技与社会 · 个人隐私保护习惯", "analysis": "登机牌条码含有乘机人敏感身份数据，遮挡打码能防范信息泄露。选 B。"}, {"id": 34, "chapter": "第4章 资讯科技与社会", "question": "某平台未获授权私自将用户的通讯录与位置轨迹转卖给第三方用于精准广告，严重侵害了：", "options": {"A": "用户个人数据隐私权与知情同意权", "B": "网络硬件独占所有权", "C": "电脑域名解析优先权", "D": "宽带网络上行速率分配权"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第4章 资讯科技与社会 · 个人数据保护与知情同意权", "analysis": "收集使用个人数据必须获得用户的明确知情同意，私自倒卖侵犯隐私权。选 A。"}, {"id": 35, "chapter": "第5章 资讯系统与网络概述", "question": "下列各项中，不属于资讯系统能够为组织带来的核心优势的是：", "options": {"A": "提高业务流程自动化效率，减少人为录入错误", "B": "提供经营数据统计报表，辅助管理层理性决策", "C": "彻底取代人类所有最高层战略决策与伦理判断，实现零人工运营", "D": "优化供应链库存周转率，降低仓储损耗"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第5章 资讯系统与网络概述 · 资讯系统的能力边界", "analysis": "资讯系统辅助决策与流程自动化，但不能完全取代人类最高层的战略与伦理判断。选 C。"}, {"id": 36, "chapter": "第5章 资讯系统与网络概述", "question": "航空公司运用数学模型综合分析客座率、竞争对手价格和燃油成本以动态制定机票价格，该系统属于：", "options": {"A": "交易处理系统（TPS）", "B": "普通超市单据打印系统", "C": "决策支持系统（DSS）", "D": "机械硬盘扇区低级格式化工具"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第5章 资讯系统与网络概述 · 决策支持系统DSS应用", "analysis": "利用数据模型辅助解决复杂半结构化业务预测与决策，属于 DSS。选 C。"}, {"id": 37, "chapter": "第5章 资讯系统与网络概述", "question": "敏捷软件开发（Agile Development）的最核心特征是：", "options": {"A": "采用短周期迭代，频繁交付可用小版本并积极响应需求变化", "B": "项目启动时必须先写完数万页固定技术文档才允许写代码", "C": "开发过程中禁止程序员与真实客户进行任何面对面交流", "D": "开发周期完全取消测试，代码写完直接在生产服务器上线"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第5章 资讯系统与网络概述 · 敏捷开发核心理念", "analysis": "敏捷开发倡导短周期小步快跑、频繁交付与拥抱变化。选 A。"}, {"id": 38, "chapter": "第5章 资讯系统与网络概述", "question": "将双绞线内部的细铜线两两双双扭绞在一起的主要工程目的是：", "options": {"A": "增加线缆拉扯时的机械韧性，看起来更美观", "B": "抵消电磁感应干扰，降低相邻线对间的串扰（Crosstalk）", "C": "使电流以螺旋状旋转加速以突破光速限制", "D": "在网线断裂时利用铜丝弹性自动焊接恢复物理连通"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第5章 资讯系统与网络概述 · 双绞线抗干扰原理", "analysis": "成对反向扭绞能够相互抵消向外辐射并抵御外来电磁串扰。选 B。"}, {"id": 39, "chapter": "第5章 资讯系统与网络概述", "question": "电脑插上网线后无需手动配置即可自动获得 IP、子网掩码与默认网关，背后依靠的协议是：", "options": {"A": "超文本传输协议（HTTP）", "B": "简单邮件传输协议（SMTP）", "C": "文件传输协议（FTP）", "D": "动态主机配置协议（DHCP）"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第5章 资讯系统与网络概述 · DHCP网络配置", "analysis": "DHCP（Dynamic Host Configuration Protocol）负责动态集中分配 IP 与网络参数。选 D。"}, {"id": 40, "chapter": "第5章 资讯系统与网络概述", "question": "以太网网卡出厂时固化的全球唯一 48 位硬件物理地址被称为：", "options": {"A": "IP 地址（Internet Protocol Address）", "B": "URL 统一资源定位符", "C": "MAC 地址（Media Access Control Address）", "D": "端口号（Port Number）"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第5章 资讯系统与网络概述 · MAC物理地址", "analysis": "网卡硬件烧录的全球唯一 48 位物理地址为 MAC 地址。选 C。"}, {"id": 41, "chapter": "第5章 资讯系统与网络概述", "question": "关于传输层 TCP 与 UDP 协议特性的对比，何者完全正确？", "options": {"A": "TCP 专门用于零延迟竞技游戏，UDP 专门用于银行转账", "B": "UDP 传输每个数据包前必须进行长时间握手确认", "C": "TCP 面向连接可靠交付（三次握手丢包重传）；UDP 无连接速度极快（适合视频通话与实时游戏）", "D": "TCP 发生网络拥塞时会立即将所有丢失数据包永久丢弃"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第5章 资讯系统与网络概述 · TCP与UDP对比", "analysis": "TCP 面向连接、保证可靠不丢包；UDP 无连接低延迟开销小。选 C。"}, {"id": 42, "chapter": "第5章 资讯系统与网络概述", "question": "团队开发在线软件，直接租用云厂商提供的带有 Python 运行环境和托管数据库的云平台部署代码，该服务属于：", "options": {"A": "平台即服务（PaaS）", "B": "基础设施即服务（IaaS）", "C": "软件即服务（SaaS）", "D": "硬件即服务（HaaS）"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第5章 资讯系统与网络概述 · 云计算PaaS平台即服务", "analysis": "云服务商提供开发与运行环境，用户只负责部署代码和数据，属于 PaaS。选 A。"}, {"id": 43, "chapter": "第6章 资讯安全与社会责任", "question": "黑客操纵僵尸网络发送海量虚假请求使服务器带宽耗尽瘫痪，导致正常用户无法访问，主要破坏了：", "options": {"A": "机密性（Confidentiality）", "B": "可用性（Availability）", "C": "完整性（Integrity）", "D": "抗抵赖性（Non-repudiation）"}, "answer": "B", "source": "董总高中资讯科技第一册 · 第6章 资讯安全与社会责任 · DDoS与可用性", "analysis": "DDoS 攻击耗尽服务资源使合法用户无法获得正常服务，直接破坏可用性。选 B。"}, {"id": 44, "chapter": "第6章 资讯安全与社会责任", "question": "不依赖宿主文件、能自动扫描网络漏洞并以指数级自我复制主动传播的恶意程序属于：", "options": {"A": "特洛伊木马（Trojan Horse）", "B": "传统文件型病毒（Virus）", "C": "普通间谍广告插件（Adware）", "D": "网络蠕虫（Worm）"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第6章 资讯安全与社会责任 · 网络蠕虫特性", "analysis": "蠕虫具备独立性并能利用网络漏洞主动自我复制传染。选 D。"}, {"id": 45, "chapter": "第6章 资讯安全与社会责任", "question": "现代 HTTPS 协议采用“混合加密体制”传输网页数据，其实际工程组合方式是：", "options": {"A": "非对称加密协商临时对称会话密钥，随后用对称加密传输海量数据", "B": "对数百兆的网页数据全部使用耗费算力的 RSA 逐字节加密", "C": "公网传输只传递明文，由网卡硬件在底层依靠电磁感应保密", "D": "由客户端将自身私钥直接通过明文 HTTP 协议发送给服务器"}, "answer": "A", "source": "董总高中资讯科技第一册 · 第6章 资讯安全与社会责任 · HTTPS混合密码体制", "analysis": "用非对称加密安全交换对称密钥，后续数据通信用高速对称加密。选 A。"}, {"id": 46, "chapter": "第6章 资讯安全与社会责任", "question": "关于单向散列函数（哈希函数，Hash）特性的描述，何者正确？", "options": {"A": "已知哈希值任何人均可通过数学反函数逆向推出原始明文", "B": "哈希值长度取决于原始文件大小，文件越大哈希值越长", "C": "输入任意长度数据均输出固定长度哈希值，微小变动即引发雪崩效应", "D": "哈希函数的核心功能是将压缩包解压还原为原始文本"}, "answer": "C", "source": "董总高中资讯科技第一册 · 第6章 资讯安全与社会责任 · 哈希函数特性", "analysis": "哈希函数固定长度输出，单向不可逆，具有敏感的雪崩效应。选 C。"}, {"id": 47, "chapter": "第6章 资讯安全与社会责任", "question": "在数字证书认证体系中，对数字证书进行权威签名担保的受信任第三方机构被称为：", "options": {"A": "互联网域名与地址分配机构（ICANN）", "B": "国家电力能源总局", "C": "万维网联盟（W3C）", "D": "证书颁发机构（CA, Certificate Authority）"}, "answer": "D", "source": "董总高中资讯科技第一册 · 第6章         async function initReview() {
            const urlParams = new URLSearchParams(window.location.search);
            const stuId = urlParams.get('stuid') || sessionStorage.getItem('ict_book1_stu_id_review') || 'demo_student';

            let record = null;
            // 1. 优先从 Supabase 云端检索
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/exam_submissions?student_id=eq.${encodeURIComponent(stuId)}&order=created_at.desc`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                if (res.ok) {
                    const list = await res.json();
                    const b1Record = list.find(r => r.student_class && r.student_class.includes('[第一册'));
                    if (b1Record) {
                        const timeMins = b1Record.time_spent ? `${Math.floor(b1Record.time_spent / 60)}分${b1Record.time_spent % 60}秒` : '按时提交';
                        record = {
                            student_id: b1Record.student_id,
                            student_name: b1Record.student_name,
                            student_class: b1Record.student_class,
                            score: b1Record.score,
                            total_questions: b1Record.total_questions || 50,
                            user_answers: b1Record.answers || {},
                            time_cost: timeMins,
                            submit_time: b1Record.created_at ? new Date(b1Record.created_at).toLocaleString() : '云端同步'
                        };
                    }
                }
            } catch (e) {
                console.warn('Supabase fetch error, fallback to local', e);
            }

            // 2. 本地缓存降级
            if (!record) {
                try {
                    const s = localStorage.getItem(`ict_book1_sub_${stuId}`);
                    if (s) record = JSON.parse(s);
                } catch (e) {}
            }

            const activeQuestions = qSet1;
            const container = document.getElementById('reviewList');
            container.innerHTML = '';

            if (record) {
                document.getElementById('dispName').innerText = `${record.student_name} 的测验报告（${record.student_class} · ${record.student_id}）`;
                document.getElementById('dispMeta').innerText = `答题用时：${record.time_cost} ｜ 提交时间：${record.submit_time}`;
                document.getElementById('dispScore').innerText = `${record.score} / 100 分`;

                activeQuestions.forEach(q => {
                    const myChoice = record.user_answers[q.id];
                    const isRight = (myChoice === q.answer);
                    renderCard(container, q, myChoice, isRight);
                });
            } else {
                document.getElementById('dispName').innerText = `学号 ${stuId} 的全真考卷全览与错题精析`;
                document.getElementById('dispMeta').innerText = `当前为标准示范答卷调阅模式 ｜ 涵盖全册 50 题深度精析`;
                document.getElementById('dispScore').innerText = `示范解析`;

                activeQuestions.forEach(q => {
                    renderCard(container, q, q.answer, true);
                });
            }
        }

        function renderCard(container, q, myChoice, isRight) {
            const card = document.createElement('div');
            card.className = `q-card ${isRight ? 'is-correct' : 'is-wrong'}`;

            let optsHtml = '';
            ['A', 'B', 'C', 'D'].forEach(k => {
                let cls = 'opt-row';
                let tag = '';
                if (k === myChoice && isRight) {
                    cls += ' user-pick-right';
                    tag = '<span style="margin-left:auto; font-weight:700;">✓ 您的选择(正确)</span>';
                } else if (k === myChoice && !isRight) {
                    cls += ' user-pick-wrong';
                    tag = '<span style="margin-left:auto; font-weight:700;">✗ 您的选择(错误)</span>';
                } else if (k === q.answer && !isRight) {
                    cls += ' correct-ans';
                    tag = '<span style="margin-left:auto; font-weight:700;">✓ 标准正解</span>';
                }
                optsHtml += `<div class="${cls}"><strong>${k}.</strong> ${q.options[k]} ${tag}</div>`;
            });

            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                    <span style="font-weight:700; color:#1e40af;">第 ${q.id} 题 · ${q.chapter}</span>
                    <span style="font-weight:700; color:${isRight ? '#059669' : '#dc2626'};">
                        ${isRight ? '✓ 正确 (+2分)' : '✗ 错误 (0分)'}
                    </span>
                </div>
                <div style="font-size:1rem; font-weight:600; margin-bottom:12px;">${q.question.replace(/\n/g, '<br>')}</div>
                <div>${optsHtml}</div>
                <div style="margin-top:12px; padding:12px; border-radius:8px; background:#eff6ff; font-size:0.88rem; color:#1e40af;">
                    <strong>💡 名师考点精析：</strong>${q.analysis}
                </div>
            `;
            container.appendChild(card);
        }

        window.onload = initReview;
    </script>
