    <script>
        const questions = [{"id": 1, "chapter": "第1章 资讯系统", "question": "资讯系统（Information System）是由多个相互关联的组件组成的有机整体。在一般的系统模型中，收集原始数据并将其输入系统的过程、转换数据的过程，以及将处理结果回传以供调整系统运作的机制，分别被称为：", "options": {"A": "输入（Input）、反馈（Feedback）、输出（Output）", "B": "输入（Input）、处理（Processing）、反馈（Feedback）", "C": "控制（Control）、处理（Processing）、边界（Boundary）", "D": "处理（Processing）、输出（Output）、界面（Interface）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 系统基本概念与要素", "analysis": "资讯系统的五大基本要素为：输入（Input，收集原始数据）、处理（Processing，转换与运算数据）、输出（Output，产生有用信息）、反馈（Feedback，根据输出结果调整输入或处理环节以优化系统性能）以及控制（Control）。题干所指的三个阶段分别对应输入、处理和反馈。"}, {"id": 2, "chapter": "第1章 资讯系统", "question": "系统开发生命周期（SDLC）是规划和构建资讯系统的经典框架。若按照标准开发顺序，下列各项系统开发阶段的排列顺序何者正确？\nI. 系统设计（System Design）\nII. 系统分析（System Analysis）\nIII. 系统规划与调查（System Planning & Investigation）\nIV. 系统实现与编码（System Implementation）\nV. 系统运行与维护（System Maintenance）", "options": {"A": "III ➔ II ➔ I ➔ IV ➔ V", "B": "III ➔ I ➔ II ➔ IV ➔ V", "C": "II ➔ III ➔ I ➔ IV ➔ V", "D": "I ➔ II ➔ III ➔ IV ➔ V"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 系统开发生命周期 (SDLC)", "analysis": "SDLC 标准六/五阶段的严格先后顺序为：1. 系统规划（确定项目可行性与目标）➔ 2. 系统分析（明确使用者需求与业务逻辑）➔ 3. 系统设计（规划架构、界面、数据库）➔ 4. 系统实现/实现与测试（编写代码、安装硬件）➔ 5. 运行与维护（日常检修与更新升级）。因此正确顺序为 III ➔ II ➔ I ➔ IV ➔ V。"}, {"id": 3, "chapter": "第1章 资讯系统", "question": "系统分析员在收集使用者资讯需求时，通常需要针对不同对象采用不同的收集技术。若想要针对全校 2000 名在校学生快速调查对“智慧食堂订餐系统”的整体使用意向与饮食偏好，最经济、高效且能进行量化统计的需求收集方法是：", "options": {"A": "个人深入访谈（Personal Interviews）", "B": "直接现场观察法（On-site Observation）", "C": "问卷调查法（Questionnaires / Surveys）", "D": "联合应用开发会议（JAD Sessions）"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 需求收集技术", "analysis": "问卷调查法（Questionnaire）最大的优势在于可以在极短时间内以极低成本覆盖大量受访者（如全校数千名学生），且数据容易进行量化分析与图表统计。访谈法适合针对少数核心主管或关键岗位深入挖掘复杂需求；现场观察法则适合核实日常流水线实操流程。"}, {"id": 4, "chapter": "第1章 资讯系统", "question": "在关系数据库与实体关系图（ERD）的设计中，关于“主键（Primary Key）”与“外键（Foreign Key）”的描述，下列哪一项叙述是正确的？", "options": {"A": "主键字段的值可以包含重复值，但绝不能为空值（Null）", "B": "每个数据表必须拥有至少两个不同的主键字段", "C": "外键字段用于建立两个表之间的关联，其取值必须参照另一个表的主键或为 Null", "D": "外键字段中存储的数据必须是唯一的，绝对不可重复"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 数据库与实体关系图 (ERD)", "analysis": "主键（Primary Key）是唯一标识数据表中每一条记录的字段（实体完整性），必须唯一且不可为空（Not Null）；外键（Foreign Key）是一个表中的字段，指向另一个表的主键，用于维持参照完整性（Referential Integrity），外键的值可以重复（例如多个学生拥有相同的班级编号），也可以在未确定时允许为 Null。"}, {"id": 5, "chapter": "第1章 资讯系统", "question": "在结构化数据流程图（DFD）中，存在一些必须严格遵守的绘图规则以避免逻辑错误。在 DFD 中，若某一个处理过程（Process）只有输入数据流而没有任何输出数据流，这种逻辑缺陷被称为：", "options": {"A": "黑洞（Black Hole）", "B": "奇迹（Miracle）", "C": "灰洞（Gray Hole）", "D": "死锁（Deadlock）"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 数据流程图 (DFD) 语法规则", "analysis": "在 DFD 中：1. 只有输入没有输出的处理过程称为“黑洞（Black Hole）”；2. 只有输出没有输入的处理过程称为“奇迹（Miracle）”；3. 输入的数据不足以产生该输出结果（数据产生逻辑断层）称为“灰洞（Gray Hole）”。"}, {"id": 6, "chapter": "第1章 资讯系统", "question": "某独中教务处引进了全新的云端学籍与排课系统。由于旧系统年久失修且架构陈旧，校方决定于 12 月 31 日彻底停用旧系统，并于次年 1 月 1 日直接全校切换启用新系统。这种转换方式虽然成本最低、用时最短，但所承担的风险最大的系统转换策略是：", "options": {"A": "并行转换（Parallel Conversion）", "B": "直接转换（Direct Cutover / Conversion）", "C": "分段转换（Phased Conversion）", "D": "试点转换（Pilot Conversion）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 系统转换策略", "analysis": "直接转换（Direct Conversion / Cutover）是指在指定时间点瞬间停用旧系统并全面开启新系统（一刀切）。其特点是耗资最少、无需维护两套系统数据，但一旦新系统发生未知崩溃，组织将没有任何后备系统可用，风险最高。"}, {"id": 7, "chapter": "第1章 资讯系统", "question": "在系统投入日常运行后，技术团队接获使用者通报：在每月最后一天结算账目时，系统会偶发性出现“除以零（Division by Zero）”的致命运行时错误并强行退出。技术人员迅速定位代码并修正此缺陷。这属于下列哪一种系统维护？", "options": {"A": "纠正性维护（Corrective Maintenance）", "B": "适应性维护（Adaptive Maintenance）", "C": "完善性维护（Perfective Maintenance）", "D": "预防性维护（Preventive Maintenance）"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 系统维护的类型", "analysis": "纠正性维护（Corrective Maintenance）专门指诊断并修复系统在运行过程中暴露出的程序 Bug、逻辑计算错误或软硬件故障；适应性维护是因应外部软硬件环境或法律政策变更而调整；完善性维护是优化功能性能与界面体验；预防性维护是提前防范未来潜在隐患。"}, {"id": 8, "chapter": "第1章 资讯系统", "question": "某国际物流企业的高级管理层在制定未来 3 年的亚太区仓储投资决策时，利用资讯系统输入“如果油价上涨 20%”或“如果海运关税下调 5%”等假设情境，系统自动模拟出不同的财务风险模型与利润预测。这种具备“假设分析（What-If Analysis）”能力的资讯系统属于：", "options": {"A": "交易处理系统（TPS）", "B": "办公室自动化系统（OAS）", "C": "决策支援系统（Decision Support System, DSS）", "D": "条码扫描库存管理系统"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 管理资讯系统的金字塔架构", "analysis": "决策支援系统（DSS）服务于中高阶管理层，其核心特征是具备数学分析模型，支持半结构化或非结构化决策，尤其具备“假设模拟（What-If Analysis）”、“敏感度分析（Sensitivity Analysis）”与目标求解功能。"}, {"id": 9, "chapter": "第1章 资讯系统", "question": "在敏捷软件开发（Agile Development）方法中，开发团队通常打破传统瀑布模型长达数月乃至数年的漫长交付周期，而是将开发任务切分为数个为期 2~4 周的短周期，每个周期结束后均向客户交付可运行的软件增量版本。这个短迭代开发周期被称为：", "options": {"A": "里程碑（Milestone）", "B": "冲刺 / 迭代（Sprint / Iteration）", "C": "关键路径（Critical Path）", "D": "甘特区间（Gantt Span）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 现代敏捷开发方法", "analysis": "敏捷开发（如 Scrum 框架）的核心工作单位是“冲刺（Sprint）”或迭代（Iteration），通常持续 1 至 4 周。团队在每个 Sprint 结束时完成一份可供演示和投入运行的功能增量，以便快速获得客户反馈并灵活响应需求变更。"}, {"id": 10, "chapter": "第1章 资讯系统", "question": "系统分析员在整理大型商场会员积分规则时发现：顾客在周一至周五与周末折扣不同，同时还受会员等级（黄金、白银、普通）以及单次消费金额是否超过 RM300 等多重条件交叉影响。为了清晰、完整且毫无遗漏地表达这种多条件交叉组合的逻辑规则，最适合采用的逻辑说明工具是：", "options": {"A": "实体关系图（ERD）", "B": "决策表（Decision Table）", "C": "网络拓扑图（Topology Map）", "D": "甘特图（Gantt Chart）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 过程逻辑说明工具 (决策表与决策树)", "analysis": "当业务逻辑由多个复杂条件的不同组合所决定时，决策表（Decision Table）是最佳的结构化分析工具。它通过条件桩、动作桩、条件项与动作项的矩阵组合，能有效避免因条件繁复而导致的逻辑漏洞或规则冲突。"}, {"id": 11, "chapter": "第2章 网络类型与传输质量", "question": "跨越国家、大洲甚至连接全球不同地区计算机设备的超大型网络体系，例如跨国跨洋的网际网络（Internet），按照计算机网络的地理覆盖范围分类属于：", "options": {"A": "广域网（Wide Area Network, WAN）", "B": "城域网（Metropolitan Area Network, MAN）", "C": "局域网（Local Area Network, LAN）", "D": "个人区域网（Personal Area Network, PAN）"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 网络范围分类", "analysis": "按地理覆盖范围划分：PAN（数米以内）、LAN（单一建筑物或校园，通常几公里以内）、MAN（城市范围，数公里至数十公里）、WAN（广域网，跨越城市、国家乃至全球，通过公共电信运营商或海底光缆长途互联）。"}, {"id": 12, "chapter": "第2章 网络类型与传输质量", "question": "在光纤通信中，“单模光纤（Single-Mode Fiber, SMF）”与“多模光纤（Multi-Mode Fiber, MMF）”具有不同的物理结构与适用场景。下列关于两者的比较，哪一项叙述是正确的？", "options": {"A": "单模光纤的纤芯直径极细，光线以单一路径直线传播，适合数十公里以上的长途骨干传输", "B": "多模光纤由于使用激光作为光源，传输距离比单模光纤更远且色散极低", "C": "单模光纤通常使用廉价的发光二极管（LED）作为光源，多用于大楼内部局域网", "D": "多模光纤的纤芯直径较细，能够完全消除光波的多径反射色散现象"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 有线传输介质 (光纤)", "analysis": "单模光纤（SMF）纤芯非常细（约 9 微米），采用单色性极好的激光（Laser）作为光源，光线沿单一轴向传输无模式色散，衰减极小，支持数十至数百公里的长途骨干传输；多模光纤（MMF）纤芯较粗（50/62.5 微米），光线以多角度反射前进，存在模式色散，传输距离通常限制在几公里甚至几百米以内，常用于机房和建筑物内短途互联。"}, {"id": 13, "chapter": "第2章 网络类型与传输质量", "question": "无线路由器通常支持 2.4 GHz 和 5 GHz 两个无线工作频段（双频 Wi-Fi）。若某位同学的卧室与客厅路由器之间隔着两堵较厚的混凝土承重墙，且他需要较为稳定的信号连接。在没有额外中继器的情况下，关于这两个频段的物理特性，下列说法何者正确？", "options": {"A": "5 GHz 频段波长更长，绕射和穿墙能力更强，此时应首选 5 GHz", "B": "2.4 GHz 频段电磁波波长较长，衰减较慢且穿透与绕射能力较优，信号覆盖更远", "C": "5 GHz 频段比 2.4 GHz 具有更多家电（如微波炉、蓝牙）的无线信道干扰", "D": "两个频段在穿透实体墙体时的能量衰减程度完全相同"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 无线传输介质与无线频段", "analysis": "根据电磁波物理特性，频率越低，波长越长，绕射（衍射）能力越强，穿墙损耗相对较小，因此 2.4 GHz 信号传播范围广、穿墙能力更好；而 5 GHz 频率高、波长短，带宽高且传输速率快、干扰少，但穿透墙壁时衰减极其剧烈，适合近距离无遮挡高速传输。"}, {"id": 14, "chapter": "第2章 网络类型与传输质量", "question": "在局域网中最广泛采用的物理拓扑结构是“星状拓扑（Star Topology）”。关于星状网络拓扑的运行特征，下列叙述何者正确？", "options": {"A": "网络中任意一台工作站电脑损坏断网，整个网络将立即全面瘫痪", "B": "所有节点均连接到一条中央共享公共总线缆上，两端需要终结电阻", "C": "所有工作站均连接到中央交换机（Switch），若中央交换机损坏，全网将无法通信", "D": "数据包必须像环形跑道一样沿着顺时针方向依次途经每一台主机转发"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 网络拓扑结构 (星状拓扑)", "analysis": "星状拓扑（Star Topology）所有终端通过独立双绞线连接到中央集线/交换设备。单台电脑或某根连线损坏仅影响该设备自身，易于维护与扩展；但中央设备是单一故障点（Single Point of Failure），中央交换机一旦断电或损毁，所有连接该设备的通信全面中断。"}, {"id": 15, "chapter": "第2章 网络类型与传输质量", "question": "在数据通信中，根据信号在传输通道上的流通方向与时间关系，数据传输方向模式可分为单工、半双工和全双工。传统的对讲机（Walkie-Talkie）在通信时，双方可以轮流发言，但一人按下对讲键讲话时，另一人只能收听而无法同时插话。这种通信模式属于：", "options": {"A": "单工（Simplex）", "B": "半双工（Half-Duplex）", "C": "全双工（Full-Duplex）", "D": "频分复用（FDM）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 数据传输方向模式", "analysis": "单工（Simplex）仅允许信号单向流动（如传统 FM 收音机）；半双工（Half-Duplex）允许数据双向传递，但在同一时刻只能由一方发送、另一方接收（如对讲机）；全双工（Full-Duplex）允许通信双方在同一时刻同时进行双向收发（如手机通话、现代全双工以太网）。"}, {"id": 16, "chapter": "第2章 网络类型与传输质量", "question": "早期的电话线通信或有线电视宽带需要使用调制解调器（Modem）。调制解调器的核心功能是实现计算机处理的数字信号（Digital Signals）与物理模拟信道中传输的模拟信号（Analog Signals）之间的相互转换。其中，将“数字信号转换为模拟信号”的过程称为：", "options": {"A": "解调（Demodulation）", "B": "调制（Modulation）", "C": "路由（Routing）", "D": "封包（Packetizing）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 调制解调技术", "analysis": "调制（Modulation）是指将计算机内部的离散“数字信号”转换为适合在模拟介质（如电话双绞线）中长途传输的连续“模拟信号”（发端）；反之，将模拟信号还原为数字信号的过程称为解调（Demodulation，收端）。"}, {"id": 17, "chapter": "第2章 网络类型与传输质量", "question": "在网络传输性能的衡量指标中，从发送端向传输介质推入数据包开始，到该数据包的最后一个比特完全离开网卡进入线路所耗费的时间，被称为：", "options": {"A": "传播时延（Propagation Delay）", "B": "排队时延（Queuing Delay）", "C": "传输时延（Transmission Delay / 发送时延）", "D": "处理时延（Processing Delay）"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 网络时延与性能分析", "analysis": "总时延由四部分组成：1. 传输时延（Transmission Delay = 数据大小 / 链路带宽，即主机将数据所有比特打入信道的时间）；2. 传播时延（Propagation Delay = 物理链路长度 / 电磁波传播速率，即电磁波在物理介质中跑过一定距离所需时间）；3. 排队时延；4. 处理时延。"}, {"id": 18, "chapter": "第2章 网络类型与传输质量", "question": "在工业自动化厂房或高压变电站等强电磁干扰环境下布设网络时，为了防止外部强烈的高频电磁脉冲干扰通信质量，网络工程师应当优先选用的双绞线规格是：", "options": {"A": "非屏蔽双绞线（UTP）", "B": "屏蔽双绞线（STP）", "C": "普通平行电话线", "D": "细同轴电缆（10Base2）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 双绞线类型 (STP vs UTP)", "analysis": "屏蔽双绞线（Shielded Twisted Pair, STP）在双绞线对外部包裹有金属金属箔或金属编织网屏蔽层，能够极大程度地抵御外部强电磁干扰（EMI）与无线电射频干扰（RFI），特别适用于工厂、变电站等恶劣电磁环境；UTP 则没有金属屏蔽层，仅适用于普通办公室或家庭。"}, {"id": 19, "chapter": "第2章 网络类型与传输质量", "question": "在大型企业局域网中，采用“主从式架构（Client-Server Architecture）”相较于“对等式网络（Peer-to-Peer, P2P）”的核心管理优势在于：", "options": {"A": "网络无需采购任何昂贵的高性能专用服务器硬件", "B": "所有普通客户端电脑具有同等的系统管理控制权限", "C": "便于集中管理用户账户安全策略、访问授权与核心业务数据统一备份", "D": "单台客户端电脑发生故障会导致整个局域网的所有用户均无法开机"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 集中式管理与网络架构", "analysis": "主从式架构（Client-Server）通过中心服务器集中提供文件、打印、身份验证和数据库服务，最大的优势是集中式安全权限管控、统一高效备份以及强大的访问控制；对等网络（P2P）没有中心服务器，管理分散，不适合节点多于 10 台的大型组织。"}, {"id": 20, "chapter": "第2章 网络类型与传输质量", "question": "第五代移动通信技术（5G）定义了三大典型业务应用场景以满足多元化的数字时代需求。其中，专为智能电网控制、远程无人手术以及高可靠自动驾驶防撞等业务量身定制的 5G 核心特性场景是：", "options": {"A": "增强移动宽带（eMBB）", "B": "超高可靠超低时延通信（uRLLC）", "C": "海量机器类通信（mMTC）", "D": "非对称数字用户线路（ADSL）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 5G 通信三大核心应用场景", "analysis": "国际电信联盟（ITU）定义的 5G 三大核心场景：1. eMBB（增强移动宽带，面向 8K 超高清、AR/VR 等大带宽需求）；2. uRLLC（超高可靠超低时延通信，要求时延在 1 毫秒级、可靠性达 99.999%，面向自动驾驶、远程手术、工业精密控制）；3. mMTC（海量机器通信，面向智慧城市万物互联）。"}, {"id": 21, "chapter": "第3章 网络通讯与作业系统", "question": "在数据从应用层向物理层自顶向下逐层封装发送的过程中，数据在各层被添加了相应的协议首部（Header）。在 OSI 模型中，下列各层所处理的协议数据单元（PDU）术语对应完全正确的是：", "options": {"A": "传输层 —— 数据帧（Frame）；网络层 —— 数据包（Packet）", "B": "传输层 —— 数据段（Segment）；网络层 —— 数据包（Packet）；数据链路层 —— 数据帧（Frame）", "C": "网络层 —— 比特（Bit）；数据链路层 —— 数据段（Segment）", "D": "应用层 —— 数据段（Segment）；物理层 —— 数据帧（Frame）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · OSI 模型协议数据单元 (PDU)", "analysis": "OSI 参考模型各层数据单元（PDU）标准命名：物理层为“比特（Bits）”；数据链路层为“帧（Frames）”；网络层为“数据包 / 分组（Packets）”；传输层为“数据段（Segments）”；高三层统称为“数据 / 报文（Data / Message）”。"}, {"id": 22, "chapter": "第3章 网络通讯与作业系统", "question": "网卡在出厂时被烧录了唯一的物理硬件地址，即 MAC 地址（Media Access Control Address）。一个标准的以太网 MAC 地址长度通常是多少位元（Bits），以及前 24 位通常代表什么含义？", "options": {"A": "32 位元；代表所在子网的网络 ID", "B": "128 位元；代表网卡出厂序列号", "C": "48 位元；代表机构唯一识别码（OUI / 网卡生产厂商代码）", "D": "64 位元；代表数据链路层优先级标记"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · MAC 地址结构与原理", "analysis": "MAC 地址总长为 48 位元（6 字节），通常书写为 12 位十六进制数（例如 00:1A:2B:3C:4D:5E）。其中前 24 位（前 3 字节）是由 IEEE 官方统一分配给网卡生产制造商的机构唯一标识符（OUI, Organizationally Unique Identifier）；后 24 位则由厂家自行分配给具体网卡作为唯一序列号。"}, {"id": 23, "chapter": "第3章 网络通讯与作业系统", "question": "在 TCP/IP 体系中，为了区分同一台服务器上运行的不同网络应用程序，传输层引入了“端口号（Port Number）”。下列常用知名服务与其默认预留端口号的配对，哪一项是错误的？", "options": {"A": "HTTP 网页浏览服务 —— 端口 80", "B": "HTTPS 安全加密网页服务 —— 端口 443", "C": "DNS 域名解析服务 —— 端口 53", "D": "FTP 文件传输服务 —— 端口 25"}, "answer": "D", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · 常见服务预留端口号", "analysis": "FTP（文件传输协议）的标准预留端口为 20（数据连接）和 21（控制连接）；端口 25 是简单邮件传输协议（SMTP）的标准预留端口。选项 A（HTTP 80）、B（HTTPS 443）、C（DNS 53）均配对正确。"}, {"id": 24, "chapter": "第3章 网络通讯与作业系统", "question": "某学校机房被分配了一个子网 IP 地址块：`192.168.10.0 /26`。请根据无类别域间路由（CIDR）规则计算，该子网对应的子网掩码（Subnet Mask）以及该子网内实际可分配给电脑使用的有效主机 IP 地址总数分别为：", "options": {"A": "255.255.255.128 ； 126 个", "B": "255.255.255.192 ； 62 个", "C": "255.255.255.224 ； 30 个", "D": "255.255.255.0 ； 254 个"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · 子网掩码与 CIDR 主机数计算", "analysis": "CIDR 前缀为 /26，意味着前 26 位为全 1，后 6 位为全 0。第四字节二进制为 11000000 = 128 + 64 = 192，故子网掩码为 255.255.255.192。主机位共有 32 - 26 = 6 位，总 IP 数为 2^6 = 64 个。扣除 1 个网络地址（全0）和 1 个广播地址（全1），实际可分配的有效主机 IP 数为 64 - 2 = 62 个。"}, {"id": 25, "chapter": "第3章 网络通讯与作业系统", "question": "TCP 协议在发送应用数据之前，必须在客户端与服务器之间建立可靠的端到端虚电路连接。建立该连接所经历的“三次握手（Three-way Handshake）”控制报文标志位传递顺序是：", "options": {"A": "SYN ➔ SYN + ACK ➔ ACK", "B": "ACK ➔ SYN ➔ FIN", "C": "SYN ➔ ACK ➔ FIN", "D": "RST ➔ SYN ➔ ACK"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · TCP 三次握手连接机制", "analysis": "TCP 三次握手流程：1. 客户端发送同步报文段 [SYN, Seq=x] 请求建连；2. 服务器回复同步确认报文段 [SYN, ACK, Seq=y, Ack=x+1]；3. 客户端发送确认报文段 [ACK, Ack=y+1]，连接正式建立（ESTABLISHED）。因此标志位顺序为 SYN ➔ SYN+ACK ➔ ACK。"}, {"id": 26, "chapter": "第3章 网络通讯与作业系统", "question": "在 Windows 或 Linux 终端命令行中，若网络管理员想要检测某台主机是否能够通过网络顺利到达目标服务器，并测算数据往返时间（RTT）与丢包率，最常用、基于 ICMP 协议的诊断命令是：", "options": {"A": "ipconfig", "B": "ping", "C": "netstat", "D": "tracert"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · 常见网络排错命令工具", "analysis": "ping 命令基于网络层的 ICMP 协议（Echo Request 与 Echo Reply），主要用于测试两台主机之间的基本网络连通性、网络往返时延（RTT）及丢包率；tracert 追踪路由跳数；ipconfig 查询本机 IP 配置；netstat 查看活跃端口与网络连接。"}, {"id": 27, "chapter": "第3章 网络通讯与作业系统", "question": "由于全球公网 IPv4 地址极度匮乏，绝大多数学校与家庭宽带路由器均部署了“网络地址转换（Network Address Translation, NAT）”技术。NAT 在局域网访问互联网时的核心工作机制是：", "options": {"A": "将计算机中的字符域名自动解析转换为对应的 IPv4 地址", "B": "把所有局域网内部私有 IP 数据包转换为未经加密的物理无线电波", "C": "将内网多台电脑的私有 IP 地址与端口映射转换为路由器对外的单一公网 IP 地址", "D": "拦截并永久丢弃所有包含多媒体视频流的网络数据包"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · 网络地址转换 (NAT) 机制", "analysis": "NAT（尤其是 NAPT 端口多路复用）允许局域网内部成百上千台配置私有 IP（如 192.168.x.x）的主机，通过路由器的 NAT 表建立私网 IP+内部端口与公网 IP+外部端口的映射关系，共享极少量的合法公网 IPv4 地址并发访问互联网，有效缓解了 IPv4 地址枯竭问题。"}, {"id": 28, "chapter": "第3章 网络通讯与作业系统", "question": "动态主机配置协议（DHCP）在为新接入网络的客户端电脑自动分配 IP 参数时，客户端与 DHCP 服务器之间按顺序交换的四个核心报文（简称 DORA 流程）是：", "options": {"A": "Discover ➔ Offer ➔ Request ➔ Acknowledgment", "B": "DNS ➔ Open ➔ Read ➔ Accept", "C": "Disconnect ➔ Offline ➔ Reconnect ➔ Active", "D": "Detect ➔ Option ➔ Reset ➔ Apply"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · DHCP 四步交互机制 (DORA)", "analysis": "DHCP 四步租约过程标准缩写为 DORA：1. DHCP Discover（客户端广播寻找服务器）；2. DHCP Offer（服务器单播/广播提供可用 IP 方案）；3. DHCP Request（客户端广播请求租用该 IP）；4. DHCP Acknowledgment（服务器确认分配并生效）。"}, {"id": 29, "chapter": "第3章 网络通讯与作业系统", "question": "在 Windows Server 等网络操作系统中，微软提供的“活动目录（Active Directory, AD）”服务扮演着核心管理角色。下列关于活动目录主要功能的描述，何者正确？", "options": {"A": "主要用于对损坏的计算机硬盘执行物理磁道修复", "B": "提供集中式的目录数据库，实现全校师生用户账号、权限安全与组策略（Group Policy）的统一验证管理", "C": "自动将 4G 手机网络信号放大为 5G 光纤宽带", "D": "实时监测网络电缆内部铜芯的物理温度与电压波动"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · 网络操作系统与活动目录 (AD)", "analysis": "活动目录（Active Directory, AD）是 Windows 网络操作系统中的分布式目录服务中枢，其核心职能是集中式存储网络资源对象信息，提供基于域（Domain）的集中用户身份验证、授权、组策略（Group Policy）强制下发以及单一登录（SSO）体验。"}, {"id": 30, "chapter": "第3章 网络通讯与作业系统", "question": "学校老师在居家办公或出差期间，需要安全访问学校内部机房限定内网才能打开的“期末考生成绩录入系统”。为了在公共开放的互联网上建立一条点对点的私有加密安全隧道，老师电脑上应当启用的网络技术是：", "options": {"A": "万维网（WWW）", "B": "对等网络（P2P）", "C": "虚拟专用网（Virtual Private Network, VPN）", "D": "简单网络管理协议（SNMP）"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · 虚拟专用网 (VPN) 安全隧道", "analysis": "虚拟专用网（VPN）利用加密与隧道协议（如 IPsec、SSL/TLS），在非安全的公共互联网络上建立一条逻辑上的专用安全加密通道。远程办公人员接入 VPN 后，如同直接接入学校内网局域网，数据传输受到高强度加密保护，防止被窃听或篡改。"}, {"id": 31, "chapter": "第4章 网络安全与网络资源分享", "question": "信息安全领域最公认的基础核心是“CIA 三要素”模型。某黑客通过 SQL 注入漏洞入侵了某银行的账务数据库，私下将自己的账户余额由 RM100 篡改为 RM1,000,000，但未窃取或删除任何其他客户的数据。该黑客的恶意行为主要破坏了信息安全的哪一个属性？", "options": {"A": "机密性（Confidentiality）", "B": "完整性（Integrity）", "C": "可用性（Availability）", "D": "不可抵赖性（Non-repudiation）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 信息安全 CIA 三要素", "analysis": "CIA 三要素分别为：1. 机密性（Confidentiality，防非授权泄露）；2. 完整性（Integrity，防非授权篡改、伪造或未授权变动）；3. 可用性（Availability，防系统拒绝服务或瘫痪）。黑客私自修改数据库中的存款金额属于典型的数据篡改，破坏了“完整性”。"}, {"id": 32, "chapter": "第4章 网络安全与网络资源分享", "question": "在恶意软件（Malware）分类中，“计算机蠕虫（Computer Worm）”与传统“计算机病毒（Computer Virus）”具有明显的行为差异。下列关于蠕虫最典型的特征描述是：", "options": {"A": "必须依赖宿主文件（如 .exe 或 Office 文档），且需要用户主动双击运行才能激活", "B": "具备独立运行能力，无需依附宿主文件，能通过网络端口或系统漏洞自主快速自我复制与广泛传播", "C": "表面上伪装成好玩的游戏外挂，后台悄悄开启后门端口供黑客控制", "D": "只能通过物理 U 盘手工拷贝传播，完全无法在网络中流动"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 病毒 vs 蠕虫的核心差异", "analysis": "传统计算机病毒（Virus）必须寄生在其他宿主程序或文件中，需要人工触发/执行才能激活；而计算机蠕虫（Worm）是完全独立的恶意程序，无需宿主文件，能够自主利用网络协议漏洞或弱密码扫描，主动将自身副本狂暴传播到整个局域网或互联网，常造成网络带宽被瞬间耗尽。"}, {"id": 33, "chapter": "第4章 网络安全与网络资源分享", "question": "某用户在电脑使用网银时，发现只要输入账号密码，隔天其账户就会被盗刷。经专业安全工程师检测，发现其电脑在后台静默运行了一个恶意软件，该软件在内核层截获并隐蔽记录用户在键盘上的每一个击键动作，并将数据悄悄打包发送至黑客服务器。这种间谍软件被称为：", "options": {"A": "键盘记录器（Keylogger）", "B": "勒索软件（Ransomware）", "C": "逻辑炸弹（Logic Bomb）", "D": "宏病毒（Macro Virus）"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 间谍软件与键盘记录器", "analysis": "键盘记录器（Keylogger）属于间谍软件（Spyware）的一种，其核心功能是暗中监听、捕获并记录目标用户在物理或虚拟键盘上的按键序列（包括登录凭据、网银密码、聊天记录等），并偷偷回传给攻击者。"}, {"id": 34, "chapter": "第4章 网络安全与网络资源分享", "question": "在商场、咖啡馆等公共场所连接没有任何密码的开放式公共 Wi-Fi 热点时，用户最容易遭受黑客发起的“中间人攻击（Man-in-the-Middle Attack, MitM）”。防范此类安全风险最有效的防护手段是：", "options": {"A": "调低手机屏幕亮度，防止身后有人窥视", "B": "在公共网络下访问网站时优先强制使用 HTTPS 加密连接，并配合开启 VPN 保护通道", "C": "关闭手机的飞行模式并开启蓝牙自动广播功能", "D": "每次浏览网页后立即关闭浏览器历史记录"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 公共网络安全防护与中间人攻击", "analysis": "在未加密的开放公共 Wi-Fi 环境中，黑客极易利用 ARP 欺骗或设立山寨钓鱼热点截获局域网未加密明文数据包（中间人攻击）。使用高强度端到端加密的 HTTPS 协议以及开启具备隧道加密能力的 VPN，能确保即使流量被窃听截获，黑客也只能看到无法解密的密文。"}, {"id": 35, "chapter": "第4章 网络安全与网络资源分享", "question": "现代 HTTPS 通信协议在建立安全加密通道时，巧妙结合了“对称密钥加密”与“非对称密钥加密”两者的优点。关于两者在 HTTPS 中的分工，下列描述准确的是：", "options": {"A": "全程 100% 只使用非对称加密传输所有网页图文内容，完全不使用对称加密", "B": "在握手阶段使用非对称加密安全协商并交换会话密钥；在后续网页大量数据传输中采用对称加密进行高效加密", "C": "在握手阶段使用对称加密核验服务器身份；在数据传输阶段使用非对称加密提高传输速率", "D": "对称加密算法的运算开销极大，因此只能用来传输小于 10 字节的纯文本"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 混合加密机制 (HTTPS)", "analysis": "非对称加密（如 RSA、ECC）安全性高、密钥分发安全，但数学运算复杂、速度缓慢；对称加密（如 AES）加解密速度极快，但密钥分发存在安全隐患。HTTPS 采用混合加密：在初始 TLS 握手阶段利用非对称加密验证身份并安全协商对称“会话密钥（Session Key）”；随后的大规模网页数据传输全程采用高效的对称加密进行加解密。"}, {"id": 36, "chapter": "第4章 网络安全与网络资源分享", "question": "某大型互联网系统在数据库中存储千万级会员的登录密码时，坚决杜绝存储明文密码，而是使用单向加密哈希算法（如 SHA-256）结合“加盐机制（Salting）”进行哈希存储。在密码存储中引入“盐值（Salt）”的核心目的是：", "options": {"A": "使管理员能够随时通过反向逆运算轻松还原出用户的原始明文密码", "B": "为每个用户随机生成不同字符串附加到密码后再进行哈希，有效防范黑客利用彩虹表（Rainbow Table）批量逆向破解", "C": "加快数据库执行 SQL 登录查询时的物理硬件扫描速度", "D": "自动缩短用户的密码长度以节省数据库存储硬盘空间"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 哈希算法与密码加盐存储 (Salting)", "analysis": "加盐（Salting）是指在对用户密码计算单向散列哈希值之前，在密码中混入一段由系统随机生成的唯一字符串（盐值）。这样即使两位用户的密码完全相同，生成的哈希值也截然不同，彻底粉碎了黑客利用预先计算好的“彩虹表（Rainbow Table）”进行碰撞还原攻击的途径。"}, {"id": 37, "chapter": "第4章 网络安全与网络资源分享", "question": "学校数据中心为了防范硬盘损毁或勒索软件攻击，设计了一套数据备份方案：每周日午夜执行一次耗时较长的“完整备份（Full Backup）”，而在周一至周六的每个夜晚，系统仅备份自上一次任何类型备份之后“新增或修改变动过”的文件。这种周一至周六采用的备份方式属于：", "options": {"A": "增量备份（Incremental Backup）", "B": "差异备份（Differential Backup）", "C": "热备镜像（Mirror Backup）", "D": "冷归档备份（Cold Archiving）"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 数据备份策略 (增量 vs 差异)", "analysis": "增量备份（Incremental Backup）仅备份自“上一次备份（无论是完整还是增量备份）”以来发生修改的数据，其特点是备份速度最快、占用存储空间最省，但在还原时必须依次恢复完整备份及之后所有的增量备份；差异备份（Differential Backup）则是备份自“上一次完整备份”以来的所有变动数据。"}, {"id": 38, "chapter": "第4章 网络安全与网络资源分享", "question": "黑客并不依赖高深的程序代码破解漏洞，而是故意伪装成某独中电脑中心的技术人员，打电话给初一新入职教师，声称“系统正在例行维护，需要老师立刻口头报上账号与密码以防账户被锁”。这种利用人类心理弱点、信任或疏忽大意来诱骗获取机密敏感信息的攻击手段统称为：", "options": {"A": "缓冲区溢出攻击（Buffer Overflow）", "B": "社交工程学攻击（Social Engineering）", "C": "SYN 洪水攻击（SYN Flood）", "D": "端口扫描攻击（Port Scanning）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 社交工程学 (Social Engineering)", "analysis": "社交工程学（Social Engineering）是指攻击者通过心理操纵、伪装身份、欺骗、威逼利诱等非技术手段，突破人类防线来获取未经授权的系统访问权限或机密凭据（如假冒网管、虚构紧急情境）。防范社交工程学最有效的手段是对员工进行持续的安全意识培训。"}, {"id": 39, "chapter": "第4章 网络安全与网络资源分享", "question": "某大型商业银行由于处理高度机密的金融资产数据与客户征信报告，受国家金融监管法规严格限制，禁止将核心交易系统托管在第三方公共云端。因此，该银行斥巨资在自建数据中心机房内搭建了完全由本行专属拥有、自主运维且物理隔离的云计算环境。这种云计算部署模型属于：", "options": {"A": "公有云（Public Cloud）", "B": "私有云（Private Cloud）", "C": "社区云（Community Cloud）", "D": "混合云（Hybrid Cloud）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 云计算部署模型", "analysis": "云计算按部署模型分类：1. 公有云（Public Cloud，由第三方云商运营供大众共享使用，如 AWS、阿里云）；2. 私有云（Private Cloud，由单一组织独家拥有并使用，具备最高的安全管控与合规隐私保障）；3. 混合云（结合公有云与私有云优势）；4. 社区云（特定利益共同体共享）。"}, {"id": 40, "chapter": "第4章 网络安全与网络资源分享", "question": "在企业级数据中心存储架构中，“存储区域网络（Storage Area Network, SAN）”被广泛用于支撑核心数据库服务器。相较于普通网络附属存储（NAS），SAN 最显著的技术特征是：", "options": {"A": "通过局域网以普通文件级别（File-level）为普通办公电脑提供日常文件共享", "B": "通过高速专用网络（如光纤通道 Fibre Channel）提供底层块级（Block-level）存储，服务器直接视其为本地物理硬盘", "C": "只能使用廉价的双绞线连接，无法支持高速光纤接口", "D": "内部无法配置任何 RAID 磁盘阵列冗余技术"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 网络存储技术 (SAN vs NAS)", "analysis": "NAS（网络附属存储）工作在文件级别（File-level），采用 NFS/SMB 协议，面向客户端提供文件级共享，适合文档存取；SAN（存储区域网络）工作在块级别（Block-level），采用高速专用网络（如 FC 光纤通道或 iSCSI），服务器将远程 SAN 存储逻辑单元（LUN）直接识别为本地原生裸硬盘，具备极高的 I/O 吞吐率与超低时延，主要面向大型数据库与虚拟化集群。"}, {"id": 41, "chapter": "第5章 物联网与其应用", "question": "在物联网（IoT）系统中，传感器是感知物理世界变化的基础硬件。学校创客工坊的同学们想要制作一个“倒车防撞报警小车”，要求小车在倒退过程中能够实时发射并接收高频声波反射，从而精确测量与后方障碍物之间的厘米级物理距离。他们应当选用下列哪一种传感器？", "options": {"A": "超声波测距传感器（Ultrasonic Sensor）", "B": "光敏电阻光照传感器（Photoresistor / LDR）", "C": "湿度传感器（Humidity Sensor）", "D": "火焰传感器（Flame Sensor）"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 常见传感器类型与应用", "analysis": "超声波传感器（如常见的 HC-SR04）通过发射 40kHz 高频声波并计算接收到反射回波的时间差（声速物理原理），能够精确计算出前方障碍物的相对物理距离，广泛应用于智能避障小车、汽车倒车雷达及无人机定高悬停。"}, {"id": 42, "chapter": "第5章 物联网与其应用", "question": "在移动互联网时代，二维码（QR Code）全面取代了传统的一维条形码（Barcode）。关于 QR Code 较传统条形码所具备的核心优势，下列叙述何者错误？", "options": {"A": "QR Code 在水平和垂直两个维度上均能存储数据，信息容量呈几何级数提升", "B": "QR Code 能够直接编码包含中文汉字、特殊符号以及完整的网页 URL 超链接", "C": "QR Code 具有纠错编码能力，即使表面产生污损或破损一定比例，依然能够被正常识读", "D": "QR Code 必须依赖专用的激光扫码枪接触才能扫描，普通智能手机的摄像头完全无法识别"}, "answer": "D", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 二维码技术优势与纠错机制", "analysis": "选项 D 错误：QR Code 最大的普及优势正是其兼容性，任何带有摄像头的普通智能手机均可直接拍照识别解析；一维条码只能横向存储极少量数字编号，而 QR Code 支持二维存储、大容量、汉字支持以及高达 7%~30% 的 Reed-Solomon 容错纠错能力。"}, {"id": 43, "chapter": "第5章 物联网与其应用", "question": "智能手环或智能手表需要持续监测佩戴者的心率与步数，并通过无线电与手机同步数据，同时要求一颗微型纽扣电池或小容量锂电池能够维持数天甚至数周的续航。为了达到这一超低功耗目标，手环与手机之间最适合采用的短距离无线通信技术是：", "options": {"A": "低功耗蓝牙（Bluetooth Low Energy, BLE）", "B": "红外线通信（IrDA）", "C": "高速光纤通信", "D": "千兆以太网有线连接"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 短距离无线通信协议 (BLE)", "analysis": "低功耗蓝牙（BLE / Bluetooth Smart）专门为低功耗、间歇性小数据传输设计，设备在待机时处于深度休眠模式，仅在传输数据的毫秒级瞬间激活，功耗极低（微安级别），非常适合智能手环、健康监护仪、智能防丢器等可穿戴设备。"}, {"id": 44, "chapter": "第5章 物联网与其应用", "question": "在物联网轻量级通信协议中，MQTT 协议被广泛应用于传感器与云端服务器之间的低开销数据交互。MQTT 协议采用的核心架构通信模式是：", "options": {"A": "点对点对等下载模式（P2P）", "B": "发布 / 订阅模式（Publish / Subscribe）通过中介代理（Broker）进行消息分发", "C": "主从式广播全网盲发模式", "D": "轮询查询数据库死循环模式"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 物联网轻量通信协议 (MQTT)", "analysis": "MQTT 是一种基于“发布/订阅（Publish/Subscribe）”模式的超轻量级消息传输协议，由消息代理（Broker）充当中枢。传感器作为发布者（Publisher）向特定主题（Topic）发布数据，订阅了该主题的客户端（Subscriber）即可接收数据，具备极小的报文头部开销与弱网自适应能力。"}, {"id": 45, "chapter": "第5章 物联网与其应用", "question": "一个典型的智能家居闭环联动系统由感知、决策与执行三个关键部分组成。当智能客厅系统检测到“傍晚光线变暗且室内有人走动时，自动开启客厅吊灯”这一场景中，承担“执行动作”角色的设备是：", "options": {"A": "光敏传感器", "B": "人体红外感应探头（PIR）", "C": "控制吊灯通断电的智能继电器 / 智能开关", "D": "家庭无线 Wi-Fi 路由器"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 物联网执行器 (Actuator) 识别", "analysis": "传感器负责感知物理环境状态（光敏传感器与人体红外探头负责输入）；家庭网关或控制器负责逻辑决策；而真正负责将电信号转化为物理机械或电路动作（如通断电、亮灯、开窗帘、抽水）的部件是执行器（Actuator），本题中为智能继电器/智能开关。"}, {"id": 46, "chapter": "第5章 物联网与其应用", "question": "射频识别系统（RFID）能够实现非接触式自动目标识别与数据读取。一个完整的标准 RFID 系统通常必须由下列哪三大核心部分组成？", "options": {"A": "摄像头、红外补光灯、显示器", "B": "电子标签（Tag / Transponder）、读写器（Reader）以及后端数据处理计算机系统", "C": "调制解调器、电话线、打印机", "D": "麦克风、扬声器、音频声卡"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · RFID 系统三大基本组成", "analysis": "RFID 系统的三大基本组成组件：1. 电子标签（Tag，由耦合元件及微芯片组成，内置天线用于存储识别数据）；2. 读写器（Reader，用于无接触发射电磁波激活标签并读取或写入数据）；3. 数据处理计算机系统（负责接收读写器数据并执行业务管理）。"}, {"id": 47, "chapter": "第5章 物联网与其应用", "question": "在工业物联网（IIoT）与智能制造领域，工程师利用传感器收集物理实体设备的全生命周期运行参数，并在虚拟计算机软件空间中构建一个与现实实体完全镜像、1:1 实时动态映射的虚拟数字模型，用于预测设备故障和仿真优化。这一前沿技术被称为：", "options": {"A": "数字孪生（Digital Twin）", "B": "区块链（Blockchain）", "C": "比特币挖矿（Bitcoin Mining）", "D": "全息投影（Holography）"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 前沿概念 (数字孪生 Digital Twin)", "analysis": "数字孪生（Digital Twin）是充分利用物理模型、传感器更新、运行历史等数据，集成多学科、多物理量的仿真过程，在虚拟空间中完成对物理实体的映射，反映相对应实体装备的全生命周期过程，被广泛应用于智能制造、智慧风电场与跨海大桥的预测性维护。"}, {"id": 48, "chapter": "第5章 物联网与其应用", "question": "智慧医疗（Smart Healthcare）是物联网技术造福人类社会的重大应用领域。下列各项技术场景中，属于物联网在智慧医疗中典型应用的是：\nI. 医院为住院患者佩戴内置 RFID 的智能腕带，实现用药核验与病人精准身份识别\nII. 穿戴式连续血糖监测仪（CGM）实时将患者血糖数据通过蓝牙同步至医生云端工作台\nIII. 智能输液器通过液位传感器监测药水滴速，并在输液即将见底时自动给护士站发送蜂鸣报警\nIV. 利用普通文字处理软件编写一篇关于医学历史的期末论文", "options": {"A": "I、II", "B": "I、II、III", "C": "II、III、IV", "D": "I、II、III、IV"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 智慧医疗物联网典型应用", "analysis": "场景 I（RFID 医疗腕带核验身份）、II（穿戴式传感器连续生命体征监护）、III（智能输液液位感应与自动告警）均是物联网传感器与网络传输在智慧医疗中的典型成功应用；IV 属于普通的办公文字处理，不属于物联网应用范畴。"}, {"id": 49, "chapter": "第5章 物联网与其应用", "question": "随着智慧城市路灯、环境监测站以及工业机房数以万计的物联网传感器不断产生海量时间序列数据（Time Series Data），若仅由人工肉眼查看报表已无法应付。物联网与下列哪两项关键信息技术的深度融合，能够实现对海量设备运行状态的自动化异常模式识别与未来趋势预测？", "options": {"A": "大数据分析（Big Data）与人工智能（Artificial Intelligence, AI）", "B": "机械式打字机技术与缩微胶卷技术", "C": "传统手工簿记记账与电话电报网络", "D": "CRT 显示器消磁技术与软盘拷贝技术"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 物联网、大数据与人工智能的融合", "analysis": "物联网（IoT）负责全方位“数据采集与感知连接”，大数据（Big Data）负责海量时序数据的“存储与分布式处理”，而人工智能（AI）则负责从海量数据中“提取价值模型并执行智能预测”（AIoT 人工智能物联网），三者融合构成了现代智能系统的大脑与神经中枢。"}, {"id": 50, "chapter": "第5章 物联网与其应用", "question": "家用智能音箱、联网婴儿监视器以及智能门锁等消费级物联网设备在带来生活便利的同时，也带来了前所未有的隐私与信息安全隐患。从使用者防范角度出发，购买并安装新的家用物联网设备后，最关键、最应当首先执行的安全防护措施是：", "options": {"A": "长期保留厂家出厂的默认用户名与初始密码（如 admin/admin 或 123456）以防遗忘", "B": "立即更改设备的出厂默认管理密码，并及时为设备固件升级安装最新的安全补丁（Firmware Updates）", "C": "在设备上方覆盖一层厚毛巾以阻挡无线电波发射", "D": "将设备的管理后台端口直接暴露在公网且关闭所有登录验证"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 物联网设备安全防范策略", "analysis": "海量消费级物联网设备沦为黑客僵尸网络肉鸡的最主要原因，就是用户使用出厂默认弱口令（如 admin/admin）且从未更新固件。最基本且最关键的第一防线是：立即修改复杂且独特的专属管理密码，并定期检查并更新官方固件补丁以修复已知漏洞。"}];

        function renderMatrix() {
            const tbody = document.getElementById('matrixTbody');
            tbody.innerHTML = '';
            for (let r = 1; r <= 10; r++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < 5; c++) {
                    const qid = c * 10 + r;
                    const q = questions[qid - 1];
                    tr.innerHTML += `
                        <td><a href="#q-card-${qid}" style="color:#1e3a8a; text-decoration:none; font-weight:700;">第 ${qid} 题</a></td>
                        <td><span class="ans-code">${q.answer}</span></td>
                    `;
                }
                tbody.appendChild(tr);
            }
        }

        function renderQuestions(list) {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            list.forEach(q => {
                const card = document.createElement('div');
                card.className = 'q-card';
                card.id = `q-card-${q.id}`;

                let optsHtml = '';
                ['A', 'B', 'C', 'D'].forEach(opt => {
                    const isCorrect = (q.answer === opt);
                    optsHtml += `
                        <div class="opt-box ${isCorrect ? 'is-correct' : ''}">
                            <span style="font-weight:700; min-width:24px;">${opt}.</span>
                            <span>${q.options[opt]}</span>
                        </div>
                    `;
                });

                const sourceTag = q.source ? `<div class="source-tag">🎯 课本考点定位：${q.source}</div>` : '';

                card.innerHTML = `
                    <div class="q-top">
                        <div class="q-title-box">
                            <div class="q-badge-num">${q.id}</div>
                            <div>
                                <span class="q-chapter-badge">${q.chapter}</span>
                                <div class="q-stem">${q.question}</div>
                            </div>
                        </div>
                        <div class="ans-badge-right">正解：${q.answer}</div>
                    </div>
                    <div class="options-grid">${optsHtml}</div>
                    <div class="analysis-box">
                        <div class="analysis-header">
                            <span>💡 【名师解析与考点精析】</span>
                        </div>
                        <div class="analysis-text">${q.analysis}</div>
                        ${sourceTag}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterChapter(chap) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if (chap === 'ALL') {
                renderQuestions(questions);
            } else {
                renderQuestions(questions.filter(q => q.chapter.includes(chap)));
            }
        }

        renderMatrix();
        renderQuestions(questions);
    </script>
</body>
</html>
