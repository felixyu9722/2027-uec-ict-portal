<!DOCTYPE html>
<html lang="zh-MY">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中资讯科技（第二册）全册测验系统 - 教师教研总控台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #1e3a8a;
            --accent: #d97706;
            --success: #059669;
            --danger: #dc2626;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-page: #f8fafc;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 90px;
        }
        .teacher-navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(8px);
            color: #fff; border-bottom: 1px solid #334155; box-shadow: var(--shadow-md);
        }
        .nav-inner {
            max-width: 1200px; margin: 0 auto; padding: 12px 24px;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
        }
        .brand-box { display: flex; align-items: center; gap: 12px; }
        .teacher-badge {
            background: #f59e0b; color: #78350f; font-size: 0.8rem; font-weight: 800;
            padding: 4px 10px; border-radius: 6px;
        }
        .nav-title { font-size: 1.15rem; font-weight: 700; color: #f8fafc; }
        .nav-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .btn-act {
            background: #1e293b; border: 1px solid #475569; color: #f1f5f9;
            padding: 7px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
            text-decoration: none;
        }
        .btn-act:hover { background: #334155; }
        .btn-orange {
            background: linear-gradient(135deg, #d97706, #b45309); border-color: #b45309; color: #fff; font-weight: 700;
        }
        .btn-orange:hover { background: linear-gradient(135deg, #b45309, #92400e); }
        
        .main-container { max-width: 1200px; margin: 25px auto; padding: 0 20px; }

        /* 顶部套卷与快速通道横幅 */
        .quick-nav-bar {
            background: #fff; border: 1px solid var(--border); border-radius: 12px;
            padding: 16px 20px; margin-bottom: 24px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 14px; box-shadow: var(--shadow-sm);
        }
        .set-toggle-group { display: flex; gap: 8px; }
        .btn-toggle-set {
            padding: 8px 16px; border-radius: 8px; border: 1.5px solid var(--border);
            background: #f8fafc; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
            color: #475569;
        }
        .btn-toggle-set.active {
            background: #fef3c7; border-color: #f59e0b; color: #92400e; box-shadow: 0 2px 8px rgba(245, 158, 11, 0.2);
        }

        .link-teacher-answers {
            display: flex; gap: 10px;
        }
        .btn-ans-link {
            padding: 7px 14px; border-radius: 8px; background: #fff; border: 1px solid #cbd5e1;
            color: #1e3a8a; font-size: 0.85rem; font-weight: 700; text-decoration: none;
            display: flex; align-items: center; gap: 4px; transition: all 0.15s;
        }
        .btn-ans-link:hover { background: #eff6ff; border-color: #93c5fd; }

        /* 核心指标卡片 */
        .board-metrics {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px; margin-bottom: 25px;
        }
        .metric-card {
            background: #fff; border: 1px solid var(--border); border-radius: 12px;
            padding: 18px 20px; box-shadow: var(--shadow-sm);
        }
        .metric-num {
            font-size: 1.8rem; font-weight: 800; color: var(--secondary);
        }
        .metric-lbl { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; }

        /* 高频错题榜 */
        .wrong-rank-card {
            background: #fff; border: 1px solid #fed7aa; border-left: 5px solid #f97316;
            border-radius: 12px; padding: 22px 24px; box-shadow: var(--shadow-sm); margin-bottom: 25px;
        }
        .wrong-rank-title {
            font-size: 1.12rem; font-weight: 700; color: #9a3412; display: flex; align-items: center;
            gap: 8px; margin-bottom: 16px;
        }
        .wrong-items-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px;
        }
        .wrong-item {
            background: #fff7ed; border: 1px solid #ffedd5; border-radius: 8px; padding: 12px 14px;
            cursor: pointer; transition: all 0.2s;
        }
        .wrong-item:hover { background: #ffedd5; transform: translateY(-2px); }
        .wrong-item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .wrong-q-badge { font-weight: 700; font-size: 0.88rem; color: #c2410c; }
        .wrong-rate-badge { font-size: 0.78rem; font-weight: 700; background: #fee2e2; color: #991b1b; padding: 2px 8px; border-radius: 4px; }
        .wrong-q-text { font-size: 0.86rem; color: #431407; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 表格区 */
        .board-card {
            background: #fff; border: 1px solid var(--border); border-radius: 12px;
            box-shadow: var(--shadow-sm); overflow: hidden;
        }
        .board-bar {
            padding: 16px 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
        }
        .sub-table { width: 100%; border-collapse: collapse; text-align: left; }
        .sub-table th { background: #f8fafc; color: #475569; font-size: 0.82rem; font-weight: 700; padding: 12px 16px; border-bottom: 1px solid var(--border); }
        .sub-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; color: #334155; }
        .sub-table tr:hover { background: #f8fafc; }
        .score-pill {
            display: inline-block; padding: 3px 10px; border-radius: 20px; font-weight: 800; font-size: 0.85rem;
        }
        .score-pill.pass { background: #dcfce7; color: #166534; }
        .score-pill.fail { background: #fee2e2; color: #991b1b; }
        .btn-view-paper {
            background: #f1f5f9; border: 1px solid #cbd5e1; color: #1e3a8a; font-weight: 700;
            padding: 5px 12px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; transition: all 0.15s;
        }
        .btn-view-paper:hover { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }

        /* 安全门禁遮罩 (纯净输入，不显示密码) */
        #pageSecurityOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0b1329; z-index: 99999; display: flex; align-items: center;
            justify-content: center; padding: 20px;
        }

        /* 答卷抽屉 */
        .drawer-mask {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6); z-index: 9999; display: none; justify-content: flex-end;
        }
        .drawer-box {
            width: 100%; max-width: 600px; height: 100%; background: #fff; display: flex; flex-direction: column; box-shadow: -5px 0 25px rgba(0,0,0,0.3);
        }
        .drawer-head {
            padding: 16px 20px; background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: space-between;
        }
        .drawer-body { padding: 20px; overflow-y: auto; flex: 1; }
    </style>
</head>
<body>

    <!-- 教师安全门禁 (前端绝不显示密码) -->
    <div id="pageSecurityOverlay">
        <div style="background:#1e293b; border:1px solid #334155; border-radius:18px; padding:36px; max-width:440px; width:100%; text-align:center; box-shadow:0 25px 50px rgba(0,0,0,0.6); color:#fff;">
            <div style="width:60px; height:60px; border-radius:50%; background:rgba(245,158,11,0.15); border:1px solid rgba(245,158,11,0.3); display:flex; align-items:center; justify-content:center; font-size:1.8rem; margin:0 auto 16px auto; color:#f59e0b;">🔒</div>
            <h2 style="font-size:1.35rem; margin-bottom:8px; font-weight:700;">教师专属教研总控台</h2>
            <p style="color:#94a3b8; font-size:0.9rem; margin-bottom:24px; line-height:1.5;">请输入教师安全访问密钥以解锁查看学生答卷与教研数据：</p>
            <input type="password" id="gatePwdInput" placeholder="••••••••" maxlength="20" style="width:100%; padding:12px 16px; background:#0f172a; border:1px solid #475569; border-radius:10px; color:#fff; font-size:1.2rem; letter-spacing:4px; text-align:center; outline:none; margin-bottom:10px;">
            <div id="gateErrMsg" style="color:#f87171; font-size:0.85rem; display:none; margin-bottom:12px;">⚠️ 密码不正确，无权查阅</div>
            <div style="display:flex; gap:10px; margin-top:14px;">
                <a href="index.html" style="flex:1; padding:11px; border-radius:10px; background:#334155; color:#cbd5e1; text-decoration:none; font-size:0.9rem; font-weight:600; display:flex; align-items:center; justify-content:center;">返回门户</a>
                <button onclick="checkPageSecurity()" style="flex:1; padding:11px; border-radius:10px; background:linear-gradient(135deg, #d97706, #b45309); border:none; color:#fff; font-size:0.95rem; font-weight:700; cursor:pointer;">解锁专区</button>
            </div>
        </div>
    </div>

    <!-- 顶部导航 -->
    <header class="teacher-navbar">
        <div class="nav-inner">
            <div class="brand-box">
                <span class="teacher-badge">教研总控台</span>
                <span class="nav-title">高中资讯科技（第二册）教师数据中心</span>
            </div>
            <div class="nav-actions">
                <a href="index.html" class="btn-act btn-orange">🏠 返回测验门户</a>
                <button class="btn-act" onclick="fetchSubmissionsFromSupabase()">🔄 刷新云端答卷</button>
                <button class="btn-act" onclick="lockPage()" style="background:#7f1d1d; border-color:#991b1b; color:#fee2e2;">🚪 退出锁定</button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- 快速通道与套卷切换横幅 -->
        <div class="quick-nav-bar">
            <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                <span style="font-weight:700; font-size:0.92rem; color:#1e293b;">📋 当前查看套卷：</span>
                <div class="set-toggle-group">
                    <button class="btn-toggle-set active" id="btnToggleSet1" onclick="switchDashboardSet(1)">第一套题目（50题）</button>
                    <button class="btn-toggle-set" id="btnToggleSet2" onclick="switchDashboardSet(2)">第二套题目（50题）</button>
                </div>
            </div>
            <div class="link-teacher-answers">
                <a href="teacher_answers.html" class="btn-ans-link">📖 第一套教师答案与精析</a>
                <a href="teacher_answers_set2.html" class="btn-ans-link">📖 第二套教师答案与精析</a>
            </div>
        </div>

        <!-- 核心数据看板卡片 -->
        <div class="board-metrics">
            <div class="metric-card">
                <div class="metric-num" id="metricTotalSubmissions">0</div>
                <div class="metric-lbl">已交卷学生总数</div>
            </div>
            <div class="metric-card">
                <div class="metric-num" id="metricAvgScore">0.0</div>
                <div class="metric-lbl">全班平均分 (满分100)</div>
            </div>
            <div class="metric-card">
                <div class="metric-num" style="color:#059669;" id="metricPassRate">0%</div>
                <div class="metric-lbl">测验及格率 (≥60分)</div>
            </div>
            <div class="metric-card">
                <div class="metric-num" style="color:#d97706;" id="metricMaxScore">0</div>
                <div class="metric-lbl">全场最高分</div>
            </div>
        </div>

        <!-- 高频错题榜 -->
        <div class="wrong-rank-card" id="wrongRankCard" style="display:none;">
            <div class="wrong-rank-title">
                <span>🔥 <span id="labelWrongSet">第一套</span> 高频错题排行榜（错误率前 5 名 · 建议重点讲评）</span>
            </div>
            <div class="wrong-items-grid" id="wrongItemsGrid"></div>
        </div>

        <!-- 学生提交数据列表 -->
        <div class="board-card">
            <div class="board-bar">
                <h3 style="font-size:1.1rem; color:var(--secondary);">📋 学生提交明细表 (<span id="submissionsCountBadge">0</span> 份)</h3>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <input type="text" id="filterStudentInput" placeholder="搜索姓名 / 学号 / 班级..." oninput="filterStudentsTable()" style="padding:6px 12px; border:1px solid #cbd5e1; border-radius:6px; font-size:0.85rem; outline:none;">
                    <button class="btn-act" style="background:#f1f5f9; color:#334155; border-color:#cbd5e1;" onclick="exportToCSV()">📥 导出 Excel (CSV)</button>
                </div>
            </div>

            <div style="overflow-x:auto;">
                <table class="sub-table" id="submissionsTable">
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>姓名</th>
                            <th>班级</th>
                            <th>学号</th>
                            <th>得分</th>
                            <th>作答用时</th>
                            <th>交卷时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="submissionsTableBody">
                        <tr><td colspan="8" style="text-align:center; color:#94a3b8; padding:35px;">正在连接 Supabase 加载学生提交记录...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 答卷抽屉 -->
    <div class="drawer-mask" id="studentDrawer">
        <div class="drawer-box">
            <div class="drawer-head">
                <div>
                    <h3 style="font-size:1.15rem;" id="drawerStudentName">学生答卷调阅</h3>
                    <div style="font-size:0.8rem; color:#94a3b8;" id="drawerStudentMeta">--</div>
                </div>
                <button onclick="closeStudentDrawer()" style="background:none; border:none; color:#fff; font-size:1.4rem; cursor:pointer;">✕</button>
            </div>
            <div class="drawer-body" id="drawerQuestionsContent"></div>
        </div>
    </div>

    <script>
        const questions_set1 = [{"id": 1, "chapter": "第1章 资讯系统", "question": "在系统规划与初步调查阶段，系统分析员必须进行可行性分析（Feasibility Study）。若重点评估“组织现有的预算资金是否足以支持新系统的开发与软硬件采购，以及未来能否带来预期的经济回报”，这属于下列哪一种可行性评估？", "options": {"A": "技术可行性（Technical Feasibility）", "B": "经济可行性（Economic Feasibility）", "C": "操作可行性（Operational Feasibility）", "D": "法律可行性（Legal Feasibility）"}, "answer": "B", "analysis": "经济可行性（Economic Feasibility）的核心评估目标是成本效益分析（Cost-Benefit Analysis），衡量项目所需的软硬件投资、人员培训等成本与预期带来的收益（ROI），确保预算在组织可承受范围内。技术可行性关注现有软硬件与团队技能是否达标；操作可行性关注用户是否愿用、能用；法律可行性关注法律合规。"}, {"id": 2, "chapter": "第1章 资讯系统", "question": "在现代企业资讯系统的开发团队中，主要负责规划数据库结构、管理数据存储效率、设定数据安全权限，并确保数据完整性与日常备份的技术人员是：", "options": {"A": "系统分析员（System Analyst）", "B": "程式编写员（Programmer）", "C": "数据库管理员（Database Administrator, DBA）", "D": "网络管理员（Network Administrator）"}, "answer": "C", "analysis": "数据库管理员（DBA）专门负责企业数据库的设计实现、性能调优、权限安全管理、完整性约束维护与备份容灾；系统分析员负责需求调研与系统架构设计；程式编写员负责编写具体功能代码；网络管理员负责网络基础设施的通畅与安全。"}, {"id": 3, "chapter": "第1章 资讯系统", "question": "在结构化系统分析与设计方法中，数据流程图（Data Flow Diagram, DFD）用于描绘系统内数据的流动与处理过程。在 DFD 标准图形符号中，用“两条平行的水平横线（或一侧开口的矩形）”表示的元素是：", "options": {"A": "外部实体（External Entity）", "B": "处理过程 / 程序（Process）", "C": "数据流（Data Flow）", "D": "数据存储（Data Store）"}, "answer": "D", "analysis": "在 Gane-Sarson 或 Yourdon 规范的 DFD 中，平行双横线（或右侧开口矩形）代表数据存储（Data Store，如数据库表格或档案）；圆形或圆角矩形代表处理程序（Process）；带箭头的直线代表数据流（Data Flow）；正方形或实体矩形代表外部实体（External Entity）。"}, {"id": 4, "chapter": "第1章 资讯系统", "question": "连锁超市收银台的 POS 系统在顾客结账时，扫描条形码读取单价、计算总金额并自动扣减库存记录。这类主要用于记录、处理日常基层例行业务交易的资讯系统属于：", "options": {"A": "交易处理系统（Transaction Processing System, TPS）", "B": "管理资讯系统（Management Information System, MIS）", "C": "决策支援系统（Decision Support System, DSS）", "D": "高阶主管资讯系统（Executive Information System, EIS）"}, "answer": "A", "analysis": "交易处理系统（TPS）位于企业资讯金字塔的最底层，专门负责高速、准确地记录和处理每日大量的日常营运事务交易（如超市 POS 收银、银行 ATM 取款、航空订票等）。MIS 负责生成总结性定期报表；DSS 辅助中层管理进行半结构化决策；EIS 供高层进行战略分析。"}, {"id": 5, "chapter": "第1章 资讯系统", "question": "某大型连锁书局准备全面上线一套崭新的会员积分管理系统。为了降低系统故障对全马业务的冲击，总管理处决定先在吉隆坡旗舰店试运行一个月，待系统各项功能成熟稳定且修复所有隐患后，再全面推广到全马其余 50 家分店。这种系统转换策略称为：", "options": {"A": "直接转换（Direct Conversion）", "B": "并行转换（Parallel Conversion）", "C": "试点转换（Pilot Conversion）", "D": "分段转换（Phased Conversion）"}, "answer": "C", "analysis": "试点转换（Pilot Conversion）是指先在组织的一个特定部门、单一地点或分支机构完整安装运行新系统，经实践检验成功后再推广到整个组织。直接转换是立即全面停用旧系统切换新系统；并行转换是全组织新旧系统同时运行；分段转换是按功能模块逐步分批替换。"}, {"id": 6, "chapter": "第1章 资讯系统", "question": "在系统开发生命周期（SDLC）的系统实现与测试阶段，关于各项测试工作的内容，下列叙述哪些是正确的？\nI. 单元测试（Unit Testing）针对各个独立的函数或代码模块进行逻辑检验\nII. 整合测试（Integration Testing）检验各模块组合连接后数据接口能否正常协同工作\nIII. 验收测试（Acceptance Testing）由最终使用者或客户参与，检验系统是否满足实际业务需求\nIV. 回归测试（Regression Testing）必须在旧系统被永久销毁后才能开始进行", "options": {"A": "I、II", "B": "I、II、III", "C": "II、III、IV", "D": "I、II、III、IV"}, "answer": "B", "analysis": "叙述 I、II、III 正确。叙述 IV 错误：回归测试（Regression Testing）是指在修改代码或修复已知 Bug 后重新运行测试，以确认修改没有破坏系统中现有的其他正常功能，与“旧系统销毁”无关。"}, {"id": 7, "chapter": "第1章 资讯系统", "question": "系统分析员在进行结构化系统分析时，通常会编写一份“数据字典”（Data Dictionary）。数据字典在系统分析中的核心作用是：", "options": {"A": "记录程序员每天编写代码的行数与出勤记录", "B": "详细定义和记录数据流程图中每个数据项、数据流及数据存储的结构与含义", "C": "作为向用户展示系统操作按钮排版的图形化线框图", "D": "自动将系统的英文错误提示信息翻译为多国语言"}, "answer": "B", "analysis": "数据字典（Data Dictionary）是系统分析的重要工具，它对数据流程图（DFD）中出现的所有数据元素、数据结构、数据流、数据存储进行精确、集中的定义与描述，消除开发团队中关于数据命名的二义性。"}, {"id": 8, "chapter": "第1章 资讯系统", "question": "由于马来西亚政府调整了销售与服务税（SST）的税率，某学院财务处要求技术部门修改财务系统中的自动算税算法以遵循最新税法法规。这种系统维护类型属于：", "options": {"A": "纠正性维护（Corrective Maintenance）", "B": "适应性维护（Adaptive Maintenance）", "C": "完善性维护（Perfective Maintenance）", "D": "预防性维护（Preventive Maintenance）"}, "answer": "B", "analysis": "适应性维护（Adaptive Maintenance）是指为了使系统适应外部环境的变化（如国家新税法出台、法律法规变更、操作系统升级或硬件更替）而对系统进行的修改。纠正性维护是修补程序原本运行中的错误 Bug；完善性维护是增加新功能或提升性能；预防性维护是防患于未然。"}, {"id": 9, "chapter": "第1章 资讯系统", "question": "将制造企业的生产管理、物料采购、库存仓储、财务会计、人力资源及销售订单等不同部门的业务流程全面整合进同一个集中数据库，消除信息孤岛的企业级核心系统是：", "options": {"A": "企业资源规划系统（Enterprise Resource Planning, ERP）", "B": "客户关系管理系统（Customer Relationship Management, CRM）", "C": "供应链管理系统（Supply Chain Management, SCM）", "D": "办公自动化系统（Office Automation System, OAS）"}, "answer": "A", "analysis": "企业资源规划系统（ERP）强调企业内部全方位业务流程的一体化整合，通过统一的数据架构实现财务、采购、生产、销售等跨部门数据的实时流动与协同；CRM 侧重客户生命周期与营销；SCM 侧重供应链上下游协调；OAS 侧重日常公文与协同办公。"}, {"id": 10, "chapter": "第1章 资讯系统", "question": "在系统开发过程中，若最终使用者在立项初期无法清晰表达自己的具体功能需求，开发团队先快速构建出一个具备基本界面与操作交互的简易模型供使用者体验，并根据使用者反馈迭代修改。这种系统开发方法被称为：", "options": {"A": "瀑布模型（Waterfall Model）", "B": "原型法（Prototyping）", "C": "结构化分析法（Structured Analysis）", "D": "甘特进度法（Gantt Scheduling）"}, "answer": "B", "analysis": "原型法（Prototyping）的核心理念是通过快速构建“工作原型”（Prototype），让使用者在直观使用中逐步明确、细化真实需求，减少因初期需求理解偏差而导致开发失败的风险，非常适合需求模糊或易变的项目。瀑布模型则强调阶段严格线性推进。"}, {"id": 11, "chapter": "第2章 网络类型与传输质量", "question": "某商业银行将分布在吉隆坡市区内的 20 间分行营业厅，通过城域级高速光纤专网互联为一个专属网络，该网络覆盖范围通常在数十公里以内。按照计算机网络的地理覆盖范围分类，该网络属于：", "options": {"A": "个人区域网（PAN）", "B": "局域网（LAN）", "C": "城域网（MAN）", "D": "广域网（WAN）"}, "answer": "C", "analysis": "城域网（Metropolitan Area Network, MAN）的覆盖范围通常为一个城市或大都市圈（通常几公里到数十公里），用于连接同一城市内不同地点的机构或企业分支；PAN 覆盖数米（个人空间）；LAN 覆盖一间办公室或单座建筑物；WAN 覆盖跨州、跨国乃至全球。"}, {"id": 12, "chapter": "第2章 网络类型与传输质量", "question": "现代独中电脑室普遍采用“星状拓扑结构”（Star Topology）来连接所有学生电脑。相较于早期的汇流排拓扑（Bus Topology），星状拓扑最显著的运行优势是：", "options": {"A": "不需要消耗任何网络线缆，安装成本在所有拓扑中最为低廉", "B": "任意一台单机或单条网线发生损坏断路，不会导致网络中其他电脑瘫痪", "C": "即使中央集线设备（交换机）发生硬件短路，全网通信也不会受到任何影响", "D": "数据在主干线路上单向循环流动，完全不需要任何地址寻址机制"}, "answer": "B", "analysis": "星状拓扑中所有节点独立连接到中央设备（交换机）。当某台电脑的网线断开或网卡损坏时，仅该节点掉线，其余所有节点完全正常工作，且故障排查极其直观；其缺点是中央交换机是单点故障（Single Point of Failure）。汇流排拓扑干线中断会导致全网瘫痪。"}, {"id": 13, "chapter": "第2章 网络类型与传输质量", "question": "在工业厂房或大型配电室等强电磁干扰环境下布设网络线缆时，为了防止外部电动机、变压器产生的强杂散电磁波穿透线缆造成严重数据误码，最应选用的双绞线类型是：", "options": {"A": "非屏蔽双绞线（UTP）", "B": "屏蔽双绞线（STP）", "C": "细同轴电缆（10Base2）", "D": "无护套双绞线（PVC Pair）"}, "answer": "B", "analysis": "屏蔽双绞线（Shielded Twisted Pair, STP）在线对外部包裹了金属铝箔或编织铜网屏蔽层，具有极高的抗外界电磁干扰（EMI）与射频干扰（RFI）能力，非常适合强电工业环境；普通办公室通常使用成本较低的非屏蔽双绞线（UTP）。"}, {"id": 14, "chapter": "第2章 网络类型与传输质量", "question": "关于光纤传输介质中“单模光纤”（Single-mode Fiber）与“多模光纤”（Multi-mode Fiber）的特性比较，下列叙述哪些是正确的？\nI. 单模光纤的纤芯直径（约 9 微米）比多模光纤（50~62.5 微米）细得多\nII. 单模光纤通常使用高指向性激光器（Laser）作为发光源\nIII. 多模光纤内部存在光的多路径反射，模间色散较大，通常用于短距离建筑物内部局域网\nIV. 多模光纤的信号衰减远小于单模光纤，因此跨洋海底光缆全部采用多模光纤", "options": {"A": "I、II", "B": "I、II、III", "C": "II、III、IV", "D": "I、II、III、IV"}, "answer": "B", "analysis": "叙述 I、II、III 正确。叙述 IV 错误：海底光缆与跨省骨干网几乎全部采用“单模光纤”，因为单模光纤光线沿单一路径传播、无模间色散、衰减极小，支持数百公里的长距离超高速传输；多模光纤衰减和色散较大，距离受限。"}, {"id": 15, "chapter": "第2章 网络类型与传输质量", "question": "电视机遥控器在操作时，必须正对着电视机的受光窗口才能换台；若有人或厚书本挡在遥控器前方，电视机便无法响应。这说明该遥控器使用的是哪种无线传输介质？", "options": {"A": "红外线（Infrared）", "B": "蓝牙（Bluetooth）", "C": "Wi-Fi 无线局域网（2.4GHz）", "D": "超高频微波（Microwave）"}, "answer": "A", "analysis": "红外线（Infrared）的波长介于微波与可见光之间，具有严格的“视距传输”（Line of Sight）特性，无法穿透不透明实体障碍物（如墙壁、书本），且传输距离通常在 10 米以内；蓝牙和 Wi-Fi 采用射频电波，具有较好的绕射与穿透墙壁能力。"}, {"id": 16, "chapter": "第2章 网络类型与传输质量", "question": "交警在执勤时使用传统手持无线对讲机进行联络，通话时必须按住“PTT 通话键”说话，松开按键后才能收听对方声音，双方不能在同一时刻同时向对方说话。这种通信方向方式属于：", "options": {"A": "单工（Simplex）", "B": "半双工（Half-Duplex）", "C": "全双工（Full-Duplex）", "D": "复用工（Multiplex）"}, "answer": "B", "analysis": "半双工（Half-Duplex）允许数据在两个方向上传输，但在同一特定时刻只能由一方发送、另一方接收（如对讲机、传统集线器连接的局域网）；单工（Simplex）只能单向流动（如无线电广播）；全双工（Full-Duplex）允许双方同时收发（如手机通话、现代交换机双全工链路）。"}, {"id": 17, "chapter": "第2章 网络类型与传输质量", "question": "学生在家里玩即时对战网络游戏时，画面突然出现角色移动迟滞、点击技能后延迟 1 秒才有反应，甚至发生角色在地图上瞬间跳跃的现象。网络诊断显示宽带下载速率充足，但 Ping 值高达 350 ms 且伴随偶发丢包。导致该体验急剧恶化的主要网络性能指标是：", "options": {"A": "频宽不足（Insufficient Bandwidth）", "B": "高延迟（High Latency）与网络抖动（Jitter）", "C": "电缆阻抗过大（High Cable Impedance）", "D": "调制解调器发热量过高（Overheating）"}, "answer": "B", "analysis": "网络游戏的即时交互对“延迟（Latency）”和“抖动（Jitter，延迟的波动程度）”极其敏感。虽然游戏传输的数据包体积很小（对带宽要求不高），但高延迟与抖动会导致操作指令无法按时到达服务器，造成卡顿、瞬移和技能响应迟滞。"}, {"id": 18, "chapter": "第2章 网络类型与传输质量", "question": "电信号或光脉冲信号在物理传输线缆中长距离传播时，随着传播距离的延伸，信号的幅值会自然逐渐减弱并发生波形失真。网络工程中将这一物理损耗现象称为：", "options": {"A": "串扰（Crosstalk）", "B": "衰减（Attenuation）", "C": "色散（Dispersion）", "D": "反射（Reflection）"}, "answer": "B", "analysis": "信号在传输介质中传播时能量随距离衰减变弱的现象称为“衰减”（Attenuation）。为了克服衰减，网络在超出规定距离（如双绞线 100 米限制）时需要添加中继器（Repeater）或放大器（Amplifier）来重整与放大信号。"}, {"id": 19, "chapter": "第2章 网络类型与传输质量", "question": "国家级金融清算系统在设计骨干通讯网时，要求具备极高的容错可靠性（Fault Tolerance）。即使任意一条光缆因施工被挖断，数据包仍可立刻通过其他备用路径自动绕行，确保业务秒级不中断。这类系统最理想的网络拓扑架构是：", "options": {"A": "星状拓扑（Star Topology）", "B": "汇流排拓扑（Bus Topology）", "C": "网状拓扑（Mesh Topology）", "D": "环状拓扑（Ring Topology）"}, "answer": "C", "analysis": "网状拓扑（Mesh Topology）中各个核心节点之间存在多条冗余物理链路互联。其最大优势是具备极高的容错性与多路径冗余能力，某条链路断开完全不影响其他链路寻径，非常适合电信骨干网和核心金融系统；缺点是布线与端口成本高。"}, {"id": 20, "chapter": "第2章 网络类型与传输质量", "question": "关于网络性能指标中“频宽”（Bandwidth）与“吞吐量”（Throughput）的核心概念区别，下列描述最准确的是：", "options": {"A": "频宽指单位时间内实际成功传输的数据量，吞吐量指信道的理论物理上限", "B": "频宽指信道理论上单位时间能承载的最大数据传输能力，吞吐量指实际测得的有效数据传输速率", "C": "频宽只用于衡量无线网络，吞吐量只用于衡量有线光纤网络", "D": "频宽的计量单位是 Byte/s，吞吐量的计量单位是 bit/s"}, "answer": "B", "analysis": "频宽（Bandwidth）好比公路理论上的最大车道容量（理论最大传输速率，如 100 Mbps）；吞吐量（Throughput）则是特定时间内实际在公路上顺利通过的实际车流量（扣除网络拥塞、协议开销、重传后的实际传输速率）。吞吐量始终小于或等于理论频宽。"}, {"id": 21, "chapter": "第3章 网络通讯与作业系统", "question": "在国际标准化组织制定的 OSI 七层参考模型中，负责为不同网络之间的数据包进行逻辑寻址（IP 寻址）并选择最佳传输路径（路由选择，Routing）的是：", "options": {"A": "物理层（Physical Layer）", "B": "数据链路层（Data Link Layer）", "C": "网络层（Network Layer）", "D": "传输层（Transport Layer）"}, "answer": "C", "analysis": "网络层（Network Layer，OSI 第 3 层）的核心职责是逻辑寻址（Logical Addressing，如 IP 地址）和路由选择（Routing），决定数据包从源端到目的端经过哪些路由器网络；数据链路层负责 MAC 地址和帧同步；传输层负责端到端进程通信（端口与可靠性）。"}, {"id": 22, "chapter": "第3章 网络通讯与作业系统", "question": "我们在浏览器地址栏输入易记的网站域名（例如 www.dongzong.my）时，负责将该域名解析查询并转换为计算机网络通信所需的实际 IP 地址的协议是：", "options": {"A": "超文本传输协议（HTTP）", "B": "域名系统（DNS）", "C": "动态主机配置协议（DHCP）", "D": "文件传输协议（FTP）"}, "answer": "B", "analysis": "域名系统（Domain Name System, DNS）充当互联网的“电话簿”，主要功能是将人类易于记忆的字符域名（如 www.dongzong.my）翻译转换为机器互相通信识别的 IP 地址（如 203.106.x.x）。"}, {"id": 23, "chapter": "第3章 网络通讯与作业系统", "question": "在 TCP/IP 体系的传输层中，TCP 协议与 UDP 协议具有截然不同的通信机制。下列关于两者的对比，哪一项描述是正确的？", "options": {"A": "TCP 是无连接协议，传输速度极快且不保证数据按序送达", "B": "UDP 建立通信前必须进行三次握手，具备严格的丢包重传确认机制", "C": "TCP 提供面向连接的可靠数据传输服务，适合网页浏览（HTTP）与文件下载", "D": "UDP 由于可靠性差，因此在网络流媒体广播与在线多人语音中已被完全弃用"}, "answer": "C", "analysis": "TCP 是面向连接的可靠协议，通过三次握手、序号确认、流量控制和重传机制确保数据 100% 准确到达，适用于 HTTP/HTTPS、FTP、SMTP 等；UDP 是无连接不可靠协议，开销极小且延迟极低，非常适合对实时性要求高但允许轻微丢包的场景（如视频直播、语音对讲、DNS 查询）。"}, {"id": 24, "chapter": "第3章 网络通讯与作业系统", "question": "互联网工程任务组（IETF）在 IPv4 协议中保留了部分 IP 地址范围专门用于组织局域网内部通信（私有 IP 地址），这些地址不会在公共互联网上被直接路由。下列属于标准私有 IP 地址的是：", "options": {"A": "8.8.8.8", "B": "192.168.10.25", "C": "115.132.88.2", "D": "202.188.0.133"}, "answer": "B", "analysis": "根据 RFC 1918 规范，三大类私有 IPv4 地址范围是：A 类 10.0.0.0 ~ 10.255.255.255；B 类 172.16.0.0 ~ 172.31.255.255；C 类 192.168.0.0 ~ 192.168.255.255。因此 192.168.10.25 是私有 IP。选项 A（Google 公共 DNS）及选项 C、D 均为公网 IP。"}, {"id": 25, "chapter": "第3章 网络通讯与作业系统", "question": "某台电脑配置的 IP 地址为 192.168.1.88，子网掩码（Subnet Mask）设置为 255.255.255.0。子网掩码在网络寻址中的核心作用是：", "options": {"A": "自动将电脑的私有 IP 转换为公网真实 IP 地址", "B": "区分 IP 地址中哪部分代表“网络识别码”（Network ID），哪部分代表“主机识别码”（Host ID）", "C": "为局域网内的电脑分配唯一的 48 位硬件 MAC 地址", "D": "记录并缓存电脑访问过的网页图片与历史记录"}, "answer": "B", "analysis": "子网掩码（Subnet Mask）是一串与 IP 地址长度相同的二进制掩码（全1部分对应网络位，全0部分对应主机位），其核心作用是通过与运算将 IP 地址明确区分为“网络位（Network ID）”和“主机位（Host ID）”，用于判断目标主机是否在同一局域网内。"}, {"id": 26, "chapter": "第3章 网络通讯与作业系统", "question": "为了彻底解决 IPv4 地址枯竭的危机，新一代网际协议 IPv6 获得了广泛应用。关于 IPv6 的格式与特性，下列叙述正确的是：", "options": {"A": "IPv6 地址长度为 64 位元，采用点分十进制表示法", "B": "IPv6 地址长度为 128 位元，通常采用冒号十六进制表示法", "C": "IPv6 地址中连续的“0”区块可以用双冒号“::”无限制多次压缩省略", "D": "IPv6 的总地址空间仅比 IPv4 增加了 4 倍"}, "answer": "B", "analysis": "IPv6 地址长度为 128 位（Bits），通常以 8 组由冒号分隔的十六进制数字表示（如 2001:0db8:85a3::8a2e:0370:7334）；地址中连续的全零区块可用“::”压缩，但为了保证反解唯一性，双冒号“::”在一个 IPv6 地址中只能出现一次！其地址总量为 2^128，极其浩瀚。"}, {"id": 27, "chapter": "第3章 网络通讯与作业系统", "question": "局域网交换机（Switch）工作在 OSI 参考模型的数据链路层。交换机之所以能够比传统集线器（Hub）提供显著更高的数据转发性能与安全性，核心机制在于：", "options": {"A": "交换机会自动为每个数据包重新计算加密哈希摘要", "B": "交换机能够自主学习并维护 MAC 地址表，仅将数据定向单播转发至目标端口", "C": "交换机可以将模拟信号调制成可在电话线上传输的高频数字脉冲", "D": "交换机能够自动分配全球公网 IP 地址"}, "answer": "B", "analysis": "集线器（Hub）是物理层共享设备，收到数据后向所有端口广播盲发，冲突严重且不安全；交换机（Switch）是数据链路层设备，通过学习数据帧的源 MAC 地址建立 MAC 地址表，根据目标 MAC 地址进行独享带宽的单播精准转发，有效隔离冲突域。"}, {"id": 28, "chapter": "第3章 网络通讯与作业系统", "question": "在计算机网络中，用于连接不同网段或不同网络（例如将独中校园局域网连接至电信运营商的互联网），并根据 IP 路由表决定数据包最佳转发路径的核心网络设备是：", "options": {"A": "网卡（NIC）", "B": "调制解调器（Modem）", "C": "网络路由器（Router）", "D": "中继器（Repeater）"}, "answer": "C", "analysis": "路由器（Router）工作在网络层，其主要职责是连接两个或多个不同的逻辑网络（跨网互联），维护路由表并根据最佳算法（如最短路径）执行数据包的路由转发与广播域隔离。"}, {"id": 29, "chapter": "第3章 网络通讯与作业系统", "question": "网络操作系统（Network Operating System, NOS，如 Windows Server、Linux Server）是管理网络资源的中枢软件。下列哪些属于 NOS 的核心特性与功能？\nI. 集中管理网络中所有使用者的账号、访问组及资源安全策略\nII. 具备高效稳定的多用户、多任务并发管理与网络服务处理能力\nIII. 内置提供 DNS、DHCP、Web、文件与打印共享等服务器角色支持\nIV. 只能在特定的巨型超级计算机硬件上安装，无法兼容普通服务器架构", "options": {"A": "I、II", "B": "I、II、III", "C": "II、III、IV", "D": "I、II、III、IV"}, "answer": "B", "analysis": "叙述 I、II、III 正确。叙述 IV 错误：现代网络操作系统（NOS）广泛支持标准的 x86_64 服务器硬件与普通 PC 架构，并非只能运行在超级计算机上。"}, {"id": 30, "chapter": "第3章 网络通讯与作业系统", "question": "学生携带笔记本电脑走进学校图书馆，连接校内无线 Wi-Fi 信号后，无需手动配置复杂的 IP 地址、网关和 DNS，几秒钟后便能直接上网。这是因为图书馆网络中的服务器运行了哪种网络服务协议为其自动分配参数？", "options": {"A": "简单邮件传输协议（SMTP）", "B": "动态主机配置协议（DHCP）", "C": "地址解析协议（ARP）", "D": "简单网络管理协议（SNMP）"}, "answer": "B", "analysis": "动态主机配置协议（Dynamic Host Configuration Protocol, DHCP）的作用是集中管理并在客户端接入网络时，自动动态为其分配 IP 地址、子网掩码、预设网关（Default Gateway）及 DNS 服务器地址，免除人工逐机配置的繁琐与 IP 冲突问题。"}, {"id": 31, "chapter": "第4章 网络安全与网络资源分享", "question": "一种表面上伪装成无害或实用软件（如游戏外挂修改器或办公辅助插件），一旦被用户下载安装并执行后，便会在后台悄悄开启后门端口，允许远程黑客窃取资料或控制该电脑的恶意软件属于：", "options": {"A": "计算机病毒（Virus）", "B": "计算机蠕虫（Worm）", "C": "特洛伊木马（Trojan Horse）", "D": "逻辑炸弹（Logic Bomb）"}, "answer": "C", "analysis": "特洛伊木马（Trojan Horse）借用了特洛伊木马屠城的典故，其核心特征是“伪装欺骗”，表面看似有用，后台暗藏破坏性或远程控制后门代码。与病毒不同，木马通常不具备主动感染其他宿主文件的自我复制能力。"}, {"id": 32, "chapter": "第4章 网络安全与网络资源分享", "question": "某公司会计电脑不慎点击运行了一封不明邮件附件，导致电脑内所有的重要 Excel 报表和财务凭证被强行加密，后缀名被篡改且无法打开。屏幕弹出醒目倒计时窗口，威胁受害者必须在指定时间内支付比特币赎金才能获得解密密钥。这种恶意软件是：", "options": {"A": "间谍软件（Spyware）", "B": "勒索软件（Ransomware）", "C": "广告软件（Adware）", "D": "嗅探器（Sniffer）"}, "answer": "B", "analysis": "勒索软件（Ransomware）是一种极具破坏性的恶意软件，它利用高强度非对称加密算法将受害者的重要个人文件锁死，以此勒索金钱或虚拟货币（如比特币），防范此类攻击最有效的防线是定期执行冷备份与离线备份。"}, {"id": 33, "chapter": "第4章 网络安全与网络资源分享", "question": "小明收到一封自称来自银行官方的紧急安全警告邮件，称其网银密码存在被盗风险，要求小明点击邮件中的超链接立即登录并验证密码。小明点击后打开了一个与银行官网几乎一模一样的仿冒登录界面。这种诱骗用户泄露机密凭证的黑客攻击手段被称为：", "options": {"A": "网络钓鱼（Phishing）", "B": "中间人攻击（Man-in-the-Middle）", "C": "跨站脚本攻击（XSS）", "D": "缓冲区溢出（Buffer Overflow）"}, "answer": "A", "analysis": "网络钓鱼（Phishing）属于典型的社会工程学攻击，黑客通过伪造电子邮件、短信或山寨仿冒网页，诱导受害者主动输入敏感密码、信用卡号或身份认证信息。"}, {"id": 34, "chapter": "第4章 网络安全与网络资源分享", "question": "在现代网络安全与密码学应用中，“数字签名”（Digital Signature）用于验证消息的完整性并确认发送者的真实身份。发送方在生成数字签名时，必须使用下列哪一把密钥对消息的哈希摘要进行加密？", "options": {"A": "发送方自己的公钥（Public Key）", "B": "发送方自己的私钥（Private Key）", "C": "接收方的公钥（Public Key）", "D": "接收方的私钥（Private Key）"}, "answer": "B", "analysis": "在数字签名机制中，发送方用自己的“私钥（Private Key）”对数据摘要进行加密生成签名。因为私钥只有发送方一人持有，任何人用发送方的公钥解密成功即可证明该文件确实出自该发送方且未被篡改，实现“不可抵赖性（Non-repudiation）”与“完整性”。"}, {"id": 35, "chapter": "第4章 网络安全与网络资源分享", "question": "我们在使用浏览器访问网银系统时，地址栏显示为安全协议 `https://` 并带有绿色或灰色小锁图标。这表明该网站已向具有国际公信力的权威机构申请并部署了数字证书。该权威证书签发机构被称为：", "options": {"A": "互联网域名管理机构（ICANN）", "B": "电子证书认证中心 / 凭证认证机构（Certificate Authority, CA）", "C": "电气与电子工程师协会（IEEE）", "D": "网络服务供应商（ISP）"}, "answer": "B", "analysis": "证书认证机构（Certificate Authority, CA）是负责颁发、管理和吊销数字证书的第三方受信任权威机构。CA 负责核验申请者的真实身份，并将申请者的公钥与组织信息绑定并签名，确保 HTTPS 传输的安全与身份真实性。"}, {"id": 36, "chapter": "第4章 网络安全与网络资源分享", "question": "校园网或企业网在接入互联网的入口处通常会安装配置硬件“防火墙”（Firewall）。关于防火墙的核心安全防护功能，下列叙述最准确的是：", "options": {"A": "自动清除进入内网电脑硬盘中的所有垃圾缓存与重复文件", "B": "根据预先设定的安全过滤规则，检查进出网络的数据包，阻止未经授权的外部非法访问", "C": "完全替代杀毒软件，对所有经过的网络流量实现 100% 查杀未知木马", "D": "在服务器机房发生物理火灾时自动喷洒惰性气体进行灭火"}, "answer": "B", "analysis": "网络防火墙（Firewall）部署在不同信任级别的网络边界（如内网与互联网之间），其主要功能是依据安全规则对出入网络的数据包进行严格检查（包括源/目的 IP、端口、连接状态等），阻隔非授权访问与恶意扫描，但它不能完全替代端点防病毒软件。"}, {"id": 37, "chapter": "第4章 网络安全与网络资源分享", "question": "现代各大互联网平台普遍强制启用“多因素验证”（Multi-Factor Authentication, MFA / 2FA）以大幅提升账户安全性。下列哪些登录验证组合符合多因素验证的设计原则（结合了两种或以上不同维度的认证要素）？\nI. 静态账号密码 + 手机接收的短信动态验证码（SMS OTP）\nII. 智能手机指纹生物识别 + 用户设置的 6 位数字支付密码\nIII. 账号密码 + 备用邮箱找回密码提示问题（如母亲的出生地）\nIV. 静态账号密码 + 物理硬件安全密钥（FIDO2 / Ukey 硬件令牌）", "options": {"A": "I、II", "B": "I、II、IV", "C": "II、III、IV", "D": "I、II、III、IV"}, "answer": "B", "analysis": "身份认证三大维度：1. 所知（Something you know，如密码）；2. 所有（Something you have，如手机短信 OTP、硬件 Ukey）；3. 所是（Something you are，如指纹、人脸）。MFA 必须跨越不同维度。组合 I、II、IV 均结合了不同维度的要素，符合 MFA；组合 III 中密码与密保问题都属于“所知”维度，本质上仍是单要素验证。"}, {"id": 38, "chapter": "第4章 网络安全与网络资源分享", "question": "黑客操纵分布在全球各地的海量受感染“僵尸电脑”（Botnet），在同一时间段内向某电商平台的 Web 服务器疯狂发送数以亿计的伪造网络访问请求，导致目标服务器网络信道堵塞、CPU 资源枯竭而全面瘫痪，正常用户完全无法访问。这种网络攻击被称为：", "options": {"A": "SQL 注入攻击（SQL Injection）", "B": "分散式拒绝服务攻击（Distributed Denial of Service, DDoS）", "C": "零日漏洞攻击（Zero-day Attack）", "D": "跨站请求伪造（CSRF）"}, "answer": "B", "analysis": "分散式拒绝服务攻击（DDoS）利用分布式僵尸网络向目标发起压倒性的海量流量或并发连接轰炸，耗尽目标服务器或网络骨干的带宽、计算与内存资源，导致合法正常用户无法获得正常服务。"}, {"id": 39, "chapter": "第4章 网络安全与网络资源分享", "question": "学校无需出资购买专用的邮件服务器硬件，也无需自行安装和维护复杂的底层操作系统与邮件系统软件，而是直接向云端服务商按需租用 Google Workspace 或 Microsoft 365 提供的网页版邮件和在线文档协作服务。这种云端运算服务模型属于：", "options": {"A": "基础设施即服务（Infrastructure as a Service, IaaS）", "B": "平台即服务（Platform as a Service, PaaS）", "C": "软件即服务（Software as a Service, SaaS）", "D": "硬件即服务（Hardware as a Service, HaaS）"}, "answer": "C", "analysis": "云服务三层模型：1. IaaS 提供计算、存储与网络等底层基础设施（如 AWS EC2、阿里云主机）；2. PaaS 提供开发运行环境与数据库平台（如 Google App Engine）；3. SaaS 直接向终端用户交付完整的应用软件（如 Google Workspace、Microsoft 365），用户直接开箱即用。"}, {"id": 40, "chapter": "第4章 网络安全与网络资源分享", "question": "某多媒体设计工作室在局域网内配置了一台专门连接到中央交换机的独立网络存储设备，内部装有 4 块硬盘并配置了 RAID 冗余阵列，所有设计师都可以通过网络同时高速访问、共享与自动备份海量高清视频素材。这种专用的网络存储设备被称为：", "options": {"A": "网络附属存储（Network Attached Storage, NAS）", "B": "直接连接存储（Direct Attached Storage, DAS）", "C": "虚拟专用网（Virtual Private Network, VPN）", "D": "统一威胁管理（Unified Threat Management, UTM）"}, "answer": "A", "analysis": "网络附属存储（NAS）是一种通过局域网直接连接到交换机、采用专用轻量级系统进行文件级数据存储与跨平台共享的专用设备，支持 RAID 容错阵列，广泛应用于中小企业、学校和多媒体工作室的文件集中存储与备份。"}, {"id": 41, "chapter": "第5章 物联网与其应用", "question": "物联网（Internet of Things, IoT）构建了人与物、物与物互联的庞大网络。在国际公认的物联网经典体系三层架构中，自底层至顶层的正确排列顺序是：", "options": {"A": "网络层 → 感知层 → 应用层", "B": "感知层 → 网络层 → 应用层", "C": "应用层 → 网络层 → 感知层", "D": "感知层 → 应用层 → 网络层"}, "answer": "B", "analysis": "物联网标准三层架构：1. 最底层是“感知层”（Perception Layer），负责利用传感器、RFID 等采集物理世界信息；2. 中间层是“网络层”（Network Layer），负责通过互联网、移动通信网络传输数据；3. 最顶层是“应用层”（Application Layer），将数据与具体行业结合实现智能化控制与应用。"}, {"id": 42, "chapter": "第5章 物联网与其应用", "question": "在独中智慧图书馆的自助借还书机或高速公路 RFID 电子收费系统中，贴在图书封面内侧或汽车挡风玻璃上的 RFID 标签内部本身并没有内置任何化学电池，而是依靠读写器发射的高频电磁波在标签天线上感应产生的微弱电流来激活芯片并回传数据。这种 RFID 标签属于：", "options": {"A": "有源标签 / 主动式标签（Active Tag）", "B": "无源标签 / 被动式标签（Passive Tag）", "C": "半有源标签（Semi-active Tag）", "D": "激光反射标签（Optical Tag）"}, "answer": "B", "analysis": "无源标签（Passive Tag，被动式标签）内部无内置电源，寿命极长、体积轻薄且造价低廉，依赖外部读卡器发射的电磁场通过电磁感应获得工作能量；有源标签（Active Tag）内部自带电池，发射距离更远但体积大且成本高。"}, {"id": 43, "chapter": "第5章 物联网与其应用", "question": "近场通信（Near Field Communication, NFC）是由 RFID 技术演变而来的短距离高频无线通信技术。关于 NFC 技术的特点，下列叙述正确的是：", "options": {"A": "通信有效距离通常在 10 厘米（实际常在 4 厘米）以内，靠近即可极速建立连接", "B": "最大无线传输距离可达 100 米，适合跨房间的高清视频推流", "C": "必须由两台设备预先进行繁琐的人工蓝牙 PIN 码配对才能传输数据", "D": "NFC 只能用于单向只读，两台智能手机之间绝对无法实现双向数据交换"}, "answer": "A", "analysis": "NFC 工作在 13.56 MHz 高频，有效距离极短（通常小于 4~10 厘米），具有触碰即连、建立时间极短（小于 0.1 秒）、安全性高、功耗低的特点，非常适合非接触式小额移动支付、门禁刷卡与电子名片碰一碰分享。"}, {"id": 44, "chapter": "第5章 物联网与其应用", "question": "在智慧家居室内环境中，需要连接分布在各个房间的大量低功耗小型设备（如智能门窗磁传感器、人体红外感应探头、智能灯泡）。这些设备对传输速率要求不高，但要求干电池能持续供电数年，并支持自动组建具备自愈能力的网状网络（Mesh Network）。最适合选用的无线物联网通信协议是：", "options": {"A": "4G LTE", "B": "Zigbee", "C": "超宽带（UWB）", "D": "光纤通道（FC）"}, "answer": "B", "analysis": "Zigbee 是一种基于 IEEE 802.15.4 标准的低功耗、低数据率、短距离无线组网技术，支持强大的 Mesh（网状）拓扑结构，具备自组织与多跳中继能力，设备休眠功耗极低，被广泛应用于智能家居与工业自动化传感控制。"}, {"id": 45, "chapter": "第5章 物联网与其应用", "question": "在覆盖范围达几十平方公里的智慧城市公共管理中（如全城自来水水表远程自动抄表、城市地下管网压力监测），传感器分布极其分散且无法连接外接电源。最适合采用的低功耗广域网（Low-Power Wide-Area Network, LPWAN）通信技术是：", "options": {"A": "红外线（Infrared）", "B": "近场通讯（NFC）", "C": "LoRa 或 NB-IoT", "D": "高速 Wi-Fi 6"}, "answer": "C", "analysis": "低功耗广域网（LPWAN）包括 LoRa 与 NB-IoT，其核心优势是“远距离传输（数公里至数十公里）、超低功耗（纽扣电池可持续工作数年）、广覆盖与海量并发连接”，完美适用于城市远程抄表、智慧路灯、农业野外监测等低频小数据传输场景。"}, {"id": 46, "chapter": "第5章 物联网与其应用", "question": "在物联网自动化控制闭环系统中，设备通常可归为“传感器（Sensor）”与“执行器（Actuator）”。传感器负责将物理量转换为电信号，而执行器负责接收控制指令并将其转化为具体的机械动作或物理状态。下列属于“执行器”的设备是：", "options": {"A": "光敏电阻（用于感知光照强弱）", "B": "热敏电阻（用于测量当前温度）", "C": "智能电动窗帘驱动电机（用于自动拉开或关闭窗帘）", "D": "MQ-2 烟雾检测探头（用于检测燃气泄漏）"}, "answer": "C", "analysis": "执行器（Actuator）负责“执行动作”，根据控制信号驱动机械结构运转，如电动电机、电磁阀门、水泵马达、加热丝继电器等；选项 A、B、D 均为采集物理环境数据的“传感器（Sensor）”。"}, {"id": 47, "chapter": "第5章 物联网与其应用", "question": "智能自动驾驶汽车在行驶中配备了大量高清摄像头、激光雷达和毫米波雷达，每秒产生海量图像数据，系统必须在数毫秒内做出紧急避障与刹车决策。若将所有传感器原始数据全部上传至数千公里外的远程云端服务器处理，会因网络传输延迟而导致严重安全事故。因此，计算任务被部署在车载计算平台本地实时完成。这种计算模式被称为：", "options": {"A": "集中式批处理运算（Centralized Batch Computing）", "B": "边缘运算（Edge Computing）", "C": "离线网格运算（Offline Grid Computing）", "D": "主机时间片轮转运算（Mainframe Time-sharing）"}, "answer": "B", "analysis": "边缘运算（Edge Computing）将数据处理与分析从中心云端下沉到靠近数据源的“网络边缘设备”（如车载计算平台、边缘网关、基站），大大降低了端到端网络延迟，减少了骨干网络带宽消耗，能满足毫秒级实时响应与本地隐私安全需求。"}, {"id": 48, "chapter": "第5章 物联网与其应用", "question": "现代智慧交通系统（ITS）中，通过在车辆、交通信号灯及路侧电子看板上安装无线通信模块，实现车辆与车辆（V2V）、车辆与路侧基础设施（V2I）、车辆与行人（V2P）之间的全方位实时协同交互，以大幅减少交通事故并缓解拥堵。这一综合通信体系被称为：", "options": {"A": "车联网（Vehicle-to-Everything, V2X）", "B": "电子政务系统（E-Government）", "C": "虚拟局域网（VLAN）", "D": "客户体验管理（CEM）"}, "answer": "A", "analysis": "车联网 V2X（Vehicle-to-Everything）是智慧交通的核心基石，涵盖 V2V（车与车）、V2I（车与路）、V2P（车与人）、V2N（车与网络）的信息无缝交互，为高阶协同自动驾驶与交通流智能化调度提供实时网络支撑。"}, {"id": 49, "chapter": "第5章 物联网与其应用", "question": "在现代智慧农业示范园区中，物联网技术被广泛应用于现代化果蔬温室大棚的管理。下列哪些属于物联网在智慧农业中的典型应用？\nI. 利用土壤温湿度传感器与光照传感器，实时采集作物的生长微环境数据\nII. 当土壤含水量低于设定阈值时，云端控制平台自动启动水肥一体化电磁喷淋系统\nIII. 利用搭载多光谱相机的农业无人机巡检果园，利用图像识别算法评估农作物病虫害\nIV. 依靠农作物自身的叶绿素直接发射强电磁波，取代所有电子传感器与路由器", "options": {"A": "I、II", "B": "I、II、III", "C": "II、III、IV", "D": "I、II、III、IV"}, "answer": "B", "analysis": "应用 I、II、III 均是智慧农业物联网的典型成功应用实例；叙述 IV 荒诞违背科学常识，农作物本身无法作为电子发射机发射无线电通信信号。"}, {"id": 50, "chapter": "第5章 物联网与其应用", "question": "近年来，海量家用智能摄像头、智能路由器等消费级物联网设备频繁被黑客攻击挟持并沦为发起网络攻击的僵尸网络工具。导致多数物联网设备在安全防护上极为脆弱的最主要内部根源是：", "options": {"A": "物联网设备全部必须连接高压交流电源，导致电路容易受干扰", "B": "设备硬件计算与存储资源有限难以部署强加密算法，且出厂默认弱密码、固件维护升级机制匮乏", "C": "物联网设备只能使用早已被淘汰的二进制机器语言进行通信", "D": "物联网设备生产过程中禁止使用任何防火墙与加密芯片"}, "answer": "B", "analysis": "物联网安全的主要挑战在于：绝大多数 IoT 终端硬件体积小、成本极低、CPU 算力与内存极其有限，无法运行复杂的安全防护与重型加密套件；同时设备厂商安全意识薄弱，大量设备使用硬编码出厂默认密码（如 admin/admin），且缺乏长期的固件安全空中补丁（OTA）机制，极易被利用。"}];
        const questions_set2 = [{"id": 1, "chapter": "第1章 资讯系统", "question": "资讯系统（Information System）是由多个相互关联的组件组成的有机整体。在一般的系统模型中，收集原始数据并将其输入系统的过程、转换数据的过程，以及将处理结果回传以供调整系统运作的机制，分别被称为：", "options": {"A": "输入（Input）、反馈（Feedback）、输出（Output）", "B": "输入（Input）、处理（Processing）、反馈（Feedback）", "C": "控制（Control）、处理（Processing）、边界（Boundary）", "D": "处理（Processing）、输出（Output）、界面（Interface）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 系统基本概念与要素", "analysis": "资讯系统的五大基本要素为：输入（Input，收集原始数据）、处理（Processing，转换与运算数据）、输出（Output，产生有用信息）、反馈（Feedback，根据输出结果调整输入或处理环节以优化系统性能）以及控制（Control）。题干所指的三个阶段分别对应输入、处理和反馈。"}, {"id": 2, "chapter": "第1章 资讯系统", "question": "系统开发生命周期（SDLC）是规划和构建资讯系统的经典框架。若按照标准开发顺序，下列各项系统开发阶段的排列顺序何者正确？\nI. 系统设计（System Design）\nII. 系统分析（System Analysis）\nIII. 系统规划与调查（System Planning & Investigation）\nIV. 系统实现与编码（System Implementation）\nV. 系统运行与维护（System Maintenance）", "options": {"A": "III ➔ II ➔ I ➔ IV ➔ V", "B": "III ➔ I ➔ II ➔ IV ➔ V", "C": "II ➔ III ➔ I ➔ IV ➔ V", "D": "I ➔ II ➔ III ➔ IV ➔ V"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 系统开发生命周期 (SDLC)", "analysis": "SDLC 标准六/五阶段的严格先后顺序为：1. 系统规划（确定项目可行性与目标）➔ 2. 系统分析（明确使用者需求与业务逻辑）➔ 3. 系统设计（规划架构、界面、数据库）➔ 4. 系统实现/实现与测试（编写代码、安装硬件）➔ 5. 运行与维护（日常检修与更新升级）。因此正确顺序为 III ➔ II ➔ I ➔ IV ➔ V。"}, {"id": 3, "chapter": "第1章 资讯系统", "question": "系统分析员在收集使用者资讯需求时，通常需要针对不同对象采用不同的收集技术。若想要针对全校 2000 名在校学生快速调查对“智慧食堂订餐系统”的整体使用意向与饮食偏好，最经济、高效且能进行量化统计的需求收集方法是：", "options": {"A": "个人深入访谈（Personal Interviews）", "B": "直接现场观察法（On-site Observation）", "C": "问卷调查法（Questionnaires / Surveys）", "D": "联合应用开发会议（JAD Sessions）"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 需求收集技术", "analysis": "问卷调查法（Questionnaire）最大的优势在于可以在极短时间内以极低成本覆盖大量受访者（如全校数千名学生），且数据容易进行量化分析与图表统计。访谈法适合针对少数核心主管或关键岗位深入挖掘复杂需求；现场观察法则适合核实日常流水线实操流程。"}, {"id": 4, "chapter": "第1章 资讯系统", "question": "在关系数据库与实体关系图（ERD）的设计中，关于“主键（Primary Key）”与“外键（Foreign Key）”的描述，下列哪一项叙述是正确的？", "options": {"A": "主键字段的值可以包含重复值，但绝不能为空值（Null）", "B": "每个数据表必须拥有至少两个不同的主键字段", "C": "外键字段用于建立两个表之间的关联，其取值必须参照另一个表的主键或为 Null", "D": "外键字段中存储的数据必须是唯一的，绝对不可重复"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 数据库与实体关系图 (ERD)", "analysis": "主键（Primary Key）是唯一标识数据表中每一条记录的字段（实体完整性），必须唯一且不可为空（Not Null）；外键（Foreign Key）是一个表中的字段，指向另一个表的主键，用于维持参照完整性（Referential Integrity），外键的值可以重复（例如多个学生拥有相同的班级编号），也可以在未确定时允许为 Null。"}, {"id": 5, "chapter": "第1章 资讯系统", "question": "在结构化数据流程图（DFD）中，存在一些必须严格遵守的绘图规则以避免逻辑错误。在 DFD 中，若某一个处理过程（Process）只有输入数据流而没有任何输出数据流，这种逻辑缺陷被称为：", "options": {"A": "黑洞（Black Hole）", "B": "奇迹（Miracle）", "C": "灰洞（Gray Hole）", "D": "死锁（Deadlock）"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 数据流程图 (DFD) 语法规则", "analysis": "在 DFD 中：1. 只有输入没有输出的处理过程称为“黑洞（Black Hole）”；2. 只有输出没有输入的处理过程称为“奇迹（Miracle）”；3. 输入的数据不足以产生该输出结果（数据产生逻辑断层）称为“灰洞（Gray Hole）”。"}, {"id": 6, "chapter": "第1章 资讯系统", "question": "某独中教务处引进了全新的云端学籍与排课系统。由于旧系统年久失修且架构陈旧，校方决定于 12 月 31 日彻底停用旧系统，并于次年 1 月 1 日直接全校切换启用新系统。这种转换方式虽然成本最低、用时最短，但所承担的风险最大的系统转换策略是：", "options": {"A": "并行转换（Parallel Conversion）", "B": "直接转换（Direct Cutover / Conversion）", "C": "分段转换（Phased Conversion）", "D": "试点转换（Pilot Conversion）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 系统转换策略", "analysis": "直接转换（Direct Conversion / Cutover）是指在指定时间点瞬间停用旧系统并全面开启新系统（一刀切）。其特点是耗资最少、无需维护两套系统数据，但一旦新系统发生未知崩溃，组织将没有任何后备系统可用，风险最高。"}, {"id": 7, "chapter": "第1章 资讯系统", "question": "在系统投入日常运行后，技术团队接获使用者通报：在每月最后一天结算账目时，系统会偶发性出现“除以零（Division by Zero）”的致命运行时错误并强行退出。技术人员迅速定位代码并修正此缺陷。这属于下列哪一种系统维护？", "options": {"A": "纠正性维护（Corrective Maintenance）", "B": "适应性维护（Adaptive Maintenance）", "C": "完善性维护（Perfective Maintenance）", "D": "预防性维护（Preventive Maintenance）"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 系统维护的类型", "analysis": "纠正性维护（Corrective Maintenance）专门指诊断并修复系统在运行过程中暴露出的程序 Bug、逻辑计算错误或软硬件故障；适应性维护是因应外部软硬件环境或法律政策变更而调整；完善性维护是优化功能性能与界面体验；预防性维护是提前防范未来潜在隐患。"}, {"id": 8, "chapter": "第1章 资讯系统", "question": "某国际物流企业的高级管理层在制定未来 3 年的亚太区仓储投资决策时，利用资讯系统输入“如果油价上涨 20%”或“如果海运关税下调 5%”等假设情境，系统自动模拟出不同的财务风险模型与利润预测。这种具备“假设分析（What-If Analysis）”能力的资讯系统属于：", "options": {"A": "交易处理系统（TPS）", "B": "办公室自动化系统（OAS）", "C": "决策支援系统（Decision Support System, DSS）", "D": "条码扫描库存管理系统"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 管理资讯系统的金字塔架构", "analysis": "决策支援系统（DSS）服务于中高阶管理层，其核心特征是具备数学分析模型，支持半结构化或非结构化决策，尤其具备“假设模拟（What-If Analysis）”、“敏感度分析（Sensitivity Analysis）”与目标求解功能。"}, {"id": 9, "chapter": "第1章 资讯系统", "question": "在敏捷软件开发（Agile Development）方法中，开发团队通常打破传统瀑布模型长达数月乃至数年的漫长交付周期，而是将开发任务切分为数个为期 2~4 周的短周期，每个周期结束后均向客户交付可运行的软件增量版本。这个短迭代开发周期被称为：", "options": {"A": "里程碑（Milestone）", "B": "冲刺 / 迭代（Sprint / Iteration）", "C": "关键路径（Critical Path）", "D": "甘特区间（Gantt Span）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 现代敏捷开发方法", "analysis": "敏捷开发（如 Scrum 框架）的核心工作单位是“冲刺（Sprint）”或迭代（Iteration），通常持续 1 至 4 周。团队在每个 Sprint 结束时完成一份可供演示和投入运行的功能增量，以便快速获得客户反馈并灵活响应需求变更。"}, {"id": 10, "chapter": "第1章 资讯系统", "question": "系统分析员在整理大型商场会员积分规则时发现：顾客在周一至周五与周末折扣不同，同时还受会员等级（黄金、白银、普通）以及单次消费金额是否超过 RM300 等多重条件交叉影响。为了清晰、完整且毫无遗漏地表达这种多条件交叉组合的逻辑规则，最适合采用的逻辑说明工具是：", "options": {"A": "实体关系图（ERD）", "B": "决策表（Decision Table）", "C": "网络拓扑图（Topology Map）", "D": "甘特图（Gantt Chart）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第1章 资讯系统 · 过程逻辑说明工具 (决策表与决策树)", "analysis": "当业务逻辑由多个复杂条件的不同组合所决定时，决策表（Decision Table）是最佳的结构化分析工具。它通过条件桩、动作桩、条件项与动作项的矩阵组合，能有效避免因条件繁复而导致的逻辑漏洞或规则冲突。"}, {"id": 11, "chapter": "第2章 网络类型与传输质量", "question": "跨越国家、大洲甚至连接全球不同地区计算机设备的超大型网络体系，例如跨国跨洋的网际网络（Internet），按照计算机网络的地理覆盖范围分类属于：", "options": {"A": "广域网（Wide Area Network, WAN）", "B": "城域网（Metropolitan Area Network, MAN）", "C": "局域网（Local Area Network, LAN）", "D": "个人区域网（Personal Area Network, PAN）"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 网络范围分类", "analysis": "按地理覆盖范围划分：PAN（数米以内）、LAN（单一建筑物或校园，通常几公里以内）、MAN（城市范围，数公里至数十公里）、WAN（广域网，跨越城市、国家乃至全球，通过公共电信运营商或海底光缆长途互联）。"}, {"id": 12, "chapter": "第2章 网络类型与传输质量", "question": "在光纤通信中，“单模光纤（Single-Mode Fiber, SMF）”与“多模光纤（Multi-Mode Fiber, MMF）”具有不同的物理结构与适用场景。下列关于两者的比较，哪一项叙述是正确的？", "options": {"A": "单模光纤的纤芯直径极细，光线以单一路径直线传播，适合数十公里以上的长途骨干传输", "B": "多模光纤由于使用激光作为光源，传输距离比单模光纤更远且色散极低", "C": "单模光纤通常使用廉价的发光二极管（LED）作为光源，多用于大楼内部局域网", "D": "多模光纤的纤芯直径较细，能够完全消除光波的多径反射色散现象"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 有线传输介质 (光纤)", "analysis": "单模光纤（SMF）纤芯非常细（约 9 微米），采用单色性极好的激光（Laser）作为光源，光线沿单一轴向传输无模式色散，衰减极小，支持数十至数百公里的长途骨干传输；多模光纤（MMF）纤芯较粗（50/62.5 微米），光线以多角度反射前进，存在模式色散，传输距离通常限制在几公里甚至几百米以内，常用于机房和建筑物内短途互联。"}, {"id": 13, "chapter": "第2章 网络类型与传输质量", "question": "无线路由器通常支持 2.4 GHz 和 5 GHz 两个无线工作频段（双频 Wi-Fi）。若某位同学的卧室与客厅路由器之间隔着两堵较厚的混凝土承重墙，且他需要较为稳定的信号连接。在没有额外中继器的情况下，关于这两个频段的物理特性，下列说法何者正确？", "options": {"A": "5 GHz 频段波长更长，绕射和穿墙能力更强，此时应首选 5 GHz", "B": "2.4 GHz 频段电磁波波长较长，衰减较慢且穿透与绕射能力较优，信号覆盖更远", "C": "5 GHz 频段比 2.4 GHz 具有更多家电（如微波炉、蓝牙）的无线信道干扰", "D": "两个频段在穿透实体墙体时的能量衰减程度完全相同"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 无线传输介质与无线频段", "analysis": "根据电磁波物理特性，频率越低，波长越长，绕射（衍射）能力越强，穿墙损耗相对较小，因此 2.4 GHz 信号传播范围广、穿墙能力更好；而 5 GHz 频率高、波长短，带宽高且传输速率快、干扰少，但穿透墙壁时衰减极其剧烈，适合近距离无遮挡高速传输。"}, {"id": 14, "chapter": "第2章 网络类型与传输质量", "question": "在局域网中最广泛采用的物理拓扑结构是“星状拓扑（Star Topology）”。关于星状网络拓扑的运行特征，下列叙述何者正确？", "options": {"A": "网络中任意一台工作站电脑损坏断网，整个网络将立即全面瘫痪", "B": "所有节点均连接到一条中央共享公共总线缆上，两端需要终结电阻", "C": "所有工作站均连接到中央交换机（Switch），若中央交换机损坏，全网将无法通信", "D": "数据包必须像环形跑道一样沿着顺时针方向依次途经每一台主机转发"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 网络拓扑结构 (星状拓扑)", "analysis": "星状拓扑（Star Topology）所有终端通过独立双绞线连接到中央集线/交换设备。单台电脑或某根连线损坏仅影响该设备自身，易于维护与扩展；但中央设备是单一故障点（Single Point of Failure），中央交换机一旦断电或损毁，所有连接该设备的通信全面中断。"}, {"id": 15, "chapter": "第2章 网络类型与传输质量", "question": "在数据通信中，根据信号在传输通道上的流通方向与时间关系，数据传输方向模式可分为单工、半双工和全双工。传统的对讲机（Walkie-Talkie）在通信时，双方可以轮流发言，但一人按下对讲键讲话时，另一人只能收听而无法同时插话。这种通信模式属于：", "options": {"A": "单工（Simplex）", "B": "半双工（Half-Duplex）", "C": "全双工（Full-Duplex）", "D": "频分复用（FDM）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 数据传输方向模式", "analysis": "单工（Simplex）仅允许信号单向流动（如传统 FM 收音机）；半双工（Half-Duplex）允许数据双向传递，但在同一时刻只能由一方发送、另一方接收（如对讲机）；全双工（Full-Duplex）允许通信双方在同一时刻同时进行双向收发（如手机通话、现代全双工以太网）。"}, {"id": 16, "chapter": "第2章 网络类型与传输质量", "question": "早期的电话线通信或有线电视宽带需要使用调制解调器（Modem）。调制解调器的核心功能是实现计算机处理的数字信号（Digital Signals）与物理模拟信道中传输的模拟信号（Analog Signals）之间的相互转换。其中，将“数字信号转换为模拟信号”的过程称为：", "options": {"A": "解调（Demodulation）", "B": "调制（Modulation）", "C": "路由（Routing）", "D": "封包（Packetizing）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 调制解调技术", "analysis": "调制（Modulation）是指将计算机内部的离散“数字信号”转换为适合在模拟介质（如电话双绞线）中长途传输的连续“模拟信号”（发端）；反之，将模拟信号还原为数字信号的过程称为解调（Demodulation，收端）。"}, {"id": 17, "chapter": "第2章 网络类型与传输质量", "question": "在网络传输性能的衡量指标中，从发送端向传输介质推入数据包开始，到该数据包的最后一个比特完全离开网卡进入线路所耗费的时间，被称为：", "options": {"A": "传播时延（Propagation Delay）", "B": "排队时延（Queuing Delay）", "C": "传输时延（Transmission Delay / 发送时延）", "D": "处理时延（Processing Delay）"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 网络时延与性能分析", "analysis": "总时延由四部分组成：1. 传输时延（Transmission Delay = 数据大小 / 链路带宽，即主机将数据所有比特打入信道的时间）；2. 传播时延（Propagation Delay = 物理链路长度 / 电磁波传播速率，即电磁波在物理介质中跑过一定距离所需时间）；3. 排队时延；4. 处理时延。"}, {"id": 18, "chapter": "第2章 网络类型与传输质量", "question": "在工业自动化厂房或高压变电站等强电磁干扰环境下布设网络时，为了防止外部强烈的高频电磁脉冲干扰通信质量，网络工程师应当优先选用的双绞线规格是：", "options": {"A": "非屏蔽双绞线（UTP）", "B": "屏蔽双绞线（STP）", "C": "普通平行电话线", "D": "细同轴电缆（10Base2）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 双绞线类型 (STP vs UTP)", "analysis": "屏蔽双绞线（Shielded Twisted Pair, STP）在双绞线对外部包裹有金属金属箔或金属编织网屏蔽层，能够极大程度地抵御外部强电磁干扰（EMI）与无线电射频干扰（RFI），特别适用于工厂、变电站等恶劣电磁环境；UTP 则没有金属屏蔽层，仅适用于普通办公室或家庭。"}, {"id": 19, "chapter": "第2章 网络类型与传输质量", "question": "在大型企业局域网中，采用“主从式架构（Client-Server Architecture）”相较于“对等式网络（Peer-to-Peer, P2P）”的核心管理优势在于：", "options": {"A": "网络无需采购任何昂贵的高性能专用服务器硬件", "B": "所有普通客户端电脑具有同等的系统管理控制权限", "C": "便于集中管理用户账户安全策略、访问授权与核心业务数据统一备份", "D": "单台客户端电脑发生故障会导致整个局域网的所有用户均无法开机"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 集中式管理与网络架构", "analysis": "主从式架构（Client-Server）通过中心服务器集中提供文件、打印、身份验证和数据库服务，最大的优势是集中式安全权限管控、统一高效备份以及强大的访问控制；对等网络（P2P）没有中心服务器，管理分散，不适合节点多于 10 台的大型组织。"}, {"id": 20, "chapter": "第2章 网络类型与传输质量", "question": "第五代移动通信技术（5G）定义了三大典型业务应用场景以满足多元化的数字时代需求。其中，专为智能电网控制、远程无人手术以及高可靠自动驾驶防撞等业务量身定制的 5G 核心特性场景是：", "options": {"A": "增强移动宽带（eMBB）", "B": "超高可靠超低时延通信（uRLLC）", "C": "海量机器类通信（mMTC）", "D": "非对称数字用户线路（ADSL）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第2章 网络类型与传输质量 · 5G 通信三大核心应用场景", "analysis": "国际电信联盟（ITU）定义的 5G 三大核心场景：1. eMBB（增强移动宽带，面向 8K 超高清、AR/VR 等大带宽需求）；2. uRLLC（超高可靠超低时延通信，要求时延在 1 毫秒级、可靠性达 99.999%，面向自动驾驶、远程手术、工业精密控制）；3. mMTC（海量机器通信，面向智慧城市万物互联）。"}, {"id": 21, "chapter": "第3章 网络通讯与作业系统", "question": "在数据从应用层向物理层自顶向下逐层封装发送的过程中，数据在各层被添加了相应的协议首部（Header）。在 OSI 模型中，下列各层所处理的协议数据单元（PDU）术语对应完全正确的是：", "options": {"A": "传输层 —— 数据帧（Frame）；网络层 —— 数据包（Packet）", "B": "传输层 —— 数据段（Segment）；网络层 —— 数据包（Packet）；数据链路层 —— 数据帧（Frame）", "C": "网络层 —— 比特（Bit）；数据链路层 —— 数据段（Segment）", "D": "应用层 —— 数据段（Segment）；物理层 —— 数据帧（Frame）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · OSI 模型协议数据单元 (PDU)", "analysis": "OSI 参考模型各层数据单元（PDU）标准命名：物理层为“比特（Bits）”；数据链路层为“帧（Frames）”；网络层为“数据包 / 分组（Packets）”；传输层为“数据段（Segments）”；高三层统称为“数据 / 报文（Data / Message）”。"}, {"id": 22, "chapter": "第3章 网络通讯与作业系统", "question": "网卡在出厂时被烧录了唯一的物理硬件地址，即 MAC 地址（Media Access Control Address）。一个标准的以太网 MAC 地址长度通常是多少位元（Bits），以及前 24 位通常代表什么含义？", "options": {"A": "32 位元；代表所在子网的网络 ID", "B": "128 位元；代表网卡出厂序列号", "C": "48 位元；代表机构唯一识别码（OUI / 网卡生产厂商代码）", "D": "64 位元；代表数据链路层优先级标记"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · MAC 地址结构与原理", "analysis": "MAC 地址总长为 48 位元（6 字节），通常书写为 12 位十六进制数（例如 00:1A:2B:3C:4D:5E）。其中前 24 位（前 3 字节）是由 IEEE 官方统一分配给网卡生产制造商的机构唯一标识符（OUI, Organizationally Unique Identifier）；后 24 位则由厂家自行分配给具体网卡作为唯一序列号。"}, {"id": 23, "chapter": "第3章 网络通讯与作业系统", "question": "在 TCP/IP 体系中，为了区分同一台服务器上运行的不同网络应用程序，传输层引入了“端口号（Port Number）”。下列常用知名服务与其默认预留端口号的配对，哪一项是错误的？", "options": {"A": "HTTP 网页浏览服务 —— 端口 80", "B": "HTTPS 安全加密网页服务 —— 端口 443", "C": "DNS 域名解析服务 —— 端口 53", "D": "FTP 文件传输服务 —— 端口 25"}, "answer": "D", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · 常见服务预留端口号", "analysis": "FTP（文件传输协议）的标准预留端口为 20（数据连接）和 21（控制连接）；端口 25 是简单邮件传输协议（SMTP）的标准预留端口。选项 A（HTTP 80）、B（HTTPS 443）、C（DNS 53）均配对正确。"}, {"id": 24, "chapter": "第3章 网络通讯与作业系统", "question": "某学校机房被分配了一个子网 IP 地址块：`192.168.10.0 /26`。请根据无类别域间路由（CIDR）规则计算，该子网对应的子网掩码（Subnet Mask）以及该子网内实际可分配给电脑使用的有效主机 IP 地址总数分别为：", "options": {"A": "255.255.255.128 ； 126 个", "B": "255.255.255.192 ； 62 个", "C": "255.255.255.224 ； 30 个", "D": "255.255.255.0 ； 254 个"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · 子网掩码与 CIDR 主机数计算", "analysis": "CIDR 前缀为 /26，意味着前 26 位为全 1，后 6 位为全 0。第四字节二进制为 11000000 = 128 + 64 = 192，故子网掩码为 255.255.255.192。主机位共有 32 - 26 = 6 位，总 IP 数为 2^6 = 64 个。扣除 1 个网络地址（全0）和 1 个广播地址（全1），实际可分配的有效主机 IP 数为 64 - 2 = 62 个。"}, {"id": 25, "chapter": "第3章 网络通讯与作业系统", "question": "TCP 协议在发送应用数据之前，必须在客户端与服务器之间建立可靠的端到端虚电路连接。建立该连接所经历的“三次握手（Three-way Handshake）”控制报文标志位传递顺序是：", "options": {"A": "SYN ➔ SYN + ACK ➔ ACK", "B": "ACK ➔ SYN ➔ FIN", "C": "SYN ➔ ACK ➔ FIN", "D": "RST ➔ SYN ➔ ACK"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · TCP 三次握手连接机制", "analysis": "TCP 三次握手流程：1. 客户端发送同步报文段 [SYN, Seq=x] 请求建连；2. 服务器回复同步确认报文段 [SYN, ACK, Seq=y, Ack=x+1]；3. 客户端发送确认报文段 [ACK, Ack=y+1]，连接正式建立（ESTABLISHED）。因此标志位顺序为 SYN ➔ SYN+ACK ➔ ACK。"}, {"id": 26, "chapter": "第3章 网络通讯与作业系统", "question": "在 Windows 或 Linux 终端命令行中，若网络管理员想要检测某台主机是否能够通过网络顺利到达目标服务器，并测算数据往返时间（RTT）与丢包率，最常用、基于 ICMP 协议的诊断命令是：", "options": {"A": "ipconfig", "B": "ping", "C": "netstat", "D": "tracert"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · 常见网络排错命令工具", "analysis": "ping 命令基于网络层的 ICMP 协议（Echo Request 与 Echo Reply），主要用于测试两台主机之间的基本网络连通性、网络往返时延（RTT）及丢包率；tracert 追踪路由跳数；ipconfig 查询本机 IP 配置；netstat 查看活跃端口与网络连接。"}, {"id": 27, "chapter": "第3章 网络通讯与作业系统", "question": "由于全球公网 IPv4 地址极度匮乏，绝大多数学校与家庭宽带路由器均部署了“网络地址转换（Network Address Translation, NAT）”技术。NAT 在局域网访问互联网时的核心工作机制是：", "options": {"A": "将计算机中的字符域名自动解析转换为对应的 IPv4 地址", "B": "把所有局域网内部私有 IP 数据包转换为未经加密的物理无线电波", "C": "将内网多台电脑的私有 IP 地址与端口映射转换为路由器对外的单一公网 IP 地址", "D": "拦截并永久丢弃所有包含多媒体视频流的网络数据包"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · 网络地址转换 (NAT) 机制", "analysis": "NAT（尤其是 NAPT 端口多路复用）允许局域网内部成百上千台配置私有 IP（如 192.168.x.x）的主机，通过路由器的 NAT 表建立私网 IP+内部端口与公网 IP+外部端口的映射关系，共享极少量的合法公网 IPv4 地址并发访问互联网，有效缓解了 IPv4 地址枯竭问题。"}, {"id": 28, "chapter": "第3章 网络通讯与作业系统", "question": "动态主机配置协议（DHCP）在为新接入网络的客户端电脑自动分配 IP 参数时，客户端与 DHCP 服务器之间按顺序交换的四个核心报文（简称 DORA 流程）是：", "options": {"A": "Discover ➔ Offer ➔ Request ➔ Acknowledgment", "B": "DNS ➔ Open ➔ Read ➔ Accept", "C": "Disconnect ➔ Offline ➔ Reconnect ➔ Active", "D": "Detect ➔ Option ➔ Reset ➔ Apply"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · DHCP 四步交互机制 (DORA)", "analysis": "DHCP 四步租约过程标准缩写为 DORA：1. DHCP Discover（客户端广播寻找服务器）；2. DHCP Offer（服务器单播/广播提供可用 IP 方案）；3. DHCP Request（客户端广播请求租用该 IP）；4. DHCP Acknowledgment（服务器确认分配并生效）。"}, {"id": 29, "chapter": "第3章 网络通讯与作业系统", "question": "在 Windows Server 等网络操作系统中，微软提供的“活动目录（Active Directory, AD）”服务扮演着核心管理角色。下列关于活动目录主要功能的描述，何者正确？", "options": {"A": "主要用于对损坏的计算机硬盘执行物理磁道修复", "B": "提供集中式的目录数据库，实现全校师生用户账号、权限安全与组策略（Group Policy）的统一验证管理", "C": "自动将 4G 手机网络信号放大为 5G 光纤宽带", "D": "实时监测网络电缆内部铜芯的物理温度与电压波动"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · 网络操作系统与活动目录 (AD)", "analysis": "活动目录（Active Directory, AD）是 Windows 网络操作系统中的分布式目录服务中枢，其核心职能是集中式存储网络资源对象信息，提供基于域（Domain）的集中用户身份验证、授权、组策略（Group Policy）强制下发以及单一登录（SSO）体验。"}, {"id": 30, "chapter": "第3章 网络通讯与作业系统", "question": "学校老师在居家办公或出差期间，需要安全访问学校内部机房限定内网才能打开的“期末考生成绩录入系统”。为了在公共开放的互联网上建立一条点对点的私有加密安全隧道，老师电脑上应当启用的网络技术是：", "options": {"A": "万维网（WWW）", "B": "对等网络（P2P）", "C": "虚拟专用网（Virtual Private Network, VPN）", "D": "简单网络管理协议（SNMP）"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第3章 网络通讯与作业系统 · 虚拟专用网 (VPN) 安全隧道", "analysis": "虚拟专用网（VPN）利用加密与隧道协议（如 IPsec、SSL/TLS），在非安全的公共互联网络上建立一条逻辑上的专用安全加密通道。远程办公人员接入 VPN 后，如同直接接入学校内网局域网，数据传输受到高强度加密保护，防止被窃听或篡改。"}, {"id": 31, "chapter": "第4章 网络安全与网络资源分享", "question": "信息安全领域最公认的基础核心是“CIA 三要素”模型。某黑客通过 SQL 注入漏洞入侵了某银行的账务数据库，私下将自己的账户余额由 RM100 篡改为 RM1,000,000，但未窃取或删除任何其他客户的数据。该黑客的恶意行为主要破坏了信息安全的哪一个属性？", "options": {"A": "机密性（Confidentiality）", "B": "完整性（Integrity）", "C": "可用性（Availability）", "D": "不可抵赖性（Non-repudiation）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 信息安全 CIA 三要素", "analysis": "CIA 三要素分别为：1. 机密性（Confidentiality，防非授权泄露）；2. 完整性（Integrity，防非授权篡改、伪造或未授权变动）；3. 可用性（Availability，防系统拒绝服务或瘫痪）。黑客私自修改数据库中的存款金额属于典型的数据篡改，破坏了“完整性”。"}, {"id": 32, "chapter": "第4章 网络安全与网络资源分享", "question": "在恶意软件（Malware）分类中，“计算机蠕虫（Computer Worm）”与传统“计算机病毒（Computer Virus）”具有明显的行为差异。下列关于蠕虫最典型的特征描述是：", "options": {"A": "必须依赖宿主文件（如 .exe 或 Office 文档），且需要用户主动双击运行才能激活", "B": "具备独立运行能力，无需依附宿主文件，能通过网络端口或系统漏洞自主快速自我复制与广泛传播", "C": "表面上伪装成好玩的游戏外挂，后台悄悄开启后门端口供黑客控制", "D": "只能通过物理 U 盘手工拷贝传播，完全无法在网络中流动"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 病毒 vs 蠕虫的核心差异", "analysis": "传统计算机病毒（Virus）必须寄生在其他宿主程序或文件中，需要人工触发/执行才能激活；而计算机蠕虫（Worm）是完全独立的恶意程序，无需宿主文件，能够自主利用网络协议漏洞或弱密码扫描，主动将自身副本狂暴传播到整个局域网或互联网，常造成网络带宽被瞬间耗尽。"}, {"id": 33, "chapter": "第4章 网络安全与网络资源分享", "question": "某用户在电脑使用网银时，发现只要输入账号密码，隔天其账户就会被盗刷。经专业安全工程师检测，发现其电脑在后台静默运行了一个恶意软件，该软件在内核层截获并隐蔽记录用户在键盘上的每一个击键动作，并将数据悄悄打包发送至黑客服务器。这种间谍软件被称为：", "options": {"A": "键盘记录器（Keylogger）", "B": "勒索软件（Ransomware）", "C": "逻辑炸弹（Logic Bomb）", "D": "宏病毒（Macro Virus）"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 间谍软件与键盘记录器", "analysis": "键盘记录器（Keylogger）属于间谍软件（Spyware）的一种，其核心功能是暗中监听、捕获并记录目标用户在物理或虚拟键盘上的按键序列（包括登录凭据、网银密码、聊天记录等），并偷偷回传给攻击者。"}, {"id": 34, "chapter": "第4章 网络安全与网络资源分享", "question": "在商场、咖啡馆等公共场所连接没有任何密码的开放式公共 Wi-Fi 热点时，用户最容易遭受黑客发起的“中间人攻击（Man-in-the-Middle Attack, MitM）”。防范此类安全风险最有效的防护手段是：", "options": {"A": "调低手机屏幕亮度，防止身后有人窥视", "B": "在公共网络下访问网站时优先强制使用 HTTPS 加密连接，并配合开启 VPN 保护通道", "C": "关闭手机的飞行模式并开启蓝牙自动广播功能", "D": "每次浏览网页后立即关闭浏览器历史记录"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 公共网络安全防护与中间人攻击", "analysis": "在未加密的开放公共 Wi-Fi 环境中，黑客极易利用 ARP 欺骗或设立山寨钓鱼热点截获局域网未加密明文数据包（中间人攻击）。使用高强度端到端加密的 HTTPS 协议以及开启具备隧道加密能力的 VPN，能确保即使流量被窃听截获，黑客也只能看到无法解密的密文。"}, {"id": 35, "chapter": "第4章 网络安全与网络资源分享", "question": "现代 HTTPS 通信协议在建立安全加密通道时，巧妙结合了“对称密钥加密”与“非对称密钥加密”两者的优点。关于两者在 HTTPS 中的分工，下列描述准确的是：", "options": {"A": "全程 100% 只使用非对称加密传输所有网页图文内容，完全不使用对称加密", "B": "在握手阶段使用非对称加密安全协商并交换会话密钥；在后续网页大量数据传输中采用对称加密进行高效加密", "C": "在握手阶段使用对称加密核验服务器身份；在数据传输阶段使用非对称加密提高传输速率", "D": "对称加密算法的运算开销极大，因此只能用来传输小于 10 字节的纯文本"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 混合加密机制 (HTTPS)", "analysis": "非对称加密（如 RSA、ECC）安全性高、密钥分发安全，但数学运算复杂、速度缓慢；对称加密（如 AES）加解密速度极快，但密钥分发存在安全隐患。HTTPS 采用混合加密：在初始 TLS 握手阶段利用非对称加密验证身份并安全协商对称“会话密钥（Session Key）”；随后的大规模网页数据传输全程采用高效的对称加密进行加解密。"}, {"id": 36, "chapter": "第4章 网络安全与网络资源分享", "question": "某大型互联网系统在数据库中存储千万级会员的登录密码时，坚决杜绝存储明文密码，而是使用单向加密哈希算法（如 SHA-256）结合“加盐机制（Salting）”进行哈希存储。在密码存储中引入“盐值（Salt）”的核心目的是：", "options": {"A": "使管理员能够随时通过反向逆运算轻松还原出用户的原始明文密码", "B": "为每个用户随机生成不同字符串附加到密码后再进行哈希，有效防范黑客利用彩虹表（Rainbow Table）批量逆向破解", "C": "加快数据库执行 SQL 登录查询时的物理硬件扫描速度", "D": "自动缩短用户的密码长度以节省数据库存储硬盘空间"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 哈希算法与密码加盐存储 (Salting)", "analysis": "加盐（Salting）是指在对用户密码计算单向散列哈希值之前，在密码中混入一段由系统随机生成的唯一字符串（盐值）。这样即使两位用户的密码完全相同，生成的哈希值也截然不同，彻底粉碎了黑客利用预先计算好的“彩虹表（Rainbow Table）”进行碰撞还原攻击的途径。"}, {"id": 37, "chapter": "第4章 网络安全与网络资源分享", "question": "学校数据中心为了防范硬盘损毁或勒索软件攻击，设计了一套数据备份方案：每周日午夜执行一次耗时较长的“完整备份（Full Backup）”，而在周一至周六的每个夜晚，系统仅备份自上一次任何类型备份之后“新增或修改变动过”的文件。这种周一至周六采用的备份方式属于：", "options": {"A": "增量备份（Incremental Backup）", "B": "差异备份（Differential Backup）", "C": "热备镜像（Mirror Backup）", "D": "冷归档备份（Cold Archiving）"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 数据备份策略 (增量 vs 差异)", "analysis": "增量备份（Incremental Backup）仅备份自“上一次备份（无论是完整还是增量备份）”以来发生修改的数据，其特点是备份速度最快、占用存储空间最省，但在还原时必须依次恢复完整备份及之后所有的增量备份；差异备份（Differential Backup）则是备份自“上一次完整备份”以来的所有变动数据。"}, {"id": 38, "chapter": "第4章 网络安全与网络资源分享", "question": "黑客并不依赖高深的程序代码破解漏洞，而是故意伪装成某独中电脑中心的技术人员，打电话给初一新入职教师，声称“系统正在例行维护，需要老师立刻口头报上账号与密码以防账户被锁”。这种利用人类心理弱点、信任或疏忽大意来诱骗获取机密敏感信息的攻击手段统称为：", "options": {"A": "缓冲区溢出攻击（Buffer Overflow）", "B": "社交工程学攻击（Social Engineering）", "C": "SYN 洪水攻击（SYN Flood）", "D": "端口扫描攻击（Port Scanning）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 社交工程学 (Social Engineering)", "analysis": "社交工程学（Social Engineering）是指攻击者通过心理操纵、伪装身份、欺骗、威逼利诱等非技术手段，突破人类防线来获取未经授权的系统访问权限或机密凭据（如假冒网管、虚构紧急情境）。防范社交工程学最有效的手段是对员工进行持续的安全意识培训。"}, {"id": 39, "chapter": "第4章 网络安全与网络资源分享", "question": "某大型商业银行由于处理高度机密的金融资产数据与客户征信报告，受国家金融监管法规严格限制，禁止将核心交易系统托管在第三方公共云端。因此，该银行斥巨资在自建数据中心机房内搭建了完全由本行专属拥有、自主运维且物理隔离的云计算环境。这种云计算部署模型属于：", "options": {"A": "公有云（Public Cloud）", "B": "私有云（Private Cloud）", "C": "社区云（Community Cloud）", "D": "混合云（Hybrid Cloud）"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 云计算部署模型", "analysis": "云计算按部署模型分类：1. 公有云（Public Cloud，由第三方云商运营供大众共享使用，如 AWS、阿里云）；2. 私有云（Private Cloud，由单一组织独家拥有并使用，具备最高的安全管控与合规隐私保障）；3. 混合云（结合公有云与私有云优势）；4. 社区云（特定利益共同体共享）。"}, {"id": 40, "chapter": "第4章 网络安全与网络资源分享", "question": "在企业级数据中心存储架构中，“存储区域网络（Storage Area Network, SAN）”被广泛用于支撑核心数据库服务器。相较于普通网络附属存储（NAS），SAN 最显著的技术特征是：", "options": {"A": "通过局域网以普通文件级别（File-level）为普通办公电脑提供日常文件共享", "B": "通过高速专用网络（如光纤通道 Fibre Channel）提供底层块级（Block-level）存储，服务器直接视其为本地物理硬盘", "C": "只能使用廉价的双绞线连接，无法支持高速光纤接口", "D": "内部无法配置任何 RAID 磁盘阵列冗余技术"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第4章 网络安全与网络资源分享 · 网络存储技术 (SAN vs NAS)", "analysis": "NAS（网络附属存储）工作在文件级别（File-level），采用 NFS/SMB 协议，面向客户端提供文件级共享，适合文档存取；SAN（存储区域网络）工作在块级别（Block-level），采用高速专用网络（如 FC 光纤通道或 iSCSI），服务器将远程 SAN 存储逻辑单元（LUN）直接识别为本地原生裸硬盘，具备极高的 I/O 吞吐率与超低时延，主要面向大型数据库与虚拟化集群。"}, {"id": 41, "chapter": "第5章 物联网与其应用", "question": "在物联网（IoT）系统中，传感器是感知物理世界变化的基础硬件。学校创客工坊的同学们想要制作一个“倒车防撞报警小车”，要求小车在倒退过程中能够实时发射并接收高频声波反射，从而精确测量与后方障碍物之间的厘米级物理距离。他们应当选用下列哪一种传感器？", "options": {"A": "超声波测距传感器（Ultrasonic Sensor）", "B": "光敏电阻光照传感器（Photoresistor / LDR）", "C": "湿度传感器（Humidity Sensor）", "D": "火焰传感器（Flame Sensor）"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 常见传感器类型与应用", "analysis": "超声波传感器（如常见的 HC-SR04）通过发射 40kHz 高频声波并计算接收到反射回波的时间差（声速物理原理），能够精确计算出前方障碍物的相对物理距离，广泛应用于智能避障小车、汽车倒车雷达及无人机定高悬停。"}, {"id": 42, "chapter": "第5章 物联网与其应用", "question": "在移动互联网时代，二维码（QR Code）全面取代了传统的一维条形码（Barcode）。关于 QR Code 较传统条形码所具备的核心优势，下列叙述何者错误？", "options": {"A": "QR Code 在水平和垂直两个维度上均能存储数据，信息容量呈几何级数提升", "B": "QR Code 能够直接编码包含中文汉字、特殊符号以及完整的网页 URL 超链接", "C": "QR Code 具有纠错编码能力，即使表面产生污损或破损一定比例，依然能够被正常识读", "D": "QR Code 必须依赖专用的激光扫码枪接触才能扫描，普通智能手机的摄像头完全无法识别"}, "answer": "D", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 二维码技术优势与纠错机制", "analysis": "选项 D 错误：QR Code 最大的普及优势正是其兼容性，任何带有摄像头的普通智能手机均可直接拍照识别解析；一维条码只能横向存储极少量数字编号，而 QR Code 支持二维存储、大容量、汉字支持以及高达 7%~30% 的 Reed-Solomon 容错纠错能力。"}, {"id": 43, "chapter": "第5章 物联网与其应用", "question": "智能手环或智能手表需要持续监测佩戴者的心率与步数，并通过无线电与手机同步数据，同时要求一颗微型纽扣电池或小容量锂电池能够维持数天甚至数周的续航。为了达到这一超低功耗目标，手环与手机之间最适合采用的短距离无线通信技术是：", "options": {"A": "低功耗蓝牙（Bluetooth Low Energy, BLE）", "B": "红外线通信（IrDA）", "C": "高速光纤通信", "D": "千兆以太网有线连接"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 短距离无线通信协议 (BLE)", "analysis": "低功耗蓝牙（BLE / Bluetooth Smart）专门为低功耗、间歇性小数据传输设计，设备在待机时处于深度休眠模式，仅在传输数据的毫秒级瞬间激活，功耗极低（微安级别），非常适合智能手环、健康监护仪、智能防丢器等可穿戴设备。"}, {"id": 44, "chapter": "第5章 物联网与其应用", "question": "在物联网轻量级通信协议中，MQTT 协议被广泛应用于传感器与云端服务器之间的低开销数据交互。MQTT 协议采用的核心架构通信模式是：", "options": {"A": "点对点对等下载模式（P2P）", "B": "发布 / 订阅模式（Publish / Subscribe）通过中介代理（Broker）进行消息分发", "C": "主从式广播全网盲发模式", "D": "轮询查询数据库死循环模式"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 物联网轻量通信协议 (MQTT)", "analysis": "MQTT 是一种基于“发布/订阅（Publish/Subscribe）”模式的超轻量级消息传输协议，由消息代理（Broker）充当中枢。传感器作为发布者（Publisher）向特定主题（Topic）发布数据，订阅了该主题的客户端（Subscriber）即可接收数据，具备极小的报文头部开销与弱网自适应能力。"}, {"id": 45, "chapter": "第5章 物联网与其应用", "question": "一个典型的智能家居闭环联动系统由感知、决策与执行三个关键部分组成。当智能客厅系统检测到“傍晚光线变暗且室内有人走动时，自动开启客厅吊灯”这一场景中，承担“执行动作”角色的设备是：", "options": {"A": "光敏传感器", "B": "人体红外感应探头（PIR）", "C": "控制吊灯通断电的智能继电器 / 智能开关", "D": "家庭无线 Wi-Fi 路由器"}, "answer": "C", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 物联网执行器 (Actuator) 识别", "analysis": "传感器负责感知物理环境状态（光敏传感器与人体红外探头负责输入）；家庭网关或控制器负责逻辑决策；而真正负责将电信号转化为物理机械或电路动作（如通断电、亮灯、开窗帘、抽水）的部件是执行器（Actuator），本题中为智能继电器/智能开关。"}, {"id": 46, "chapter": "第5章 物联网与其应用", "question": "射频识别系统（RFID）能够实现非接触式自动目标识别与数据读取。一个完整的标准 RFID 系统通常必须由下列哪三大核心部分组成？", "options": {"A": "摄像头、红外补光灯、显示器", "B": "电子标签（Tag / Transponder）、读写器（Reader）以及后端数据处理计算机系统", "C": "调制解调器、电话线、打印机", "D": "麦克风、扬声器、音频声卡"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · RFID 系统三大基本组成", "analysis": "RFID 系统的三大基本组成组件：1. 电子标签（Tag，由耦合元件及微芯片组成，内置天线用于存储识别数据）；2. 读写器（Reader，用于无接触发射电磁波激活标签并读取或写入数据）；3. 数据处理计算机系统（负责接收读写器数据并执行业务管理）。"}, {"id": 47, "chapter": "第5章 物联网与其应用", "question": "在工业物联网（IIoT）与智能制造领域，工程师利用传感器收集物理实体设备的全生命周期运行参数，并在虚拟计算机软件空间中构建一个与现实实体完全镜像、1:1 实时动态映射的虚拟数字模型，用于预测设备故障和仿真优化。这一前沿技术被称为：", "options": {"A": "数字孪生（Digital Twin）", "B": "区块链（Blockchain）", "C": "比特币挖矿（Bitcoin Mining）", "D": "全息投影（Holography）"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 前沿概念 (数字孪生 Digital Twin)", "analysis": "数字孪生（Digital Twin）是充分利用物理模型、传感器更新、运行历史等数据，集成多学科、多物理量的仿真过程，在虚拟空间中完成对物理实体的映射，反映相对应实体装备的全生命周期过程，被广泛应用于智能制造、智慧风电场与跨海大桥的预测性维护。"}, {"id": 48, "chapter": "第5章 物联网与其应用", "question": "智慧医疗（Smart Healthcare）是物联网技术造福人类社会的重大应用领域。下列各项技术场景中，属于物联网在智慧医疗中典型应用的是：\nI. 医院为住院患者佩戴内置 RFID 的智能腕带，实现用药核验与病人精准身份识别\nII. 穿戴式连续血糖监测仪（CGM）实时将患者血糖数据通过蓝牙同步至医生云端工作台\nIII. 智能输液器通过液位传感器监测药水滴速，并在输液即将见底时自动给护士站发送蜂鸣报警\nIV. 利用普通文字处理软件编写一篇关于医学历史的期末论文", "options": {"A": "I、II", "B": "I、II、III", "C": "II、III、IV", "D": "I、II、III、IV"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 智慧医疗物联网典型应用", "analysis": "场景 I（RFID 医疗腕带核验身份）、II（穿戴式传感器连续生命体征监护）、III（智能输液液位感应与自动告警）均是物联网传感器与网络传输在智慧医疗中的典型成功应用；IV 属于普通的办公文字处理，不属于物联网应用范畴。"}, {"id": 49, "chapter": "第5章 物联网与其应用", "question": "随着智慧城市路灯、环境监测站以及工业机房数以万计的物联网传感器不断产生海量时间序列数据（Time Series Data），若仅由人工肉眼查看报表已无法应付。物联网与下列哪两项关键信息技术的深度融合，能够实现对海量设备运行状态的自动化异常模式识别与未来趋势预测？", "options": {"A": "大数据分析（Big Data）与人工智能（Artificial Intelligence, AI）", "B": "机械式打字机技术与缩微胶卷技术", "C": "传统手工簿记记账与电话电报网络", "D": "CRT 显示器消磁技术与软盘拷贝技术"}, "answer": "A", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 物联网、大数据与人工智能的融合", "analysis": "物联网（IoT）负责全方位“数据采集与感知连接”，大数据（Big Data）负责海量时序数据的“存储与分布式处理”，而人工智能（AI）则负责从海量数据中“提取价值模型并执行智能预测”（AIoT 人工智能物联网），三者融合构成了现代智能系统的大脑与神经中枢。"}, {"id": 50, "chapter": "第5章 物联网与其应用", "question": "家用智能音箱、联网婴儿监视器以及智能门锁等消费级物联网设备在带来生活便利的同时，也带来了前所未有的隐私与信息安全隐患。从使用者防范角度出发，购买并安装新的家用物联网设备后，最关键、最应当首先执行的安全防护措施是：", "options": {"A": "长期保留厂家出厂的默认用户名与初始密码（如 admin/admin 或 123456）以防遗忘", "B": "立即更改设备的出厂默认管理密码，并及时为设备固件升级安装最新的安全补丁（Firmware Updates）", "C": "在设备上方覆盖一层厚毛巾以阻挡无线电波发射", "D": "将设备的管理后台端口直接暴露在公网且关闭所有登录验证"}, "answer": "B", "source": "董总高中资讯科技第二册 · 第5章 物联网与其应用 · 物联网设备安全防范策略", "analysis": "海量消费级物联网设备沦为黑客僵尸网络肉鸡的最主要原因，就是用户使用出厂默认弱口令（如 admin/admin）且从未更新固件。最基本且最关键的第一防线是：立即修改复杂且独特的专属管理密码，并定期检查并更新官方固件补丁以修复已知漏洞。"}];

        let currentActiveSet = 1;

        const SUPABASE_URL = "https://wjabyyystvtyanqncmcf.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqYWJ5eXlzdHZ0eWFucW5jbWNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2ODA3NzYsImV4cCI6MjEwNzI1Njc3Nn0.39gXbYKXk4t6iNf747BmRjuIR_aZB9Qb8la9LUTHaV8";
        const PAGE_PASS = "sinmin888";

        let allSubmissions = [];

        function checkPageSecurity() {
            const val = document.getElementById('gatePwdInput').value.trim();
            if (val === PAGE_PASS) {
                sessionStorage.setItem('teacher_auth_token', PAGE_PASS);
                document.getElementById('pageSecurityOverlay').style.display = 'none';
                initDashboard();
            } else {
                document.getElementById('gateErrMsg').style.display = 'block';
            }
        }

        function lockPage() {
            sessionStorage.removeItem('teacher_auth_token');
            document.getElementById('pageSecurityOverlay').style.display = 'flex';
            document.getElementById('gatePwdInput').value = '';
            document.getElementById('gateErrMsg').style.display = 'none';
        }

        document.getElementById('gatePwdInput').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') checkPageSecurity();
        });

        function switchDashboardSet(setNum) {
            currentActiveSet = setNum;
            currentQuestions = (setNum === 2) ? questions_set2 : questions_set1;
            document.getElementById('btnToggleSet1').className = (setNum === 1) ? 'btn-toggle-set active' : 'btn-toggle-set';
            document.getElementById('btnToggleSet2').className = (setNum === 2) ? 'btn-toggle-set active' : 'btn-toggle-set';
            document.getElementById('labelWrongSet').innerText = (setNum === 1) ? '第一套' : '第二套';
            
            calculateStats();
            renderTopWrongQuestions();
            renderSubmissionsDashboard(allSubmissions);
        }

        async function fetchSubmissionsFromSupabase() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/exam_submissions?select=*&order=created_at.desc`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });
                if (res.ok) {
                    allSubmissions = await res.json();
                } else {
                    allSubmissions = getFallbackMockData();
                }
            } catch (err) {
                allSubmissions = getFallbackMockData();
            }
            calculateStats();
            renderTopWrongQuestions();
            renderSubmissionsDashboard(allSubmissions);
        }

        function getFallbackMockData() {
            const local = localStorage.getItem('mock_submissions');
            if (local) {
                try { return JSON.parse(local); } catch(e) {}
            }
            return [];
        }

        function calculateStats() {
            questionStats = {};
            currentQuestions.forEach(q => {
                questionStats[q.id] = { wrongCount: 0, total: allSubmissions.length };
            });

            allSubmissions.forEach(sub => {
                const ans = sub.answers || {};
                currentQuestions.forEach(q => {
                    if (ans[q.id] !== q.answer) {
                        questionStats[q.id].wrongCount++;
                    }
                });
            });
        }

        function renderTopWrongQuestions() {
            const card = document.getElementById('wrongRankCard');
            const grid = document.getElementById('wrongItemsGrid');
            if (allSubmissions.length === 0) {
                card.style.display = 'none';
                return;
            }

            const sorted = currentQuestions.map(q => {
                const st = questionStats[q.id] || { wrongCount: 0 };
                const rate = Math.round((st.wrongCount / allSubmissions.length) * 100);
                return { q, rate, wrongCount: st.wrongCount };
            }).sort((a, b) => b.rate - a.rate);

            const top5 = sorted.slice(0, 5);
            grid.innerHTML = '';

            top5.forEach(item => {
                const div = document.createElement('div');
                div.className = 'wrong-item';
                div.onclick = () => {
                    const targetPage = (currentActiveSet === 2) 
                        ? 'teacher_answers_set2.html'
                        : 'teacher_answers.html';
                    window.open(`${targetPage}#q-card-${item.q.id}`, '_blank');
                };

                div.innerHTML = `
                    <div class="wrong-item-top">
                        <span class="wrong-q-badge">第 ${item.q.id} 题</span>
                        <span class="wrong-rate-badge">错误率 ${item.rate}% (${item.wrongCount}人错)</span>
                    </div>
                    <div class="wrong-q-text">${item.q.question.split('\n')[0]}</div>
                `;
                grid.appendChild(div);
            });

            card.style.display = 'block';
        }

        function renderSubmissionsDashboard(list) {
            document.getElementById('submissionsCountBadge').innerText = list.length;
            document.getElementById('metricTotalSubmissions').innerText = list.length;

            if (list.length === 0) {
                document.getElementById('submissionsTableBody').innerHTML = `
                    <tr><td colspan="8" style="text-align:center; color:#94a3b8; padding:35px;">暂无学生提交试卷，学生在线交卷后将实时汇总在此处。</td></tr>
                `;
                document.getElementById('metricAvgScore').innerText = "0.0";
                document.getElementById('metricPassRate').innerText = "0%";
                document.getElementById('metricMaxScore').innerText = "0";
                return;
            }

            let totalScore = 0;
            let passCount = 0;
            let maxScore = 0;

            list.forEach(item => {
                totalScore += item.score;
                if (item.score >= 60) passCount++;
                if (item.score > maxScore) maxScore = item.score;
            });

            const avgScore = (totalScore / list.length).toFixed(1);
            const passRate = Math.round((passCount / list.length) * 100);

            document.getElementById('metricAvgScore').innerText = avgScore;
            document.getElementById('metricPassRate').innerText = passRate + "%";
            document.getElementById('metricMaxScore').innerText = maxScore;

            const tbody = document.getElementById('submissionsTableBody');
            tbody.innerHTML = '';

            list.forEach((s, idx) => {
                const tr = document.createElement('tr');
                const isPass = s.score >= 60;
                const mins = Math.floor((s.time_spent || 0) / 60);
                const secs = (s.time_spent || 0) % 60;
                const timeStr = `${mins}分${secs}秒`;
                const dateStr = s.created_at ? new Date(s.created_at).toLocaleString('zh-CN', { hour12: false }) : '--';

                tr.innerHTML = `
                    <td>${idx + 1}</td>
                    <td><strong>${s.student_name || '考生'}</strong></td>
                    <td>${s.student_class || '高二'}</td>
                    <td>${s.student_id || '--'}</td>
                    <td><span class="score-pill ${isPass ? 'pass' : 'fail'}">${s.score} 分</span></td>
                    <td>${timeStr}</td>
                    <td style="font-size:0.85rem; color:#64748b;">${dateStr}</td>
                    <td><button class="btn-view-paper" onclick="openStudentDrawer(${idx})">🔍 调阅答卷</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterStudentsTable() {
            const kw = document.getElementById('filterStudentInput').value.trim().toLowerCase();
            const filtered = allSubmissions.filter(s => 
                (s.student_name && s.student_name.toLowerCase().includes(kw)) || 
                (s.student_id && s.student_id.toLowerCase().includes(kw)) ||
                (s.student_class && s.student_class.toLowerCase().includes(kw))
            );
            renderSubmissionsDashboard(filtered);
        }

        function openStudentDrawer(index) {
            const s = allSubmissions[index];
            if (!s) return;

            document.getElementById('drawerStudentName').innerText = `学生答卷：${s.student_name}（得分：${s.score}分）`;
            document.getElementById('drawerStudentMeta').innerText = `班级：${s.student_class || '--'} · 学号：${s.student_id || '--'} · 提交时间：${new Date(s.created_at).toLocaleString()}`;

            const container = document.getElementById('drawerQuestionsContent');
            container.innerHTML = '';

            currentQuestions.forEach(q => {
                const studentChoice = s.answers ? s.answers[q.id] : null;
                const isRight = (studentChoice === q.answer);

                const itemDiv = document.createElement('div');
                itemDiv.style.padding = '12px 14px';
                itemDiv.style.borderRadius = '8px';
                itemDiv.style.marginBottom = '12px';
                itemDiv.style.background = isRight ? '#f0fdf4' : '#fef2f2';
                itemDiv.style.border = isRight ? '1px solid #bbf7d0' : '1px solid #fecaca';

                itemDiv.innerHTML = `
                    <div style="font-weight:600; font-size:0.92rem; margin-bottom:6px;">
                        ${q.id}. ${q.question.split('\n')[0]}
                    </div>
                    <div style="font-size:0.85rem; display:flex; gap:16px;">
                        <span>学生选择：<strong style="color:${isRight ? '#059669' : '#dc2626'};">${studentChoice || '未作答'}</strong></span>
                        <span>标准答案：<strong style="color:#059669;">${q.answer}</strong></span>
                        <span style="font-weight:700; color:${isRight ? '#059669' : '#dc2626'};">${isRight ? '✓ 正确(+2分)' : '✗ 错误(0分)'}</span>
                    </div>
                `;
                container.appendChild(itemDiv);
            });

            document.getElementById('studentDrawer').style.display = 'flex';
        }

        function closeStudentDrawer() {
            document.getElementById('studentDrawer').style.display = 'none';
        }

        function exportToCSV() {
            if (allSubmissions.length === 0) {
                alert("当前暂无数据可导出！");
                return;
            }
            let csv = "序号,姓名,班级,学号,得分,用时(秒),提交时间\n";
            allSubmissions.forEach((s, i) => {
                csv += `${i+1},"${s.student_name || ''}","${s.student_class || ''}","${s.student_id || ''}",${s.score || 0},${s.time_spent || 0},"${s.created_at || ''}"\n`;
            });
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `高中资讯科技_第二册测验学生成绩表_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }

        function initDashboard() {
            fetchSubmissionsFromSupabase();
        }

        if (sessionStorage.getItem('teacher_auth_token') === PAGE_PASS) {
            document.getElementById('pageSecurityOverlay').style.display = 'none';
            initDashboard();
        }
    </script>
</body>
</html>
